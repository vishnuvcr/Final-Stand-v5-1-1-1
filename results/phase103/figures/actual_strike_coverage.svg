<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Maximum observed actual-strike timestamp coverage across four rolling-option panels</title>
  <desc id="desc">The best per-strike timestamp coverage in a five-session union: ICICIBANK CALL 100 percent; RELIANCE CALL 99.065 percent; RELIANCE PUT 99.065 percent; SBIN CALL 94.130 percent. These are not expiry-verified fixed-contract histories.</desc>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="42" y="38" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#20242b">Best single-strike coverage within rolling-offset union</text>
  <text x="42" y="64" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555e6b">Five IST sessions • 1,925 union timestamps per panel • expiry identity not verified</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#59616c">
    <text x="310" y="103">0%</text><text x="475" y="103">25%</text><text x="640" y="103">50%</text><text x="805" y="103">75%</text><text x="930" y="103">100%</text>
  </g>
  <g stroke="#e1e5ea" stroke-width="1">
    <line x1="310" y1="114" x2="310" y2="315"/><line x1="475" y1="114" x2="475" y2="315"/><line x1="640" y1="114" x2="640" y2="315"/><line x1="805" y1="114" x2="805" y2="315"/><line x1="970" y1="114" x2="970" y2="315"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#20242b">
    <text x="42" y="151">ICICIBANK CALL</text><text x="42" y="201">RELIANCE CALL</text><text x="42" y="251">RELIANCE PUT</text><text x="42" y="301">SBIN CALL</text>
  </g>
  <g fill="#d9e2ee">
    <rect x="310" y="129" width="660" height="28" rx="3"/><rect x="310" y="179" width="660" height="28" rx="3"/><rect x="310" y="229" width="660" height="28" rx="3"/><rect x="310" y="279" width="660" height="28" rx="3"/>
  </g>
  <g fill="#345f8c">
    <rect x="310" y="129" width="660" height="28" rx="3"/><rect x="310" y="179" width="653.83" height="28" rx="3"/><rect x="310" y="229" width="653.83" height="28" rx="3"/><rect x="310" y="279" width="621.26" height="28" rx="3"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#20242b">
    <text x="910" y="148" text-anchor="end" fill="#ffffff">100.000%</text><text x="950" y="198" text-anchor="end" fill="#ffffff">99.065%</text><text x="950" y="248" text-anchor="end" fill="#ffffff">99.065%</text><text x="918" y="298" text-anchor="end" fill="#ffffff">94.130%</text>
  </g>
  <text x="42" y="354" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#59616c">Interpretation: coverage counts for the best observed strike, not a validation of contract expiry, quote executability, or permission to use data.</text>
  <text x="42" y="376" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7a8490">Source: Phase 103 aggregate audit, run 38124954633. No raw price/OI/volume rows shown.</text>
</svg>