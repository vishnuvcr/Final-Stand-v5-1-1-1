<text x="54" y="485" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Primary comparison: M2 vs M4</text>
<text x="54" y="511" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">M2 − M4 = −0.1708 bps; 95% session-cluster bootstrap CI −0.2299 to −0.1152.</text>
<text x="54" y="535" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">The interval is entirely below zero: the combined synthetic-forward/OI block worsened MAE on this sample.</text>
<text x="54" y="555" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Source: Phase 92 aggregate results. Predictor study only; not strategy P&amp;L or actual traded FUTIDX basis.</text>
