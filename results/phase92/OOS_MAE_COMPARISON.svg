<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Phase 92 out-of-sample MAE comparison</title>
<desc id="desc">Horizontal bars compare mean absolute error for spot plus VIX, spot plus VIX plus ATM implied volatility, a synthetic-forward proxy extension, and an OI imbalance extension. A lower MAE is better.</desc>
<rect width="1000" height="570" fill="#ffffff"/>
<text x="54" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Phase 92 — Q4 2022 OOS MAE</text>
<text x="54" y="73" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Target: absolute next-15-minute NIFTY spot return magnitude · lower is better</text>
<text x="54" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5563">MAE (basis points)</text>
