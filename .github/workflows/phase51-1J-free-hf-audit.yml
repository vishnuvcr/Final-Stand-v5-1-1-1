name: Phase 51-1J Free HF Data Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "trigger/phase51_1J_free_hf.start"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-51-1J-tradingtick-source-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pandas pyarrow huggingface_hub
      - name: Cache Hugging Face files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase51-1J-free-hf-${{ runner.os }}-${{ hashFiles('research/phase51_1J_free_hf_audit.py') }}
          restore-keys: |
            phase51-1J-free-hf-${{ runner.os }}-
      - name: Audit the two candidate Parquet files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase51_1J_free_hf_audit.py
      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-1J-free-hf-audit-${{ github.run_id }}
          path: results/phase51/phase51_1J_free_hf_audit/
          if-no-files-found: warn
      - name: Publish metadata only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d results/phase51/phase51_1J_free_hf_audit ]; then git add results/phase51/phase51_1J_free_hf_audit/; fi
          if git diff --cached --quiet; then
            echo "No audit metadata to publish"
          else
            git commit -m "Phase 51-1J: publish free HF source audit metadata"
            git push origin HEAD:phase-51-1J-tradingtick-source-audit
          fi
