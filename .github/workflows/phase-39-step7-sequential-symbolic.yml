name: Phase 39 - Step 7 Sequential Symbolic Replay

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_sequential_symbolic.py'
      - 'results/phase39_symbolic/summary.json'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_counterfactual/fixed_opportunity_ledger.csv'
      - 'results/phase39_data/development_control_trades_2021_2023.csv'
      - 'results/phase39_data/frozen_control_trades_2024_2026-06-30.csv'
      - '.github/workflows/phase-39-step7-sequential-symbolic.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step7-seq-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  symbolic_seq:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase39-hf-symseq-${{ runner.os }}-${{ hashFiles('research/phase39_sequential_symbolic.py') }}
          restore-keys: |
            phase39-hf-seq-${{ runner.os }}-
            phase39-hf-${{ runner.os }}-
      - run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow numpy scipy requests huggingface_hub
      - name: Run sequential symbolic replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase39_sequential_symbolic.py
      - name: Verify sequential symbolic
        run: |
          test -f results/phase39_sequential_policy/summary.json
          test -f results/phase39_sequential_policy/period_summary.csv
          python - <<'PY'
          import json,pandas as pd
          s=json.load(open('results/phase39_sequential_policy/summary.json'))
          p=pd.read_csv('results/phase39_sequential_policy/period_summary.csv')
          assert s['status']=='COMPLETE'
          assert s['model']=='candidate_credit_diff_symbolic'
          assert s['margin']==0.0
          assert s['uncertainty_z']==1.0
          assert set(p.period)=={'development','validation','holdout'}
          print(json.dumps(s,indent=2))
          print(p.to_string(index=False))
          PY
      - name: Persist sequential symbolic evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_sequential_policy
          git commit -m 'Phase 39: persist sequential symbolic replay' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
