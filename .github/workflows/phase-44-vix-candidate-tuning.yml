name: Phase 44 - VIX Candidate Tuning

on:
  push:
    branches:
      - phase-44-vix-candidate-tuning
    paths:
      - "trigger/phase44.start"
      - "research/phase44_vix_tuning.py"
      - "PHASE44_RESEARCH_PLAN.md"
      - "PHASE44_PRE_REGISTRATION.md"
  pull_request:
    paths:
      - "trigger/phase44.start"
      - "research/phase44_vix_tuning.py"
      - "PHASE44_RESEARCH_PLAN.md"
      - "PHASE44_PRE_REGISTRATION.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase44-vix-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase44-hf-${{ runner.os }}-v1
          restore-keys: |
            phase43-hf-${{ runner.os }}-
            phase44-hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas pyarrow scipy huggingface_hub

      - name: Syntax audit
        run: |
          python -m py_compile research/phase44_vix_tuning.py

      - name: Preflight
        run: |
          test -s data/phase40_vix/india_vix.csv
          test -s results/phase43_vix/corrected_strategy_trade_matrix_all_splits.csv || true
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/phase40_vix/india_vix.csv")
          assert len(x) >= 1000, len(x)
          print("VIX cache rows:", len(x))
          PY

      - name: Run Phase 44 tuning
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python research/phase44_vix_tuning.py
          code=$?
          if [ "$code" -ne 0 ]; then
            printf "\n## F44-RUN-${GITHUB_RUN_ID} — numerical execution failure\n- Exit code: %s. Failed output is non-evidence.\n" "$code" >> ERROR_LOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ERROR_LOG.md
            git commit -m "phase44: log failed numerical run ${GITHUB_RUN_ID}" || true
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" || true
            exit "$code"
          fi

      - name: Artifact audit
        run: |
          test -s results/phase44_vix_tuning/stage1_structure_time_matrix.csv
          test -s results/phase44_vix_tuning/stage1_candidates.csv
          test -s results/phase44_vix_tuning/frozen_stage1.csv
          test -s results/phase44_vix_tuning/frozen_stage1_holdout.csv
          test -s results/phase44_vix_tuning/summary.json
          test -s results/phase44_vix_tuning/data_errors.csv
          test -s results/phase44_vix_tuning/stage1_all_dev_profiles.csv

      - name: Log artifact audit failure
        if: failure()
        run: |
          printf "\n## F44-AUDIT-${GITHUB_RUN_ID} — artifact audit failure\n- Artifact audit did not pass; numerical output is non-evidence until a corrected run passes all audits.\n" >> ERROR_LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ERROR_LOG.md
          git commit -m "phase44: log artifact audit failure ${GITHUB_RUN_ID}" || true
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" || true
      - name: Finalize status and research log
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path("results/phase44_vix_tuning/summary.json").read_text())
          status = f"""# Phase 44 Status — VIX Candidate Tuning

          **{s['status']}**

          - Stage-1 strategy/geometry/time rows: {s['stage1_rows']}
          - Stage-1 VIX-conditioned candidate rows: {s['candidate_rows']}
          - Frozen validation-eligible candidates: {s['frozen_candidates']}
          - Holm survivors: {s['holm_survivors']}
          - Holdout opened after Stage-1 freeze: {s['holdout_opened_after_freeze']}
          - Decision: **{s['decision']}**

          Stage-2 active-exit tuning remains pending unless explicitly opened by a later registered update. The canonical Phase-20/42 strategy remains unchanged.
          """
          Path("PHASE44_STATUS.md").write_text(status)
          with Path("RESEARCH_LOG.md").open("a") as f:
              f.write(
                  f"\n\n## 2026-10-06 — Phase 44 numerical run {os.environ.get('GITHUB_RUN_ID','unknown')}\n"
                  f"- Stage-1 candidate tuning completed: rows={s['stage1_rows']}, candidate rows={s['candidate_rows']}, frozen={s['frozen_candidates']}, Holm survivors={s['holm_survivors']}.\n"
                  f"- Holdout was opened only after the Stage-1 freeze: {s['holdout_opened_after_freeze']}.\n"
                  f"- Current decision: {s['decision']}.\n"
              )
          PY

      - name: Persist accepted artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" || true
          git add results/phase44_vix_tuning PHASE44_STATUS.md RESEARCH_LOG.md
          git commit -m "phase44: persist VIX tuning results" || true
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
