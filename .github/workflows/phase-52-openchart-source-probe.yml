name: Phase 52 — OpenChart bounded source probe

on:
  workflow_dispatch:
  push:
    branches:
      - phase-52-factor-conditioned-strategy-discovery
    paths:
      - ".github/workflows/phase-52-openchart-source-probe.yml"
      - "research/phase52/openchart_source_probe.py"

permissions:
  contents: write

concurrency:
  group: phase52-openchart-source-probe
  cancel-in-progress: false

jobs:
  bounded-openchart-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 52 branch
        uses: actions/checkout@v4
        with:
          ref: phase-52-factor-conditioned-strategy-discovery
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned OpenChart source and dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "git+https://github.com/marketcalls/openchart.git@a207108890c96a9830b35a8d15442c896ea0a9d6"

      - name: Run probe-quality self-tests without network access
        run: python research/phase52/openchart_source_probe.py --self-test-only

      - name: Run bounded source smoke test
        env:
          OPENCHART_OUTPUT_DIR: results/phase52/openchart_probe/runs/${{ github.run_id }}
        run: python research/phase52/openchart_source_probe.py

      - name: Upload aggregate probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase52-openchart-probe-${{ github.run_id }}
          path: results/phase52/openchart_probe/runs/${{ github.run_id }}/probe_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist only the unique aggregate report
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          REPORT="results/phase52/openchart_probe/runs/$GITHUB_RUN_ID/probe_report.json"
          if [ ! -f "$REPORT" ]; then
            echo "No report generated; preserving the failing workflow logs and artifact state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if git diff --cached --quiet; then
            echo "No new report to commit."
            exit 0
          fi
          git commit -m "Store bounded OpenChart probe report run $GITHUB_RUN_ID"
          git fetch origin phase-52-factor-conditioned-strategy-discovery
          git rebase origin/phase-52-factor-conditioned-strategy-discovery
          git push origin HEAD:phase-52-factor-conditioned-strategy-discovery
