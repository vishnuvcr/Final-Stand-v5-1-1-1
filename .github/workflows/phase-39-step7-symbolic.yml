name: Phase 39 - Step 7 Constrained Symbolic Search

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_symbolic_search.py'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_counterfactual/fixed_opportunity_ledger.csv'
      - '.github/workflows/phase-39-step7-symbolic.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy scipy scikit-learn
      - name: Run constrained symbolic search
        run: python research/phase39_symbolic_search.py
      - name: Verify Step 7
        run: |
          test -f results/phase39_symbolic/summary.json
          test -f results/phase39_symbolic/symbolic_grammar_grid.csv
          python - <<'PY'
          import json, pandas as pd
          s=json.load(open('results/phase39_symbolic/summary.json'))
          g=pd.read_csv('results/phase39_symbolic/symbolic_grammar_grid.csv')
          assert s['status']=='COMPLETE'
          assert s['holdout_evaluated'] is False
          assert len(g)>0
          assert s['selected_margin'] in [0.0,250.0,500.0]
          print(json.dumps(s,indent=2))
          print(g.head(10).to_string(index=False))
          PY
      - name: Persist Step 7 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_symbolic
          git commit -m 'Phase 39: persist constrained symbolic screen' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
