name: Phase 7 Fixed OTM15 Primary Backtest

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_PHASE7]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-fixed-otm15-v3-v1
          restore-keys: |
            hf-nifty-options-fixed-otm15-v3-
      - name: Run fixed OTM15 backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/backtest_fixed_otm15.py
      - name: Persist Phase 7 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/fixed_otm15_v3
          git commit -m 'Phase 7: persist fixed OTM15 backtest results' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
