name: Phase 51-1A - Spot Source Validation and Fallback Gate
on:
  workflow_dispatch:
  push:
    branches: [phase-51-1-cost-data-calibration]
    paths:
      - trigger/phase51_1_spot_fallback.start
      - research/phase51_1_spot_fallback.py
      - research/phase51_1_spot_overlap.py
      - research/phase51_1_third_spot_audit.py
      - .github/workflows/phase51-1A-spot-fallback.yml
permissions:
  contents: write
jobs:
  fallback_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase51-1-hf-${{ runner.os }}-v1
      - name: Install data tools
        run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow huggingface_hub
      - name: Acquire and audit fallback
        id: fallback_acquisition
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase51_1_spot_fallback.py
      - name: Compare primary and fallback overlap
        if: always()
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase51_1_spot_overlap.py
      - name: Triangulate with independent GitHub spot source
        if: always()
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase51_1_third_spot_audit.py
      - name: Upload fallback source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-1-spot-fallback-data
          path: |
            data/phase51/spot_fallback.parquet
            results/phase51/spot_fallback_manifest.json
            results/phase51/spot_overlap_audit.json
            results/phase51/spot_fallback_gate.json
            results/phase51/third_spot_audit.json
            results/phase51/third_spot_gate.json
            data/phase51/third_spot/
          if-no-files-found: error
          retention-days: 14
      - name: Freeze validated spot source
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          third_gate=json.load(open('results/phase51/third_spot_gate.json'))
          third=json.load(open('results/phase51/third_spot_audit.json'))
          rejected=json.load(open('results/phase51/spot_fallback_manifest.json'))
          assert third_gate.get('PASS') is True, third_gate
          selected=third['source']
          freeze={
              'status':'PASS',
              'selected_source':selected,
              'selected_oos_window':third['oos_window'],
              'selected_oos_rows':third['oos_rows'],
              'selected_first_timestamp':third['oos_first_timestamp'],
              'selected_last_timestamp':third['oos_last_timestamp'],
              'selected_bad_days':third['bad_days'],
              'direct_primary_overlap':third['primary_overlap'],
              'direct_primary_overlap_gate':third['primary_overlap_gate'],
              'fallback_overlap':third['fallback_overlap'],
              'fallback_overlap_gate':third['fallback_overlap_gate'],
              'rejected_fallback_source':rejected['source'],
              'rejected_fallback_coverage_gate':rejected['coverage_gate'],
              'rejected_fallback_short_session_failures':rejected['short_session_failures'],
              'selection_basis':'data-quality evidence only; frozen before any OOS strategy P&L calculation'
          }
          Path('results/phase51/validated_spot_source.json').write_text(json.dumps(freeze,indent=2))
          print(json.dumps(freeze,indent=2))
          PY
      - name: Publish audited gate
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase51
          git commit -m "Phase 51-1A: publish validated spot source"
          git fetch origin phase-51-1-cost-data-calibration
          git rebase origin/phase-51-1-cost-data-calibration
          git push origin HEAD:phase-51-1-cost-data-calibration
