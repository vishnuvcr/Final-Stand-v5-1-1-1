name: Phase 39 - Step 6 Online Hedge Expert Aggregation

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_online_hedge.py'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_counterfactual/fixed_opportunity_ledger.csv'
      - '.github/workflows/phase-39-step6-online-hedge.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step6-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  hedge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy scikit-learn
      - name: Run online Hedge screen
        run: python research/phase39_online_hedge.py
      - name: Verify Step 6
        run: |
          test -f results/phase39_hedge_screen/summary.json
          test -f results/phase39_hedge_screen/development_hedge_grid.csv
          python - <<'PY'
          import json, pandas as pd
          s=json.load(open('results/phase39_hedge_screen/summary.json'))
          d=pd.read_csv('results/phase39_hedge_screen/development_hedge_grid.csv')
          assert s['status']=='COMPLETE'
          assert s['holdout_evaluated'] is False
          assert len(d)==27
          assert s['selected_margin'] in [0.0,250.0,500.0]
          assert s['validation_uplift']>=0
          print(json.dumps(s,indent=2))
          print(d.head(10).to_string(index=False))
          PY
      - name: Persist Step 6 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_hedge_screen
          git commit -m 'Phase 39: persist online Hedge screen' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
