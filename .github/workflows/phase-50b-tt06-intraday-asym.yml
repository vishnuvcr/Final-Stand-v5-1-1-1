name: Phase 50B - TT06 Intraday Asym Premium Replay

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - trigger/phase50b_tt06.start

concurrency:
  group: phase50b-tt06-replay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preflight dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Verify TT05 dependency evidence
        run: |
          set -euo pipefail
          test -s results/phase50b/tt05_short_straddle_replay/summary.json
          test -s results/phase50b/tt05_short_straddle_replay/tt05_trades.csv
          test -f results/phase50b/tt05_short_straddle_replay/data_errors.csv
          test -f results/phase50b/tt05_short_straddle_replay/coverage_gaps.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt05_short_straddle_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt05_short_straddle_replay/tt05_trades.csv")
          er=pd.read_csv("results/phase50b/tt05_short_straddle_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt05_short_straddle_replay/coverage_gaps.csv")
          assert d["engine_revision"]=="50B-TT05-BASE-V1", d
          assert d["trades"]==len(tr) and d["trades"]>0, d
          assert d["candidate_trades"]==len(tr)+len(cg), d
          assert d["coverage_rate"]>=0.95, d
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          assert len(er)==0, er.head()
          print("TT05 dependency gate PASS", d)
          PY

  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Compile TT06 replay
        run: python -m py_compile research/phase50b_tt06_intraday_asym_replay.py
      - name: Static TT06 engine-contract audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("research/phase50b_tt06_intraday_asym_replay.py")
          tree=ast.parse(p.read_text())
          names={n.targets[0].id for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name)}
          assert "TT06_ENGINE_REV" in names
          print("TT06 engine contract PASS")
          PY
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt06-hf-${{ runner.os }}-${{ hashFiles('research/phase50b_tt06_intraday_asym_replay.py') }}
          restore-keys: |
            phase50b-tt06-hf-${{ runner.os }}-
      - name: Run TT06 replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase50b_tt06_intraday_asym_replay.py
      - name: Audit TT06 artifacts
        run: |
          set -euo pipefail
          test -s results/phase50b/tt06_intraday_asym_replay/summary.json
          test -s results/phase50b/tt06_intraday_asym_replay/tt06_trades.csv
          test -f results/phase50b/tt06_intraday_asym_replay/data_errors.csv
          test -f results/phase50b/tt06_intraday_asym_replay/coverage_gaps.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt06_intraday_asym_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt06_intraday_asym_replay/tt06_trades.csv")
          er=pd.read_csv("results/phase50b/tt06_intraday_asym_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt06_intraday_asym_replay/coverage_gaps.csv")
          assert d["engine_revision"]=="50B-TT06-BASE-V1", d
          assert d["trades"]==len(tr) and d["trades"]>0, d
          assert d["candidate_trades"]==len(tr)+len(cg), d
          assert d["coverage_rate"]>=0.95, d
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          assert len(er)==0, er.head()
          print("TT06 replay audit PASS", d)
          PY
      - name: Upload TT06 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-tt06-${{ github.run_id }}
          path: results/phase50b/tt06_intraday_asym_replay
      - name: Publish TT06 results safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R results/phase50b/tt06_intraday_asym_replay "$tmp/"
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          rm -rf results/phase50b/tt06_intraday_asym_replay
          mkdir -p results/phase50b
          cp -R "$tmp/tt06_intraday_asym_replay" results/phase50b/
          git add results/phase50b/tt06_intraday_asym_replay
          if git diff --cached --quiet; then
            echo "No TT06 result changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: publish TT06 common-cost replay"
            git push origin HEAD:phase-50b-expanded-strategy-universe
          fi

      - name: Trigger TT07 only after TT06 evidence passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          date -u +"%Y-%m-%dT%H:%M:%SZ" > trigger/phase50b_tt07.start
          git add trigger/phase50b_tt07.start
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: trigger TT07 after TT06 audit"
          git push origin HEAD:phase-50b-expanded-strategy-universe
