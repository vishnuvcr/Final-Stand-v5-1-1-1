name: Phase 9C AlgoTest Reproduction Corrected

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_PHASE9C]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-algotest-repro-v1
          restore-keys: |
            hf-nifty-options-fixed-otm15-v3-
            hf-nifty-options-
      - name: Reproduce corrected AlgoTest call and put components
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/reproduce_algotest_components.py
      - name: Persist Phase 9B results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/fixed_otm15_v3/phase9c
          git commit -m 'Phase 9C: persist corrected AlgoTest reproduction results' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
