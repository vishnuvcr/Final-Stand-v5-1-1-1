name: Phase 35 - CEEMDAN Tree Addendum

on:
  push:
    branches: [phase-35-advanced-tree-and-adaptive-prediction-search]
    paths:
      - 'research/phase35_ceemdan_addendum.py'
      - '.github/workflows/phase-35-ceemdan-addendum.yml'
  workflow_dispatch:

concurrency:
  group: phase35-ceemdan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ceemdan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scikit-learn lightgbm EMD-signal
      - name: Run CEEMDAN
        run: |
          set -o pipefail
          python research/phase35_ceemdan_addendum.py 2>&1 | tee phase35_ceemdan.log
      - name: Persist
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase35_advanced_tree_prediction data/phase35_ceemdan_features.parquet phase35_ceemdan.log
          git diff --cached --quiet || git commit -m "Phase 35: persist CEEMDAN tree addendum"
          git pull --rebase origin phase-35-advanced-tree-and-adaptive-prediction-search
          git push
      - name: Log failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo ""
            echo "## Phase 35 CEEMDAN addendum failure — run $GITHUB_RUN_ID"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Status: CEEMDAN addendum failed; output is non-evidence."
          } >> ERROR_LOG.md
          git add ERROR_LOG.md
          git diff --cached --quiet || git commit -m "Phase 35: log CEEMDAN addendum failure"
          git pull --rebase origin phase-35-advanced-tree-and-adaptive-prediction-search
          git push
