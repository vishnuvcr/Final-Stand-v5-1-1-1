name: Phase 39 - Step 5 Advanced Analog Regime Models

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_advanced_family_screen.py'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_counterfactual/fixed_opportunity_ledger.csv'
      - '.github/workflows/phase-39-step5-advanced-family.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  advanced_models:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy scipy scikit-learn
      - name: Run Step 5 advanced fixed-opportunity screen
        run: python research/phase39_advanced_family_screen.py
      - name: Verify Step 5 screen
        run: |
          test -f results/phase39_advanced_screen/advanced_model_comparison.csv
          test -f results/phase39_advanced_screen/status.json
          python - <<'PY'
          import json,pandas as pd
          s=json.load(open('results/phase39_advanced_screen/status.json'))
          z=pd.read_csv('results/phase39_advanced_screen/advanced_model_comparison.csv')
          assert s['status']=='COMPLETE'
          assert s['holdout_evaluated'] is False
          assert len(z)==3 and z.method.is_unique
          print(z.to_string(index=False))
          PY
      - name: Persist Step 5 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_advanced_screen
          git commit -m 'Phase 39: persist advanced analog/regime model screen' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
