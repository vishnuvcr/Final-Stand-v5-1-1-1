name: Phase 51-3 Orchestrator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - trigger/phase51_3_orchestrator.start

permissions:
  contents: write

jobs:
  check-marker:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.marker.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read finite-phase marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            active=true
          elif grep -q '^DONE' trigger/phase51_3_orchestrator.start; then
            active=false
          else
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Phase 51-3 active=$active (event=${{ github.event_name }})"

  run-phase:
    needs: check-marker
    if: needs.check-marker.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-51-3-available-data-strategy-sweep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase51-3-orchestrator-${{ runner.os }}-${{ hashFiles('research/phase51_3_available_data_sweep.py','research/phase51_3_primary_source_adapter.py','research/phase50b_tt02_calendar_replay_v3.py','research/phase50b_tt04_premium_match_replay.py','research/phase50b_tt05_short_straddle_replay.py') }}
          restore-keys: |
            phase51-3-orchestrator-${{ runner.os }}-
      - name: Validated NIFTY spot source cache
        uses: actions/cache@v4
        with:
          path: data/validated_spot_source
          key: phase51-3-technovusin-nifty50-spot-${{ runner.os }}-2026-10-07-v1
      - name: Acquire validated NIFTY spot source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d data/validated_spot_source/.git ]; then
            mkdir -p data
            git clone --depth 1 https://github.com/technovusin/nifty50-historical-data.git data/validated_spot_source
          fi
          test -d data/validated_spot_source/nifty/1min/2026
          find data/validated_spot_source/nifty/1min/2026 -type f -name '*.csv' -print | sort > /tmp/spot_files.txt
          test -s /tmp/spot_files.txt
          echo "Validated spot files:"
          cat /tmp/spot_files.txt
      - name: Run phase branch sweep
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          PHASE51_SPOT_ROOT: data/validated_spot_source
        run: python research/phase51_3_available_data_sweep.py
      - name: Audit
        if: always()
        run: |
          set -euo pipefail
          test -s results/phase51/available_oos/sweep_summary.json
          python - <<'PY'
          import json
          d=json.load(open("results/phase51/available_oos/sweep_summary.json"))
          print(json.dumps(d,indent=2), flush=True)
          assert d["window"] == ["2026-04-21","2026-07-21"]
          assert d.get("partial_oos_only") is True
          sm=d.get("source_manifest", {})
          assert sm.get("options_repo") == "rissin/nse-options-intraday"
          assert sm.get("options_sha256") == "bae9943b2fa99ee9c1214fb7c695b84f9f661a050a5cd04d9c5c2ffc7bc59f73"
          assert sm.get("options_bytes") == 394805617
          assert sm.get("spot_rows",0) > 0
          assert sm.get("spot_first","") <= "2026-04-21 09:15:00+05:30"
          assert sm.get("spot_last","") >= "2026-07-21 15:29:00+05:30"
          assert "2026-07-21" in sm.get("observed_expiries", [])
          expected=set(d.get("expected_candidates", []))
          assert expected == {"TT02","TT04","TT05"}, expected
          assert set(d.get("results", {})) | set(d.get("errors", {})) == expected
          for name, result in d.get("results", {}).items():
              assert "phase51_3_gate" in result, f"{name}: missing candidate quality gate"
          assert not d["errors"], d["errors"]
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-3-available-oos-${{ github.run_id }}
          path: results/phase51/available_oos
          if-no-files-found: warn
      - name: Publish artifacts to phase branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin phase-51-3-available-data-strategy-sweep
          tmp=$(mktemp -d)
          cp -R results/phase51/available_oos "$tmp/available_oos"
          git checkout -B phase-51-3-available-data-strategy-sweep origin/phase-51-3-available-data-strategy-sweep
          rm -rf results/phase51/available_oos
          mkdir -p results/phase51
          cp -R "$tmp/available_oos" results/phase51/
          git add results/phase51/available_oos
          git diff --cached --quiet || git commit -m "Phase 51-3: publish available-data OOS results"
          git push origin HEAD:phase-51-3-available-data-strategy-sweep
      - name: Mark finite diagnostic phase complete
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B phase51-3-completion-marker origin/main
          printf 'DONE %s\\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > trigger/phase51_3_orchestrator.start
          git add trigger/phase51_3_orchestrator.start
          git diff --cached --quiet || git commit -m "Phase 51-3: mark finite diagnostic sweep complete"
          git push origin HEAD:main
