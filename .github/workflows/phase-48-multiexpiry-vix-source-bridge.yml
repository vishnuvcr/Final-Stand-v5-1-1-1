name: Phase 48 - Independent Multi-Expiry VIX Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - phase-48-multiexpiry-vix-source-bridge
    paths:
      - "trigger/phase48.start"

concurrency:
  group: phase48-multiexpiry
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --no-input numpy pandas pyarrow duckdb huggingface_hub tabulate
      - name: Compile
        run: python -m py_compile research/phase48_multiexpiry_vix_bridge.py
      - name: Cache independent dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase48-hf-${{ runner.os }}-${{ hashFiles('research/phase48_multiexpiry_vix_bridge.py') }}
          restore-keys: |
            phase48-hf-${{ runner.os }}-
      - name: Run preflight
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          PHASE48_PREFLIGHT_ONLY: "1"
        run: python research/phase48_multiexpiry_vix_bridge.py
      - name: Run strategy feasibility diagnostic
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          PHASE48_DIAGNOSTIC_ONLY: "1"
        run: python research/phase48_multiexpiry_vix_bridge.py

      - name: Validate strategy diagnostic
        run: |
          test -s results/phase48_multiexpiry/diagnostic_attempts.csv
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('results/phase48_multiexpiry/diagnostic_attempts.csv')
          assert len(d)>=6
          print(d.to_string(index=False))
          print('Strategy diagnostic PASS')
          PY
      - name: Validate preflight
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          p=json.loads(pathlib.Path("results/phase48_multiexpiry/preflight.json").read_text())
          d=pd.read_csv("results/phase48_multiexpiry/preflight_monthly_checks.csv")
          md=pd.read_csv("results/phase48_multiexpiry/multi_expiry_days.csv")
          assert p["generic_multi_expiry_days"] >= 3
          assert len(d) >= 6
          print(p)
          print(d.head(20).to_string(index=False))
          print("Multi-expiry dates:", md.head(20).to_string(index=False))
          PY

  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --no-input numpy pandas pyarrow duckdb huggingface_hub tabulate
      - name: Cache independent dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase48-hf-${{ runner.os }}-${{ hashFiles('research/phase48_multiexpiry_vix_bridge.py') }}
          restore-keys: |
            phase48-hf-${{ runner.os }}-
      - name: Compile
        run: python -m py_compile research/phase48_multiexpiry_vix_bridge.py
      - name: Run numerical
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase48_multiexpiry_vix_bridge.py
      - name: Upload raw numerical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase48-raw-${{ github.run_id }}
          path: results/phase48_multiexpiry
          if-no-files-found: warn

      - name: Validate artifacts
        run: |
          set -euo pipefail
          for f in             results/phase48_multiexpiry/trade_matrix.csv             results/phase48_multiexpiry/data_errors.csv             results/phase48_multiexpiry/data_audit.json             results/phase48_multiexpiry/universe.json             results/phase48_multiexpiry/strategy_vix_summary.csv             results/phase48_multiexpiry/validation_inference.csv             results/phase48_multiexpiry/validation_working_candidates.csv             results/phase48_multiexpiry/validation_freeze.csv             results/phase48_multiexpiry/holdout_confirmation.csv             results/phase48_multiexpiry/summary.json             results/phase48_multiexpiry/PHASE48_MANUSCRIPT.md; do test -s "$f"; done
      - name: Self-audit
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          t=pd.read_csv("results/phase48_multiexpiry/trade_matrix.csv")
          s=json.loads(Path("results/phase48_multiexpiry/summary.json").read_text())
          assert len(t)==s["trade_rows"]
          assert not t.duplicated(["strategy","expiry","entry"]).any()
          assert t["net50"].notna().all()
          assert t["split"].isin(["development","validation","holdout"]).all()
          assert t["states"].apply(lambda x:"ALL" in json.loads(x)).all()
          assert (t["entry"].str[:10] >= "2024-10-01").all()
          print("Phase 48 artifact audit PASS")
          print(s)
          PY
      - name: Publish
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date
          s=json.loads(Path("results/phase48_multiexpiry/summary.json").read_text())
          Path("PHASE48_STATUS.md").write_text(
            "# Phase 48 Status - Independent Multi-Expiry Data Bridge\n\n"
            "**NUMERICAL COMPLETE - SELF-AUDIT PASSED**\n\n"
            + json.dumps(s,indent=2) +
            "\n\nThe phase is supplementary and does not overwrite canonical evidence.\n"
          )
          with open("RESEARCH_LOG.md","a",encoding="utf-8") as f:
            f.write(
              f"\n\n## {date.today().isoformat()} - Phase 48 numerical bridge\n"
              f"- Trade rows={s['trade_rows']}; validation working states={s['validation_working_states']}; "
              f"frozen={s['frozen_rows']}; holdout confirmations={s['holdout_confirmation_rows']}; "
              f"Holm survivors={s['holm_survivors']}.\n"
              "- Independent multi-expiry source used only as supplementary evidence.\n"
            )
          PY
          git add results/phase48_multiexpiry PHASE48_STATUS.md RESEARCH_LOG.md
          git diff --cached --quiet && exit 0
          git commit -m "phase48: publish independent multi-expiry results"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Log failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat >> ERROR_LOG.md <<'EOF'

          ## F48-AUTO - Phase 48 workflow or audit failure
          - The affected run is non-evidence until diagnosed and corrected.
          EOF
          git add ERROR_LOG.md
          git commit -m "phase48: log workflow failure"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
