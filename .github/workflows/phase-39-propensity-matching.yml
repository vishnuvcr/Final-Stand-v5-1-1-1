name: Phase 39 - Propensity Matched Scoring

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_propensity_matching.py'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_counterfactual/fixed_opportunity_ledger.csv'
      - 'results/phase39_sequential_policy/sequential_trades.csv'
      - '.github/workflows/phase-39-propensity-matching.yml'
  workflow_dispatch:

concurrency:
  group: phase39-propensity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  psm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pandas numpy scikit-learn
      - run: python research/phase39_propensity_matching.py
      - name: Verify propensity analysis
        run: |
          test -f results/phase39_propensity/summary.json
          test -f results/phase39_propensity/propensity_results.csv
          python - <<'PY'
          import json,pandas as pd
          s=json.load(open('results/phase39_propensity/summary.json'))
          r=pd.read_csv('results/phase39_propensity/propensity_results.csv')
          assert s['status']=='COMPLETE'
          assert len(r)==12
          assert s['total_rows']==477
          assert s['development_treated']+s['validation_treated']+s['holdout_treated']==7
          print(json.dumps(s,indent=2))
          print(r.to_string(index=False))
          PY
      - name: Persist propensity evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_propensity
          git commit -m 'Phase 39: persist propensity matched scoring' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
