name: Phase 64 — Paper-Derived CCI Strategy Tests

on:
  push:
    branches:
      - phase-64-paper-derived-strategy-tests
    paths:
      - ".github/workflows/phase64-paper-derived-strategy-tests.yml"
      - "research/phase64_paper_strategy_tests.py"
      - "research/phase64_report.py"
      - "tests/test_phase64_strategy.py"
      - "requirements-phase64.txt"
      - "PHASE64_RESEARCH_PLAN.md"
  workflow_dispatch:
    inputs:
      force_rerun:
        description: "Run again even if Phase 64 already has a completion marker"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: phase64-paper-derived-tests
  cancel-in-progress: true

jobs:
  cci-paper-strategy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check finite-run completion marker
        id: gate
        shell: bash
        run: |
          if [ -f results/phase64_paper_strategy_tests/phase64_completion_marker.json ] && [ "${{ inputs.force_rerun }}" != "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Phase 64 already completed; finite stopping rule prevents repeat execution."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-phase64.txt

      - name: Restore pinned Hugging Face cache\n        if: steps.gate.outputs.should_run == 'true'\n        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-phase64-${{ runner.os }}-3eacf762d401efd9a08e804592fa7882b354c4a2
          restore-keys: |
            hf-phase64-${{ runner.os }}-

      - name: Install bounded dependencies\n        if: steps.gate.outputs.should_run == 'true'\n        run: python -m pip install --disable-pip-version-check -r requirements-phase64.txt

      - name: Syntax gate\n        if: steps.gate.outputs.should_run == 'true'\n        run: |
          python -m py_compile research/phase64_paper_strategy_tests.py research/phase64_report.py
          python -m pytest -q tests/test_phase64_strategy.py

      - name: Run frozen development and validation test\n        if: steps.gate.outputs.should_run == 'true'\n        run: python research/phase64_paper_strategy_tests.py

      - name: Generate report and figures
        if: steps.gate.outputs.should_run == 'true' && success()
        run: python research/phase64_report.py

      - name: Validate outputs and write completion marker
        if: steps.gate.outputs.should_run == 'true' && success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path("results/phase64_paper_strategy_tests")
          required = ["summary.csv", "opportunity_audit.csv", "trade_ledger.csv",
                      "source_manifest.json", "decision.json", "PHASE64_REPORT.md",
                      "validation_net_pnl.png", "validation_equity.png"]
          missing = [name for name in required if not (out / name).is_file() or (out / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Missing/empty required aggregate outputs: " + ", ".join(missing))
          manifest = json.loads((out / "source_manifest.json").read_text())
          if manifest.get("explicit_2026_option_files_downloaded") != 0:
              raise SystemExit("Holdout safeguard failed: 2026 option files were downloaded")
          marker = {
              "phase": 64, "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "commit": os.environ.get("GITHUB_SHA"),
              "dataset_revision": manifest.get("revision"),
              "holdout_option_files_downloaded": 0,
              "aggregate_outputs_validated": True
          }
          (out / "phase64_completion_marker.json").write_text(json.dumps(marker, indent=2) + "\\n")
          print(json.dumps(marker))
          PY

      - name: Publish aggregate research outputs
        if: steps.gate.outputs.should_run == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase64_paper_strategy_tests
          if git diff --cached --quiet; then
            echo "No aggregate result changes to publish."
          else
            git commit -m "phase 64: publish aggregate CCI strategy test outputs"
            git push
          fi

      - name: Record workflow failure in repository error log
        if: failure() && steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          printf '\n\n## Automated run failure — %s\n- Workflow run: %s\n- Commit: %s\n- Job conclusion: failure; inspect the linked Actions logs for the failed step. No numerical output from this run is accepted unless the report and audit gates completed.\n- Next action: repair the concrete failing gate and rerun under a new attempt; preserve this entry.\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> PHASE64_ERROR_LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE64_ERROR_LOG.md
          git commit -m "phase 64: log failed automated research run" || true
          git push || true

      - name: Upload aggregate-only results
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase64-paper-strategy-results-${{ github.run_id }}
          path: results/phase64_paper_strategy_tests/
          if-no-files-found: warn
          retention-days: 30
