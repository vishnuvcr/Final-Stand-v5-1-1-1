name: Phase 73 — DhanHQ expiry-code and strike mapping audit

on:
  workflow_dispatch:
  push:
    branches:
      - phase-73-dhan-expiry-strike-mapping
    paths:
      - "scripts/phase73_dhan_expiry_strike_mapping.py"
      - ".github/workflows/phase73-dhan-expiry-strike-mapping.yml"

permissions:
  contents: write

jobs:
  bounded-mapping-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run bounded expiry-code comparison
        run: python3 scripts/phase73_dhan_expiry_strike_mapping.py
      - name: Publish aggregate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase73_expiry_strike_mapping/summary.json results/phase73_expiry_strike_mapping/report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Record Phase 73 expiry-code mapping audit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
