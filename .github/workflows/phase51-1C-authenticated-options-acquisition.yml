name: Phase 51-1C - Authenticated Upstox Options Acquisition
on:
  workflow_dispatch:
  push:
    branches: [phase-51-1C-authenticated-options-acquisition]
    paths:
      - research/phase51_1C_upstox_contract_acquisition.py
      - trigger/phase51_1C_upstox.start
      - .github/workflows/phase51-1C-authenticated-options-acquisition.yml
concurrency:
  group: phase51-1C-upstox
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  upstox_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check --no-input requests
      - name: Verify Upstox credential and fetch expired contracts
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python research/phase51_1C_upstox_contract_acquisition.py
      - name: Upload source-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-1C-upstox-contract-gate
          path: |
            results/phase51/upstox_access_gate.json
            results/phase51/upstox_contract_manifest.json
            data/phase51/upstox/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish gate result
        if: always()
        run: |
          set -euo pipefail
          if [ -f results/phase51/upstox_access_gate.json ]; then
            cat results/phase51/upstox_access_gate.json
            exit 2
          fi
          test -f results/phase51/upstox_contract_manifest.json
          cat results/phase51/upstox_contract_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase51/upstox_contract_manifest.json data/phase51/upstox/
          git commit -m "Phase 51-1C: publish Upstox expired contract manifest"
          git fetch origin phase-51-1C-authenticated-options-acquisition
          git rebase origin phase-51-1C-authenticated-options-acquisition
          git push origin HEAD:phase-51-1C-authenticated-options-acquisition
