name: Phase 39 - Step 2b Feature Schema Audit

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_feature_audit.py'
      - 'results/phase39_features/point_in_time_features.csv'
      - '.github/workflows/phase-39-step2-feature-audit.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step2b-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pandas
      - run: python research/phase39_feature_audit.py
      - name: Verify
        run: |
          test -f results/phase39_features/model_feature_manifest.csv
          test -f results/phase39_features/leakage_audit_v2.json
          python - <<'PY'
          import json,pandas as pd
          a=json.load(open('results/phase39_features/leakage_audit_v2.json'))
          m=pd.read_csv('results/phase39_features/model_feature_manifest.csv')
          assert a['status']=='PASS'
          assert a['model_candidate_columns']==len(m)
          assert len(m)>=100
          assert m.feature.is_unique
          print(a)
          PY
      - name: Persist Step 2b evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_features/model_feature_manifest.csv results/phase39_features/leakage_audit_v2.json
          git commit -m 'Phase 39: persist feature schema and leakage audit' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
