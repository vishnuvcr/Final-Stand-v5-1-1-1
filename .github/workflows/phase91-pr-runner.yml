name: Phase 91 — PR-triggered temporal replication runner

on:
  pull_request:
    branches:
      - phase-90-iv-incremental-prediction
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "PHASE91_RESEARCH_PLAN.md"
      - "PHASE91_STATUS.md"
      - "PHASE91_ERROR_LOG.md"
      - "PHASE91_CHAT_LOG.md"
      - "research/phase91/**"
      - ".github/workflows/phase91-iv-temporal-replication-2023.yml"

permissions:
  contents: write

concurrency:
  group: phase91-pr-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  temporal-replication:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase-91-iv-temporal-replication-2023'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the Phase 91 pull-request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "pandas==2.2.3"

      - name: Restore or initialize isolated Phase 91 private data cache
        uses: actions/cache@v4
        with:
          path: .cache/phase91/raw
          key: phase91-dhan-rolling-2023-v1

      - name: Acquire and analyze frozen 2023 replication
        id: study
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.pull_request.head.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python research/phase91/iv_incremental_study.py

      - name: Publish aggregate outputs, README checkpoint, and logs to Phase 91 branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE91_STATUS.md PHASE91_ERROR_LOG.md PHASE91_CHAT_LOG.md README.md
          git add -f results/phase91/coverage.csv results/phase91/model_metrics.csv results/phase91/vix_regime_metrics.csv results/phase91/summary.json results/phase91/PHASE91_RESULTS.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Phase 91: publish temporal IV replication results"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No aggregate result or log changes to commit."
          fi

      - name: Mark engine/operational failure after publication
        if: steps.study.outcome == 'failure'
        run: |
          echo "Phase 91 analysis engine failed; inspect committed status and sanitized error log."
          exit 1
