name: Phase 50B - TT05 Short Straddle Replay

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - trigger/phase50b_tt05.start

concurrency:
  group: phase50b-tt05-replay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preflight dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Verify TT04 dependency evidence
        run: |
          set -euo pipefail
          test -s results/phase50b/tt04_premium_match_replay/summary.json
          test -s results/phase50b/tt04_premium_match_replay/tt04_trades.csv
          test -f results/phase50b/tt04_premium_match_replay/data_errors.csv
          test -f results/phase50b/tt04_premium_match_replay/coverage_gaps.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt04_premium_match_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt04_premium_match_replay/tt04_trades.csv")
          er=pd.read_csv("results/phase50b/tt04_premium_match_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt04_premium_match_replay/coverage_gaps.csv")
          assert d.get("engine_revision")=="50B-TT04-COVERAGE-V3", d
          assert d.get("trades",0)==len(tr) and d.get("trades",0)>0, d
          assert d.get("candidate_trades",0)==len(tr)+len(cg), d
          assert d.get("coverage_rate",0)>=0.95, d
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          assert len(er)==0, er.head()
          print("TT04 dependency gate PASS", d)
          PY
  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Compile TT05 replay
        run: python -m py_compile research/phase50b_tt05_short_straddle_replay.py
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt05-hf-${{ runner.os }}-${{ hashFiles('research/phase50b_tt05_short_straddle_replay.py') }}
          restore-keys: |
            phase50b-tt05-hf-${{ runner.os }}-
      - name: Run TT05 replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase50b_tt05_short_straddle_replay.py
      - name: Audit TT05 artifacts
        run: |
          set -euo pipefail
          test -s results/phase50b/tt05_short_straddle_replay/summary.json
          test -s results/phase50b/tt05_short_straddle_replay/tt05_trades.csv
          test -f results/phase50b/tt05_short_straddle_replay/data_errors.csv
          test -f results/phase50b/tt05_short_straddle_replay/coverage_gaps.csv
          test -f results/phase50b/tt05_short_straddle_replay/session_exclusions.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt05_short_straddle_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt05_short_straddle_replay/tt05_trades.csv")
          er=pd.read_csv("results/phase50b/tt05_short_straddle_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt05_short_straddle_replay/coverage_gaps.csv")
          sx=pd.read_csv("results/phase50b/tt05_short_straddle_replay/session_exclusions.csv")
          assert d["engine_revision"]=="50B-TT05-COVERAGE-V2", d
          assert d["trades"]==len(tr)
          assert d["candidate_trades"]==len(tr)+len(cg)
          assert d["coverage_rate"]>=0.95, d
          assert d.get("session_exclusions",0)==len(sx), d
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          assert len(er)==0, er.head()
          print("TT05 replay audit PASS", d)
          PY
      - name: Upload TT05 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-tt05-${{ github.run_id }}
          path: results/phase50b/tt05_short_straddle_replay
      - name: Publish TT05 results safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R results/phase50b/tt05_short_straddle_replay "$tmp/"
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          rm -rf results/phase50b/tt05_short_straddle_replay
          mkdir -p results/phase50b
          cp -R "$tmp/tt05_short_straddle_replay" results/phase50b/
          git add results/phase50b/tt05_short_straddle_replay
          if git diff --cached --quiet; then
            echo "No TT05 result changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: publish TT05 common-cost replay"
            git push origin HEAD:phase-50b-expanded-strategy-universe
          fi

      - name: Trigger TT06 only after TT05 evidence passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          date -u +"%Y-%m-%dT%H:%M:%SZ" > trigger/phase50b_tt06.start
          git add trigger/phase50b_tt06.start
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: trigger TT06 after TT05 audit"
          git push origin HEAD:phase-50b-expanded-strategy-universe
