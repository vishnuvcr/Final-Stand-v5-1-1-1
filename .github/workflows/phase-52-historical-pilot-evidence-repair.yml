name: Phase 52 — Historical Pilot Leg Evidence Repair
# Bounded remediation run; frozen universe and 2% gate remain unchanged.

on:
  workflow_dispatch:
  push:
    branches:
      - phase-52-factor-conditioned-strategy-discovery
    paths:
      - "research/phase52/historical_pilot_runner.py"
      - ".github/workflows/phase-52-historical-pilot-evidence-repair.yml"

permissions:
  contents: write

concurrency:
  group: phase52-historical-pilot-evidence-repair
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PHASE_BRANCH: phase-52-factor-conditioned-strategy-discovery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-52-factor-conditioned-strategy-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded pilot dependencies
        run: python -m pip install --disable-pip-version-check --no-input pandas numpy pyarrow huggingface_hub scipy matplotlib
      - name: Runner self-test
        run: python research/phase52/historical_pilot_runner.py --self-test-only
      - name: Refresh preregistration manifest for the reviewed code revision
        run: |
          python research/phase52/historical_pilot_runner.py --plan-only
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("results/phase52/historical_pilot/pilot_manifest.json").read_text())
          assert m["configuration_count"]==40 and m["planned_config_event_rows"]==480
          assert len(m["event_ids"])==24
          print("Frozen universe identities checked; only code/file fingerprints refreshed.")
          PY
      - name: Recompute frozen 40 x 24 historical pilot with complete range-failure leg evidence
        run: python research/phase52/historical_pilot_runner.py --run
      - name: Validate output row counts and leg evidence
        run: |
          python - <<'PY'
          import csv, json, math
          from collections import Counter
          from pathlib import Path
          p=Path("results/phase52/historical_pilot")
          rows=list(csv.DictReader((p/"event_replay.csv").open(newline="",encoding="utf-8")))
          assert len(rows)==480, f"expected 480 rows, got {len(rows)}"
          expected_status={"EXCLUDED_OHLC_RANGE_PROXY":379,"BLOCKED_LEG_ELIGIBILITY":100,"REPLAY_PASS":1}
          status_counts=dict(Counter(r["status"] for r in rows))
          assert status_counts==expected_status, f"unexpected parent statuses: {status_counts}"
          family_legs={"BUY_CALL":1,"BUY_PUT":1,"BULL_CALL_SPREAD":2,"BEAR_CALL_SPREAD":2,
                       "SHORT_IRON_CONDOR":4,"LONG_STRADDLE":2,"LONG_STRANGLE":2}
          range_rows=pass_rows=hard_oi_rows=0
          for row in rows:
              try:
                  legs=json.loads(row.get("resolved_legs_json") or "[]")
              except Exception as exc:
                  raise AssertionError(f"malformed leg JSON for {row.get('event_id')}: {exc}")
              if row["status"] in {"EXCLUDED_OHLC_RANGE_PROXY","REPLAY_PASS"}:
                  expected=family_legs[row["family_id"]]
                  assert len(legs)==expected, (
                      f"{row['status']} {row['family_id']} {row['event_id']}: expected {expected} legs, got {len(legs)}")
                  for leg in legs:
                      assert leg.get("leg_id") and leg.get("option_type") and leg.get("strike") is not None
                      oi=leg.get("prior_oi")
                      assert isinstance(oi,(int,float)) and math.isfinite(oi) and oi>=100, (
                          f"non-passing OI evidence in {row['event_id']} leg {leg.get('leg_id')}")
                      assert leg.get("prior_oi_status")=="PASS", f"OI status not PASS: {row['event_id']} {leg.get('leg_id')}"
                      assert leg.get("entry_status")=="PASS", f"entry status not PASS: {row['event_id']} {leg.get('leg_id')}"
                      rg=leg.get("entry_range_proxy_pct")
                      assert isinstance(rg,(int,float)) and math.isfinite(rg) and rg>=0, (
                          f"invalid range proxy: {row['event_id']} {leg.get('leg_id')}")
                  if row["status"]=="EXCLUDED_OHLC_RANGE_PROXY": range_rows+=1
                  else: pass_rows+=1
              elif row["status"]=="BLOCKED_LEG_ELIGIBILITY":
                  assert "prior-bar OI" in (row.get("exclusion_reason") or ""), (
                      f"eligibility block lacks an explicit prior-OI hard blocker: {row.get('event_id')}")
                  assert any(isinstance(l,dict) and l.get("status")=="PRIOR_OI_MISSING_OR_BELOW_GATE"
                             and isinstance(l.get("prior_oi"),(int,float)) and l["prior_oi"]<100 for l in legs), (
                      f"no observed hard OI failure in {row.get('event_id')}")
                  hard_oi_rows+=1
              else:
                  raise AssertionError(f"unexpected status {row['status']}")
          assert (range_rows,pass_rows,hard_oi_rows)==(379,1,100)
          report=json.loads((p/"report.json").read_text())
          assert report.get("planned_config_event_rows")==480
          assert report.get("source_file_errors")==0
          print(json.dumps({"rows":len(rows),"status_counts":status_counts,
              "complete_range_exclusion_rows":range_rows,"complete_replay_pass_rows":pass_rows,
              "conclusive_hard_oi_block_rows":hard_oi_rows,"source_file_errors":report.get("source_file_errors"),
              "version":report.get("pilot_version")},indent=2))
          PY
      - name: Upload audited pilot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase52-leg-evidence-repair-${{ github.run_id }}
          path: results/phase52/historical_pilot/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist audited output and checkpoint logs
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          run_id=os.environ["RUN_ID"]
          status=os.environ["JOB_STATUS"]
          url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          text=f"\n\n## Leg-evidence repair run {run_id}\n\n- Run: [{run_id}]({url})\n- Job status: {status}\n- Intended change: preserve all resolved-leg range diagnostics without changing the frozen 2% eligibility rule, costs, or event universe.\n- Status counts and per-row leg completeness must be reviewed from the uploaded artifact before using it in Phase 54.\n"
          for name in ["PHASE52_STATUS.md","PHASE52_RESEARCH_LOG.md","PHASE52_CHAT_LOG.md"]:
            p=Path(name)
            if p.exists(): p.write_text(p.read_text(encoding="utf-8").rstrip()+text,encoding="utf-8")
          if status!="success":
            p=Path("PHASE52_ERROR_LOG.md")
            p.write_text(p.read_text(encoding="utf-8").rstrip()+f"\n\n## F52-LEG-EVIDENCE-{run_id} — replay/persistence failure\n\n- Run: {url}\n- Job status: {status}\n- No revised sensitivity accepted.\n- Status: OPEN.\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase52/historical_pilot PHASE52_STATUS.md PHASE52_RESEARCH_LOG.md PHASE52_CHAT_LOG.md PHASE52_ERROR_LOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase52 preserve full leg evidence run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git fetch origin "$PHASE_BRANCH"
            git rebase origin/"$PHASE_BRANCH" || { git rebase --abort || true; }
            git push origin "$PHASE_BRANCH" && exit 0
          done
          exit 1
