name: Phase 43 - Corrected VIX Inference

on:
  push:
    branches:
      - phase-43-vix-all-options-strategies
    paths:
      - "research/phase43_vix_correct_inference.py"
      - "results/phase43_vix/strategy_trade_matrix_all_splits.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase43-corrected-inference
  cancel-in-progress: true

jobs:
  corrected-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas numpy tabulate
      - name: Syntax
        run: python -m py_compile research/phase43_vix_correct_inference.py
      - name: Corrected inference
        run: python research/phase43_vix_correct_inference.py
      - name: Audit
        run: |
          test -s results/phase43_vix/strategy_vix_corrected_inference.csv
          test -s results/phase43_vix/vix_regime_development_selected_strategies.csv
          test -s results/phase43_vix/PHASE43_CORRECTED_INFERENCE.md
      - name: Update status and research log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("results/phase43_vix/summary.json").read_text())
          status=Path("PHASE43_STATUS.md")
          t=status.read_text()
          t=t.replace("**COMPLETE_NO_ROUTER_PROMOTED**","**COMPLETE_NO_ROUTER_PROMOTED — CORRECTED INFERENCE ACCEPTED**")
          t += "\n\nCorrected inference artifact: results/phase43_vix/strategy_vix_corrected_inference.csv\n"
          t += "Corrected interpretation: regime-versus-complement, not regime-versus-identical ALL rows.\n"
          status.write_text(t)
          with Path("RESEARCH_LOG.md").open("a") as f:
              f.write("\n\n## 2026-10-06 — Phase 43 corrected VIX inference accepted\n")
              f.write("- Corrected inference compares each VIX regime with complementary non-regime expiry observations for the same strategy.\n")
              f.write("- The original zero-difference inference table is retained as invalid audit output.\n")
              f.write("- No router passed the preregistered validation/cost-stress gate, so no holdout promotion is made.\n")
          PY
      - name: Persist corrected evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase43_vix/strategy_vix_corrected_inference.csv results/phase43_vix/vix_regime_development_selected_strategies.csv results/phase43_vix/PHASE43_CORRECTED_INFERENCE.md PHASE43_STATUS.md RESEARCH_LOG.md
          git commit -m "phase43: persist corrected VIX inference" || true
          git push origin HEAD:phase-43-vix-all-options-strategies
