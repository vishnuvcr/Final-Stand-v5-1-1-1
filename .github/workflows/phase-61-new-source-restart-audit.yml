name: Phase 61 — New Source Restart Audit

on:
  workflow_dispatch:
  push:
    branches:
      - phase-61-new-source-restart-audit
    paths:
      - ".github/workflows/phase-61-new-source-restart-audit.yml"
      - "research/phase61/**"

permissions:
  contents: write

concurrency:
  group: phase61-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-61-new-source-restart-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests
        run: python -m unittest research.phase61.test_source_delta_audit -v
      - name: Generate deterministic source audit
        run: python research/phase61/source_delta_audit.py
      - name: Validate report and source-count reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/phase61/source_restart_audit/report.json").read_text())
          assert r["candidate_count"] == 5
          assert r["accepted_source_ids"] == []
          assert r["status"] == "NO_GO_NO_NEW_SOURCE_MEETS_RESTART_GATE"
          assert r["frozen_rules"]["holdout_used"] is False
          assert r["frozen_rules"]["strategy_promoted"] is False
          print("Phase61 source gate PASS: NO-GO correctly asserted.")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase61-source-audit-${{ github.run_id }}
          path: results/phase61/source_restart_audit/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist checkpoint
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ["GITHUB_RUN_ID"]
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://github.com/{repo}/actions/runs/{run_id}"
          status=os.environ.get("JOB_STATUS","unknown")
          p=Path("results/phase61/source_restart_audit/report.json")
          report=json.loads(p.read_text()) if p.exists() else None
          if report and status=="success":
              summary=(f"- Run: [{run_id}]({url}); workflow status=success.\n"
                       f"- Decision: {report['status']}; candidates={report['candidate_count']}; accepted={len(report['accepted_source_ids'])}.\n"
                       "- No data downloaded, no credentials or purchases, no holdout use, no P&L or strategy promotion.\n")
          else:
              summary=f"- Run: [{run_id}]({url}); workflow status={status}; report missing/unaccepted. No conclusion accepted.\n"
          for name,heading in [
              ("PHASE61_STATUS.md",f"## Automated checkpoint {run_id}"),
              ("PHASE61_RESEARCH_LOG.md",f"## Automated checkpoint {run_id}"),
              ("PHASE61_CHAT_LOG.md",f"## Automated checkpoint {run_id}")
          ]:
              f=Path(name); f.write_text(f.read_text(encoding="utf-8").rstrip()+"\n\n"+heading+"\n\n"+summary,encoding="utf-8")
          if status!="success" or report is None:
              f=Path("PHASE61_ERROR_LOG.md")
              f.write_text(f.read_text(encoding="utf-8").rstrip()+f"\n\n## F61-RUN-{run_id} — audit failure\n\n- Run: {url}\n- Status: {status}\n- Report present: {report is not None}\n- No conclusion accepted.\n- Status: OPEN.\n",encoding="utf-8")
          readme=Path("README.md")
          readme.write_text(readme.read_text(encoding="utf-8").rstrip()+f"\n\n## Phase 61 — new-source restart audit\n\n"+summary+
              "- [Plan](PHASE61_RESEARCH_PLAN.md) · [Status](PHASE61_STATUS.md) · [Source registry](research/phase61/source_registry.json) · [Decision report](results/phase61/source_restart_audit/report.md) · [Error log](PHASE61_ERROR_LOG.md)\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE61_STATUS.md PHASE61_RESEARCH_LOG.md PHASE61_CHAT_LOG.md PHASE61_ERROR_LOG.md README.md research/phase61 results/phase61/source_restart_audit
          git diff --cached --quiet && exit 0
          git commit -m "Phase61 source restart audit checkpoint $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git fetch origin phase-61-new-source-restart-audit
            if git rebase origin/phase-61-new-source-restart-audit; then
              if git push origin phase-61-new-source-restart-audit; then exit 0; fi
            else
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
