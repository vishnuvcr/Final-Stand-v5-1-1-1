name: Phase 103 — Dhan Stock-Options Data API Audit

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date inclusive (YYYY-MM-DD; maximum 30-day window)"
        required: true
        default: "2026-08-03"
        type: string
      to_date:
        description: "End date exclusive (YYYY-MM-DD); script compensates for Dhan inclusive end behavior"
        required: true
        default: "2026-08-04"
        type: string
      max_probes:
        description: "Maximum symbol/side/relative-strike API probes (1–70)"
        required: true
        default: 7
        type: number
      strikes:
        description: "Dhan relative strikes for fixed-contract continuity audit"
        required: true
        default: "ATM,ATM+1,ATM+2,ATM+3,ATM-1,ATM-2,ATM-3"
        type: string
  push:
    branches:
      - phase-103-nifty50-stock-options
    paths:
      - "research/phase103_stock_options/dhan_data_audit.py"
      - "research/phase103_stock_options/record_dhan_audit_status.py"
      - "tests/phase103/**"
      - ".github/workflows/phase103-dhan-data-api-audit.yml"

concurrency:
  group: phase103-dhan-data-api-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  api-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN || secrets.DHAN_API_ACCESS_TOKEN || secrets.DHAN_TOKEN || secrets.DHAN_DATA_API_TOKEN }}
      PHASE103_FROM_DATE: ${{ inputs.from_date || '2026-08-03' }}
      PHASE103_TO_DATE: ${{ inputs.to_date || '2026-08-04' }}
      PHASE103_MAX_PROBES: ${{ inputs.max_probes || 7 }}
      PHASE103_STRIKES: ${{ inputs.strikes || 'ATM,ATM+1,ATM+2,ATM+3,ATM-1,ATM-2,ATM-3' }}
    steps:
      - name: Checkout isolated Phase 103 branch
        uses: actions/checkout@v4
        with:
          ref: phase-103-nifty50-stock-options
      - name: Remove stale prior-run audit outputs from the workspace
        run: rm -f results/phase103/dhan_data_api_audit.json results/phase103/DHAN_DATA_API_AUDIT.md
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit-test audit code
        run: python -m unittest discover -s tests/phase103 -p "test_*.py" -v
      - name: Query Dhan instrument master and bounded expired-options data
        run: python research/phase103_stock_options/dhan_data_audit.py --from-date "$PHASE103_FROM_DATE" --to-date "$PHASE103_TO_DATE" --max-probes "$PHASE103_MAX_PROBES" --strikes "$PHASE103_STRIKES" --strikes "$PHASE103_STRIKES"
      - name: Publish status and error/limitation log
        if: always()
        run: |
          if [ -f results/phase103/dhan_data_api_audit.json ] && python -c 'import json,os,sys; d=json.load(open("results/phase103/dhan_data_api_audit.json")); sys.exit(0 if str(d.get("run_id"))==os.environ.get("GITHUB_RUN_ID") else 1)'; then
            python research/phase103_stock_options/record_dhan_audit_status.py
          else
            marker="DHAN_NO_RESULT_RUN_${GITHUB_RUN_ID}"
            if ! grep -q "$marker" PHASE103_ERROR_LOG.md; then
              printf "\\n\\n<!-- %s -->\\n### E103-RUN-%s — No fresh audit JSON for this run\\nTests, network requests or audit generation did not produce a machine result whose run_id matches the current Actions run. Any prior JSON is not valid evidence for this run.\\nRun: https://github.com/%s/actions/runs/%s\\n" "$marker" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> PHASE103_ERROR_LOG.md
              printf "\\n\\n<!-- %s -->\\n### No fresh Dhan audit result\\nRun %s produced no current-run JSON; prior run output was not accepted.\\n" "$marker" "$GITHUB_RUN_ID" >> PHASE103_STATUS.md
              printf "\\n\\n<!-- %s -->\\n## Dhan audit no result — run %s\\nNo current-run JSON was produced; previous audit data were not accepted as this run's output.\\n" "$marker" "$GITHUB_RUN_ID" >> PHASE103_RESEARCH_LOG.md
            fi
          fi
      - name: Upload aggregate audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase103-dhan-data-api-audit
          path: |
            results/phase103/dhan_data_api_audit.json
            results/phase103/DHAN_DATA_API_AUDIT.md
          if-no-files-found: warn
      - name: Commit derived audit, status and logs
        if: always() && github.ref == 'refs/heads/phase-103-nifty50-stock-options'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase103/dhan_data_api_audit.json results/phase103/DHAN_DATA_API_AUDIT.md PHASE103_STATUS.md PHASE103_RESEARCH_LOG.md PHASE103_ERROR_LOG.md
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Phase 103: record Dhan stock-options data audit"
            git push origin HEAD:phase-103-nifty50-stock-options
          fi
