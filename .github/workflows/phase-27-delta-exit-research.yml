name: Phase 27 delta-based exit research

on:
  push:
    branches:
      - phase-27-delta-exit-research
    paths:
      - "research/phase27_delta_exit_research.py"
      - "PHASE27_PRE_REGISTRATION.md"
      - ".github/workflows/phase-27-delta-exit-research.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  phase27:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-27-delta-exit-research
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-${{ runner.os }}-v1
          restore-keys: |
            hf-nifty-options-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub
      - name: Compile
        run: python -m py_compile research/phase27_delta_exit_research.py
      - name: Run Phase 27
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OUT_DIR: results/dynamic_n_corrected/phase27_delta_exit
        run: python research/phase27_delta_exit_research.py
      - name: Persist Phase 27 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dynamic_n_corrected/phase27_delta_exit
          git commit -m "Phase 27: persist delta exit research results" || true
          git fetch origin phase-27-delta-exit-research
          git rebase origin/phase-27-delta-exit-research
          git push origin HEAD:phase-27-delta-exit-research
