name: Phase 43 - Corrected Statistical Postprocess

on:
  push:
    branches:
      - phase-43-vix-all-options-strategies
    paths:
      - "results/phase43_vix/strategy_trade_matrix_all_splits.csv"
      - "research/phase43_postprocess.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase43-postprocess
  cancel-in-progress: true

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas tabulate

      - name: Syntax audit
        run: python -m py_compile research/phase43_postprocess.py

      - name: Corrected statistical postprocess
        run: python research/phase43_postprocess.py

      - name: Persist corrected evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase43_vix PHASE43_STATUS.md RESEARCH_LOG.md ERROR_LOG.md
          git commit -m "phase43: persist corrected statistical postprocess" || true
          git push origin HEAD:phase-43-vix-all-options-strategies

# corrected statistical postprocess workflow v2
