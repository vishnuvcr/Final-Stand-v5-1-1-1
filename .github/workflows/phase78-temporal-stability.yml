name: Phase 78 — Temporal stability reconciliation
on:
  workflow_dispatch:
  push:
    branches: [phase-78-temporal-stability-reconciliation]
    paths:
      - 'scripts/phase78_temporal_stability.py'
      - 'results/phase50b/**/summary.json'
      - 'results/phase51/available_oos/**/summary.json'
      - '.github/workflows/phase78-temporal-stability.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-78-temporal-stability-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile frozen summaries
        run: python scripts/phase78_temporal_stability.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase78-temporal-stability
          path: results/phase78_temporal_stability/
          if-no-files-found: error
      - name: Persist report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase78_temporal_stability/
          if ! git diff --cached --quiet; then
            git commit -m 'Record Phase 78 temporal stability reconciliation'
            git pull --rebase origin phase-78-temporal-stability-reconciliation
            git push origin HEAD:phase-78-temporal-stability-reconciliation
          fi
