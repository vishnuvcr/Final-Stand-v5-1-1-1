name: Phase 76 — HF fixed-contract source audit
on:
  workflow_dispatch:
  push:
    branches: [phase-76-hf-fixed-contract-source-audit]
    paths:
      - 'scripts/phase76_hf_fixed_contract_audit.py'
      - '.github/workflows/phase76-hf-fixed-contract-source-audit.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded audit dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub
      - name: Audit only the two target expiry files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/phase76_hf_fixed_contract_audit.py
      - name: Publish aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: phase76-hf-fixed-contract-audit
          path: results/phase76_hf_fixed_contracts/
          if-no-files-found: error
