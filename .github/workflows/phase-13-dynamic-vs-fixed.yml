name: Phase 13 Dynamic N vs Fixed OTM15

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_DYNAMIC_COMPARE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run comparison
        run: python research/compare_dynamic_fixed.py
      - name: Persist comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/dynamic_n_corrected/phase13_comparison
          git commit -m 'Phase 13: persist dynamic-n fixed comparison' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
