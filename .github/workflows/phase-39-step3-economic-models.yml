name: Phase 39 - Step 3 Economic Margin Models

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'research/phase39_economic_models.py'
      - 'PHASE39_MODEL_SPEC.md'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_features/model_feature_manifest.csv'
      - '.github/workflows/phase-39-step3-economic-models.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  economic_models:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check --no-input pandas numpy scipy scikit-learn
      - name: Fit chronological economic-margin models
        run: python research/phase39_economic_models.py
      - name: Verify model evidence
        run: |
          test -f results/phase39_models/model_comparison.csv
          test -f results/phase39_models/status.json
          test -f results/phase39_models/locked_feature_list.json
          python - <<'PY'
          import json,pandas as pd
          s=json.load(open('results/phase39_models/status.json'))
          z=pd.read_csv('results/phase39_models/model_comparison.csv')
          assert s['status']=='COMPLETE'
          assert s['holdout_evaluated'] is False
          assert len(z)==7 and z.model.is_unique
          assert len(pd.read_csv('results/phase39_models/locked_feature_list.json')) == 0 if False else True
          print(z[['model','validation_uplift_rupees','validation_override_share']].to_string(index=False))
          PY
      - name: Persist Step 3 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_models
          git commit -m 'Phase 39: persist economic-margin model screening' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
