name: Phase 44 - VIX Candidate Tuning Bridge

on:
  pull_request:
    paths:
      - "trigger/phase44.start"
      - "research/phase44_vix_tuning.py"
      - "PHASE44_RESEARCH_PLAN.md"
      - "PHASE44_PRE_REGISTRATION.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase44-bridge-v2
  cancel-in-progress: true

jobs:
  run-phase44:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Phase 44 branch
        uses: actions/checkout@v4
        with:
          ref: phase-44-vix-candidate-tuning
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase44-hf-${{ runner.os }}-v1
          restore-keys: |
            phase43-hf-${{ runner.os }}-
            phase44-hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas pyarrow scipy huggingface_hub

      - name: Syntax audit
        run: |
          python -m py_compile research/phase44_vix_tuning.py

      - name: Execute Phase 44
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python research/phase44_vix_tuning.py
          code=$?
          if [ "$code" -ne 0 ]; then
            printf "\n## F44-BRIDGE-${GITHUB_RUN_ID} — numerical execution failure\n- Exit code: %s. Failed output is non-evidence.\n" "$code" >> ERROR_LOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ERROR_LOG.md
            git commit -m "phase44: log bridge failure ${GITHUB_RUN_ID}" || true
            git push origin HEAD:phase-44-vix-candidate-tuning || true
            exit "$code"
          fi

      - name: Audit artifacts
        run: |
          test -s results/phase44_vix_tuning/stage1_structure_time_matrix.csv
          test -s results/phase44_vix_tuning/stage1_candidates.csv
          test -s results/phase44_vix_tuning/frozen_stage1.csv
          test -s results/phase44_vix_tuning/frozen_stage1_holdout.csv
          test -s results/phase44_vix_tuning/summary.json

      - name: Update Phase 44 status and log
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path("results/phase44_vix_tuning/summary.json").read_text())
          Path("PHASE44_STATUS.md").write_text(
              "# Phase 44 Status — VIX Candidate Tuning\n\n"
              f"**{s['status']}**\n\n"
              f"Stage-1 strategy/geometry/time rows: {s['stage1_rows']}\n"
              f"Stage-1 VIX-conditioned candidate rows: {s['candidate_rows']}\n"
              f"Frozen validation-eligible candidates: {s['frozen_candidates']}\n"
              f"Holm survivors: {s['holm_survivors']}\n"
              f"Holdout opened after freeze: {s['holdout_opened_after_freeze']}\n"
              f"Decision: **{s['decision']}**\n\n"
              "The canonical Phase-20/42 strategy remains unchanged.\n"
          )
          with Path("RESEARCH_LOG.md").open("a") as f:
              f.write(
                  f"\n\n## 2026-10-06 — Phase 44 bridge execution {os.environ.get('GITHUB_RUN_ID','unknown')}\n"
                  f"- Stage-1 tuning completed: {s['stage1_rows']} structure/time rows and {s['candidate_rows']} VIX-conditioned candidate rows.\n"
                  f"- Frozen candidates: {s['frozen_candidates']}; Holm survivors: {s['holm_survivors']}.\n"
                  f"- Holdout opened only after freeze: {s['holdout_opened_after_freeze']}.\n"
                  f"- Decision: {s['decision']}.\n"
              )
          PY

      - name: Persist Phase 44 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase44_vix_tuning PHASE44_STATUS.md RESEARCH_LOG.md
          git commit -m "phase44: persist bridge tuning results" || true
          git push origin HEAD:phase-44-vix-candidate-tuning
