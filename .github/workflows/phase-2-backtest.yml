name: Phase 2 Primary Backtest - OTMn Ratio

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD)
        required: false
        default: '2024-01-01'
      end_date:
        description: End date (YYYY-MM-DD)
        required: false
        default: '2025-12-31'
      slippage_ticks:
        description: Adverse slippage per leg in ticks
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-phase2-full-n-v2
          restore-keys: |
            hf-nifty-options-phase2-full-n-
      - name: Run full n=6..15 backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START_DATE: ${{ github.event.inputs.start_date || '2024-01-01' }}
          END_DATE: ${{ github.event.inputs.end_date || '2025-12-31' }}
          SLIPPAGE_TICKS: ${{ github.event.inputs.slippage_ticks || '1' }}
        run: python research/backtest_otm_ratio.py
      - name: Persist results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results || true
          git commit -m 'Phase 2: persist full n=6..15 backtest results' || echo 'No result changes'
          git push origin HEAD:${GITHUB_REF_NAME} || true