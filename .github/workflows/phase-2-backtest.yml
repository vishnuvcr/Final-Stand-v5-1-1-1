name: Phase 2 Backtest - OTM6/7/8
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD)
        required: false
        default: '2024-01-01'
      end_date:
        description: End date (YYYY-MM-DD)
        required: false
        default: '2025-12-31'
  push:
    branches: [phase-1-strategy-definition]
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-phase2-v1
      - name: Run backtest
        env:
          HF_TOKEN: ${{ github.event.inputs.HF_TOKEN }}
          START_DATE: ${{ github.event.inputs.start_date || '2024-01-01' }}
          END_DATE: ${{ github.event.inputs.end_date || '2026-09-30' }}
        run: python research/backtest_otm_ratio.py
      - name: Persist results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results || true
          git commit -m 'Phase 2: persist backtest results' || echo 'No result changes'
          git push origin HEAD:${GITHUB_REF_NAME} || true
