name: Phase 52 — Factor-Conditioned Strategy Discovery
# Phase52 replay/data gates: point-in-time selectors, pinned base replay, lagged NSE EOD factors, exact entry-time coverage, and UDiFF IDF futures validation (PA-004 to PA-006).
# PA-010: selected-strike audit uses only contracts listed at the exact entry timestamp; verify the patched research-branch commit before accepting outputs.

on:
  workflow_dispatch:
    inputs:
      shard_size:
        description: "Maximum configuration records to enumerate (enumeration is not a backtest)"
        required: false
        default: "25000"
        type: string
      force_base_replay:
        description: "Force recomputation of Phase 43/45 base-geometry replay against the latest HF revision"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: phase52-factor-conditioned-strategy-discovery
  cancel-in-progress: false

jobs:
  discover-and-queue:
    name: Discover sources and advance bounded configuration queue
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PHASE_BRANCH: phase-52-factor-conditioned-strategy-discovery
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_SHARD_SIZE: ${{ github.event.inputs.shard_size }}
      FORCE_BASE_REPLAY: ${{ github.event.inputs.force_base_replay }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: phase-52-factor-conditioned-strategy-discovery
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout frozen Phase45 trade outcomes and audited Phase39 feature panel
        uses: actions/checkout@v4
        with:
          repository: vishnuvcr/Final-Stand-v5-1-1-1
          ref: phase-45-exhaustive-ready-made-strategies
          path: phase45-source
          sparse-checkout: |
            results/phase45_ready_made/full_ready_made_trade_matrix.csv
            results/phase39_features/point_in_time_features.csv
            results/phase39_features/leakage_audit_v2.json
            results/phase39_features/model_feature_manifest.csv
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pinned market-data caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/phase52/nse_fno_bhavcopy
          key: phase52-market-data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            phase52-market-data-cache-${{ runner.os }}-
            phase52-hf-cache-${{ runner.os }}-

      - name: Validate registry, specs, grid and deterministic enumerator
        run: |
          mkdir -p research/phase52/results results/phase52/base_replay results/phase52/data_readiness results/phase52/daily_bhavcopy results/phase52/coverage_audit results/phase52/daily_eod_selector results/phase52/configuration_event_universe results/phase52/option_quote_coverage results/phase52/selected_strike_coverage
          python research/phase52/validate_registry.py --self-test --audit-out research/phase52/results/registry_audit.json

      - name: Install replay and audit dependencies
        run: python -m pip install --disable-pip-version-check --no-input pandas numpy pyarrow huggingface_hub scipy matplotlib requests

      - name: Run legacy + UDiFF bhavcopy parser regression after dependency installation
        run: python research/phase52/daily_bhavcopy_adapter.py --self-test --self-test-only

      - name: Reproduce frozen Phase 43/45 base geometry at a pinned HF revision
        env:
          FORCE_BASE_REPLAY: ${{ github.event.inputs.force_base_replay }}
        run: |
          if [ "${FORCE_BASE_REPLAY:-false}" = "true" ]; then
            python research/phase52/base_replay.py --force
          else
            python research/phase52/base_replay.py
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("results/phase52/base_replay/manifest.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            fh.write("PHASE52_HF_REVISION=" + manifest["dataset_revision"] + "\n")
          print(json.dumps({
            "status": manifest["status"],
            "dataset_revision": manifest["dataset_revision"],
            "trade_rows": manifest["trade_rows"],
            "strategies": manifest["strategies"],
            "sha256": manifest["trade_matrix_sha256"],
            "license_gate": manifest["license_gate"]
          }, indent=2))
          PY

      - name: Test configuration event-universe indexing
        run: python research/phase52/configuration_event_universe.py --self-test-only

      - name: Build exact timestamp event universe for the finite config grid
        run: python research/phase52/configuration_event_universe.py

      - name: Test option quote coverage audit semantics
        run: python research/phase52/option_quote_coverage_audit.py --self-test-only

      - name: Audit all exact option entry/exit bar availability across the config event universe
        run: python research/phase52/option_quote_coverage_audit.py

      - name: Audit selected ATM-offset strike OHLC and OI eligibility
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p results/phase52/selected_strike_coverage
          python research/phase52/selected_strike_coverage_audit.py --self-test
          python research/phase52/selected_strike_coverage_audit.py


      - name: Audit exact 10:00 entry-timestamp coverage by option expiry
        run: python research/phase52/expiry_coverage_audit.py

      - name: Audit pinned source schema, OI, quote timestamps and factor availability
        run: python research/phase52/data_readiness_audit.py

      - name: Build strictly lagged NSE daily OI and futures EOD factors
        run: python research/phase52/daily_bhavcopy_adapter.py

      - name: Test daily EOD factor-selector mechanics
        run: python research/phase52/daily_eod_factor_attribution.py --self-test-only

      - name: Run development-tuned selector test with lagged daily EOD factors
        run: python research/phase52/daily_eod_factor_attribution.py

      - name: Run point-in-time factor-selector pilot on frozen outcomes
        run: |
          python research/phase52/factor_attribution.py --self-test \
            --trades phase45-source/results/phase45_ready_made/full_ready_made_trade_matrix.csv \
            --features phase45-source/results/phase39_features/point_in_time_features.csv \
            --leakage-audit phase45-source/results/phase39_features/leakage_audit_v2.json \
            --out research/phase52/results/factor_attribution
      - name: Search public Hugging Face and GitHub catalogs, and YouTube if API key exists
        run: python research/phase52/source_discovery.py

      - name: Emit next reproducible configuration shard
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINT="research/phase52/results/config_queue/checkpoint.json"
          AUDIT="research/phase52/results/registry_audit.json"
          mkdir -p research/phase52/results/config_queue
          GRID="$(python -c 'import json; print(json.load(open("'"$AUDIT"'"))["grid_version"])')"
          OFFSET=0
          if [ -f "$CHECKPOINT" ]; then
            OLD_GRID="$(python -c 'import json; print(json.load(open("'"$CHECKPOINT"'")).get("grid_version", ""))')"
            if [ "$OLD_GRID" = "$GRID" ]; then
              OFFSET="$(python -c 'import json; print(json.load(open("'"$CHECKPOINT"'")).get("next_offset", 0))')"
            fi
          fi
          LIMIT="${INPUT_SHARD_SIZE:-25000}"
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 25000 ]; then
            echo "shard_size must be an integer from 1 to 25000" >&2
            exit 2
          fi
          echo "start_offset=$OFFSET" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          python research/phase52/validate_registry.py --emit-shard "$RUNNER_TEMP/phase52_config_shard.jsonl" --offset "$OFFSET" --limit "$LIMIT" > "$RUNNER_TEMP/phase52_emit_report.json"
          EMITTED="$(wc -l < "$RUNNER_TEMP/phase52_config_shard.jsonl" | tr -d ' ')"
          NEXT=$((OFFSET + EMITTED))
          TOTAL="$(python -c 'import json; print(json.load(open("'"$AUDIT"'"))["configuration_count"])')"
          SHA="$(sha256sum "$RUNNER_TEMP/phase52_config_shard.jsonl" | awk '{print $1}')"
          COMPLETE=false
          if [ "$NEXT" -ge "$TOTAL" ]; then COMPLETE=true; fi
          export GRID OFFSET LIMIT EMITTED NEXT TOTAL SHA COMPLETE
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          record = {
            "grid_version": os.environ["GRID"],
            "next_offset": int(os.environ["NEXT"]),
            "last_start_offset": int(os.environ["OFFSET"]),
            "last_shard_size": int(os.environ["EMITTED"]),
            "requested_shard_size": int(os.environ["LIMIT"]),
            "total_configurations": int(os.environ["TOTAL"]),
            "shard_sha256": os.environ["SHA"],
            "configuration_enumeration_complete": os.environ["COMPLETE"] == "true",
            "status": "ENUMERATED_NOT_BACKTESTED",
            "last_run_id": os.environ.get("GITHUB_RUN_ID", ""),
            "updated_at_utc": datetime.now(timezone.utc).isoformat(),
            "interpretation": "The offset records deterministic grid enumeration only. It is not a completed replay count and must not be reported as a number of tested strategies."
          }
          with open("research/phase52/results/config_queue/checkpoint.json", "w", encoding="utf-8") as fh:
            json.dump(record, fh, indent=2)
            fh.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"emitted={record['last_shard_size']}\n")
            fh.write(f"next_offset={record['next_offset']}\n")
            fh.write(f"total={record['total_configurations']}\n")
            fh.write(f"complete={str(record['configuration_enumeration_complete']).lower()}\n")
          PY

      - name: Append research and status checkpoint
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          stamp = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%Y-%m-%d %H:%M:%S IST")
          audit = json.loads(Path("research/phase52/results/registry_audit.json").read_text())
          checkpoint = json.loads(Path("research/phase52/results/config_queue/checkpoint.json").read_text())
          source_report = json.loads(Path("research/phase52/results/source_discovery/latest.json").read_text())
          factor_report = json.loads(Path("research/phase52/results/factor_attribution/summary.json").read_text())
          base_manifest = json.loads(Path("results/phase52/base_replay/manifest.json").read_text())
          data_audit = json.loads(Path("results/phase52/data_readiness/source_capability_audit.json").read_text())
          coverage_report = json.loads(Path("results/phase52/coverage_audit/summary.json").read_text())
          bhavcopy_manifest = json.loads(Path("results/phase52/daily_bhavcopy/manifest.json").read_text())
          event_universe = json.loads(Path("results/phase52/configuration_event_universe/summary.json").read_text())
          option_quote_audit = json.loads(Path("results/phase52/option_quote_coverage/summary.json").read_text())
          selected_strike_audit = json.loads(Path("results/phase52/selected_strike_coverage/summary.json").read_text())
          eod_selector_manifest = json.loads(Path("results/phase52/daily_eod_selector/manifest.json").read_text())
          import pandas as pd
          eod_selector_rows = pd.read_csv("results/phase52/daily_eod_selector/selector_results.csv")
          eod_validation = eod_selector_rows[(eod_selector_rows["split"] == "validation") & (eod_selector_rows["status"] == "EXPLORATORY_NO_PROMOTION")]
          if len(eod_validation) and "paired_mean_uplift_legacy_stress_rupees" in eod_validation:
            best_eod = eod_validation.sort_values("paired_mean_uplift_legacy_stress_rupees", ascending=False).iloc[0]
            best_eod_summary = f"{best_eod['mode']} uplift={best_eod['paired_mean_uplift_legacy_stress_rupees']:.0f} INR/event, Holm p={best_eod.get('p_holm_across_frozen_EOD_modes', float('nan')):.4f}"
          else:
            best_eod_summary = "no validation mode cleared sample/coverage reporting gates"
          msg = (
            f"\n## {stamp} — Automated run {os.environ.get('GITHUB_RUN_ID', 'unknown')}\n\n"
            f"- Registry validation: {audit['registry_validation']}; hypotheses registered: {audit['candidate_hypotheses']}; structure families: {audit['structure_families']}; selector modes: {audit['selector_modes']}.\n"
            f"- Finite configurations in grid {audit['grid_version']}: {audit['configuration_count']:,}; this run enumerated {checkpoint['last_shard_size']:,} configurations at offsets {checkpoint['last_start_offset']:,}–{checkpoint['next_offset'] - 1:,}.\n"
            f"- Source-discovery queries: {len(source_report['queries'])}; unique leads added: {source_report.get('new_unique_source_leads_added', 0)}. Credential presence only (no values logged): {source_report['credentials_present']}.\n"
            f"- Queue status: {checkpoint['status']}; enumeration complete: {checkpoint['configuration_enumeration_complete']}. Enumerated configs are NOT backtests.\n"
            f"- Pinned base replay: {base_manifest['status']}; revision={base_manifest['dataset_revision']}; trade rows={base_manifest['trade_rows']}; strategies={base_manifest['strategies']}; license gate={base_manifest['license_gate']}.\n"
            f"- Configuration event universe: {event_universe['status']}; source expiries={event_universe['source_option_expiry_files']}; expected grid events={event_universe['expected_event_count']}; exact index entry ticks={event_universe['exact_index_entry_timestamp_count']}; missing exact index ticks={event_universe['events_without_exact_index_entry_timestamp']}.\n"
            f"- Exact option bar coverage: {option_quote_audit['status']}; event rows audited={option_quote_audit['event_rows_with_audit_results']}/{option_quote_audit['expected_event_rows']}; events with option rows at exact entry={option_quote_audit['events_with_any_option_row_at_exact_entry']}; entries with OI-qualified contracts={option_quote_audit['events_with_any_oi_eligible_contract_at_entry']}; source file errors={option_quote_audit['source_file_errors']}; config-specific legs still require replay-worker checks.\n"
            f"- Selected ATM-offset leg audit: {selected_strike_audit['status']}; files={selected_strike_audit['source_expiry_files_audited']}/{selected_strike_audit['source_expiry_files_expected']}; leg-event rows={selected_strike_audit['option_type_rows']}; OI-qualified entries={selected_strike_audit['entry_oi_ge_100_rows']}; exact-index+OI+expiry-exit rows={selected_strike_audit['exact_entry_and_expiry_exit_rows']}; source errors={selected_strike_audit['source_file_errors']}; ABS_DELTA remains blocked; no P&L.\n"
            f"- Fixed 10:00 coverage audit: {coverage_report['status']}; source expiries={coverage_report['option_expiry_files_in_scope']}; base matrix expiries={coverage_report['unique_expiries_in_base_matrix']}; last source expiry={coverage_report['last_source_option_expiry']}; last matrix expiry={coverage_report['last_matrix_expiry']}; missing/unreplayed={coverage_report['source_expiry_rows_not_fully_replayed']}.\n"
            f"- Data capability audit: {data_audit['status']}; sampled source files={len(data_audit['sources'])}; factor availability and licensing limits retained.\n"
            f"- Prior-session NSE EOD factor build: {bhavcopy_manifest['status']}; event coverage={bhavcopy_manifest['feature_event_coverage']:.1%}; missing archive paths={bhavcopy_manifest['missing_archive_paths']}; file errors={bhavcopy_manifest['archive_file_errors']}; not intraday futures basis.\n"
            f"- EOD selector pilot: {eod_selector_manifest['status']}; matched events={eod_selector_manifest['matched_event_rows']}; fixed development baseline={eod_selector_manifest['selected_baseline_strategy']}; best validation uplift diagnostic={best_eod_summary}; no promotion.\n"
            f"- Factor-selector pilot: {factor_report['status']}; PIT match={factor_report['input_audit']['feature_match_rate']:.1%}; risk-limited legacy templates={factor_report.get('risk_limited_strategy_count', 0)}; chosen features={factor_report.get('selected_feature_by_mode', {})}.\n"
            "- The legacy factor-selector pilot is not the full Phase52 configuration sweep. No Phase52 candidate is promoted.\n"
          )
          Path("PHASE52_RESEARCH_LOG.md").open("a", encoding="utf-8").write(msg)
          Path("PHASE52_STATUS.md").open("a", encoding="utf-8").write(
            f"\n## Automated checkpoint — {stamp}\n- Workflow run: {os.environ.get('GITHUB_RUN_ID', 'unknown')}\n"
            f"- Source leads newly recorded: {source_report.get('new_unique_source_leads_added', 0)}.\n"
            f"- Configurations enumerated in this run: {checkpoint['last_shard_size']:,} of {checkpoint['total_configurations']:,} finite-grid combinations. This is queue enumeration only, not strategy testing.\n"
            f"- Selected ATM-offset audit: {selected_strike_audit['status']}; {selected_strike_audit['option_type_rows']:,} leg-event rows; strict exact-index/OI/expiry-exit rows={selected_strike_audit['exact_entry_and_expiry_exit_rows']:,}; no P&L.\n"
            f"- Daily EOD factor-selector: {eod_selector_manifest['status']}; validation diagnostic={best_eod_summary}; report at results/phase52/daily_eod_selector/REPORT.md.\n"
            f"- Legacy factor-selector pilot: {factor_report['status']} (PIT match {factor_report['input_audit']['feature_match_rate']:.1%}); report at research/phase52/results/factor_attribution/REPORT.md.\n"
          )
          PY

      - name: Record failure without accepting partial outputs as evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p research/phase52/results
          printf "\n## F52-AUTO-%s — Automated workflow failure\n\n- Date: %s\n- Run: https://github.com/%s/actions/runs/%s\n- Impact: no output is accepted solely because this workflow failed or partially ran. Check each output manifest/gate; preserve any completed audit/replay as diagnostic unless its own evidence gate passes.\n- Root cause: pending review of the failed job logs.\n- Status: OPEN.\n" "$GITHUB_RUN_ID" "$(date -u +%F)" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> PHASE52_ERROR_LOG.md

      - name: Save partial or complete market-data cache even if a later gate fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/phase52/nse_fno_bhavcopy
          key: phase52-market-data-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload audit and deterministic configuration shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase52-discovery-${{ github.run_id }}
          path: |
            research/phase52/results/registry_audit.json
            research/phase52/results/config_queue/checkpoint.json
            research/phase52/results/source_discovery/latest.json
            research/phase52/results/factor_attribution
            results/phase52/base_replay
            results/phase52/configuration_event_universe
            results/phase52/option_quote_coverage
            results/phase52/coverage_audit
            results/phase52/data_readiness
            results/phase52/daily_bhavcopy
            results/phase52/daily_eod_selector
            ${{ runner.temp }}/phase52_config_shard.jsonl
            ${{ runner.temp }}/phase52_emit_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist source ledger, checkpoints, status and errors to research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never publish selected-strike results from a stale script snapshot.
          git fetch origin "$PHASE_BRANCH"
          if ! git diff --quiet "origin/$PHASE_BRANCH" -- research/phase52/selected_strike_coverage_audit.py; then
            echo "Selected-strike source changed during this run; preserving the remote result state and discarding this run's stale output."
            if git ls-tree -r --name-only "origin/$PHASE_BRANCH" -- results/phase52/selected_strike_coverage | grep -q .; then
              git checkout "origin/$PHASE_BRANCH" -- results/phase52/selected_strike_coverage
            else
              rm -rf results/phase52/selected_strike_coverage
              mkdir -p results/phase52/selected_strike_coverage
              touch results/phase52/selected_strike_coverage/.gitkeep
            fi
          fi
          # Registry summaries are only valid for the specification CSV snapshot used by this run.
          if ! git diff --quiet "origin/$PHASE_BRANCH" -- research/phase52/strategy_specifications.csv; then
            echo "Strategy specifications changed during this run; preserving the remote registry audit."
            if git cat-file -e "origin/$PHASE_BRANCH:research/phase52/results/registry_audit.json" 2>/dev/null; then
              git checkout "origin/$PHASE_BRANCH" -- research/phase52/results/registry_audit.json
            else
              rm -f research/phase52/results/registry_audit.json
            fi
          fi
          git add PHASE52_STATUS.md PHASE52_RESEARCH_LOG.md PHASE52_ERROR_LOG.md research/phase52/results results/phase52/base_replay results/phase52/configuration_event_universe results/phase52/option_quote_coverage results/phase52/selected_strike_coverage results/phase52/coverage_audit results/phase52/data_readiness results/phase52/daily_bhavcopy results/phase52/daily_eod_selector
          if git diff --cached --quiet; then
            echo "No branch state changed."
            exit 0
          fi
          git commit -m "Phase 52 automated research checkpoint $GITHUB_RUN_ID"
          # Rebase durable results instead of force-pushing. If two append-only
          # research checkpoints collide, union the conflict blocks in the logs.
          # This preserves both the workflow checkpoint and a concurrent manual status update.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$PHASE_BRANCH"
            if git rebase "origin/$PHASE_BRANCH"; then
              if git push origin "$PHASE_BRANCH"; then
                pushed=true
                break
              fi
              echo "Push raced with another update; retrying rebase (attempt $attempt)." >&2
              continue
            fi
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [ -z "$conflicts" ]; then
              echo "Rebase failed without a resolvable append-only document conflict." >&2
              git rebase --abort || true
              exit 1
            fi
            python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {"PHASE52_STATUS.md", "PHASE52_RESEARCH_LOG.md", "PHASE52_ERROR_LOG.md"}
          result_prefixes = ("research/phase52/results/", "results/phase52/")
          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True
          ).splitlines()
          unexpected = [name for name in files if name not in allowed and not name.startswith(result_prefixes)]
          if unexpected:
              raise SystemExit(f"Refusing automatic conflict resolution for source/code conflicts: {sorted(unexpected)}")
          for name in files:
              if name not in allowed:
                  # Keep the already-persisted remote result for a generated-artifact
                  # collision. The losing shard can be deterministically re-emitted.
                  subprocess.run(["git", "checkout", "--ours", "--", name], check=True)
                  continue
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              out = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith("<<<<<<< "):
                      out.append(lines[i])
                      i += 1
                      continue
                  i += 1
                  ours = []
                  while i < len(lines) and lines[i] != "=======":
                      ours.append(lines[i]); i += 1
                  if i >= len(lines):
                      raise SystemExit(f"Malformed conflict in {name}: missing =======")
                  i += 1
                  theirs = []
                  while i < len(lines) and not lines[i].startswith(">>>>>>> "):
                      theirs.append(lines[i]); i += 1
                  if i >= len(lines):
                      raise SystemExit(f"Malformed conflict in {name}: missing >>>>>>>")
                  i += 1
                  # These files are append-only. Keep both sides in chronological-ish
                  # order and suppress only exact lines repeated on both sides.
                  seen = set(ours)
                  out.extend(ours)
                  out.extend(line for line in theirs if line not in seen)
              path.write_text("\\n".join(out) + "\\n", encoding="utf-8")
          PY
            git add $conflicts
            GIT_EDITOR=true git rebase --continue
            if git push origin "$PHASE_BRANCH"; then
              pushed=true
              break
            fi
            echo "Push raced after conflict union; retrying (attempt $attempt)." >&2
          done
          if [ "$pushed" != true ]; then
            echo "Could not persist checkpoint after three safe push/rebase attempts." >&2
            exit 1
          fi
