name: Phase 50B - Option Data Schema Probe

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - research/phase50b_data_schema_probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow huggingface_hub
      - name: Probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python research/phase50b_data_schema_probe.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-schema-${{ github.run_id }}
          path: results/phase50b/schema_probe.json
