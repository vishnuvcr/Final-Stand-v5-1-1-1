name: Phase 40 - Exhaustive Ensemble Direction Models

on:
  push:
    branches:
      - phase-40-ensemble-direction-models
    paths:
      - 'PHASE40_**.md'
      - 'research/phase40_ensemble_direction.py'
      - '.github/workflows/phase-40-ensemble-direction-models.yml'
      - 'data/phase36_selector_predictions.csv'
      - 'results/phase39_features/point_in_time_features.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase40-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exhaustive-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas pyarrow huggingface_hub yfinance

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Acquire and cache India VIX
        run: |
          mkdir -p data/phase40_vix
          if [ ! -f data/phase40_vix/india_vix.csv ]; then
            python -c "import pandas as pd, yfinance as yf; x=yf.download('^INDIAVIX',start='2020-01-01',end='2026-07-02',progress=False,auto_adjust=False); assert not x.empty,'India VIX download returned no rows'; x.columns=[c[0] if isinstance(c,tuple) else c for c in x.columns] if isinstance(x.columns,pd.MultiIndex) else x.columns; x=x.reset_index(); x.columns=[str(c).lower().replace(' ','_') for c in x.columns]; assert 'date' in x.columns and 'close' in x.columns, x.columns.tolist(); x[['date','close']].to_csv('data/phase40_vix/india_vix.csv',index=False)"
            git add data/phase40_vix/india_vix.csv
            git commit -m "phase40: cache India VIX"
            git push origin HEAD:phase-40-ensemble-direction-models
          fi

      - name: Run exhaustive ensemble screen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase40_ensemble_direction.py

      - name: Verify grid and artifacts
        run: |
          test -s results/phase40_ensemble/grid_validation.csv
          test -s results/phase40_ensemble/holdout_top10.csv
          test -s results/phase40_ensemble/selection.json
          python -c "import json,pandas as pd; g=pd.read_csv('results/phase40_ensemble/grid_validation.csv'); s=json.load(open('results/phase40_ensemble/selection.json')); assert len(g)==1764,len(g); assert int(s['grid_candidates'])==1764,s; assert int(s['top10_count'])==10,s; print(s['top10'][0])"

      - name: Persist results
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add results/phase40_ensemble
          git commit -m "phase40: exhaustive ensemble results" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
