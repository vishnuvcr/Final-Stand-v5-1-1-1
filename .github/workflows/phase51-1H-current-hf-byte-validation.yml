name: Phase 51-1H Current HF Byte Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase-51-1H-current-hf-byte-validation
    paths:
      - trigger/phase51_1H.start
      - research/phase51_1H_current_hf_byte_validation.py
      - .github/workflows/phase51-1H-current-hf-byte-validation.yml

concurrency:
  group: phase51-1H-current-hf-byte-validation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input pandas pyarrow huggingface_hub
      - name: Validate current public bytes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase51_1H_current_hf_byte_validation.py
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-1H-current-hf-byte-validation-${{ github.run_id }}
          path: results/phase51/phase51_1H/
      - name: Publish audit
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase51/phase51_1H
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 51-1H: publish current HF byte audit"
          git pull --rebase origin phase-51-1H-current-hf-byte-validation
          git push origin HEAD:phase-51-1H-current-hf-byte-validation
