name: Phase 3 Restarted Statistical Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy matplotlib
      - name: Run statistical analysis
        run: python research/analyze_phase3.py
      - name: Persist Phase 3 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/restarted_v2/phase3
          git commit -m 'Phase 3: persist statistical analysis' || echo 'No result changes'
          git push origin HEAD:${GITHUB_REF_NAME} || true
