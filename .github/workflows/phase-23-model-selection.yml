name: Phase 23 model selection and canonical-reverse-skip analysis

on:
  push:
    branches:
      - phase-23-regime-option-crossmarket-directional-switch
    paths:
      - "research/phase23_model.py"
      - ".github/workflows/phase-23-model-selection.yml"
      - "results/dynamic_n_corrected/phase23_entry_state/phase23_entry_features.csv"
      - "results/dynamic_n_corrected/phase23_entry_state/canonical_trade_ledger.csv"
      - "results/dynamic_n_corrected/phase23_entry_state/reverse_trade_ledger.csv"
  workflow_run:
    workflows:
      - "Phase 23 entry-state audit and reverse-direction research"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'phase-23-regime-option-crossmarket-directional-switch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: phase-23-regime-option-crossmarket-directional-switch
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-phase23-model-${{ runner.os }}-v1
          restore-keys: |
            pip-phase23-model-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn
      - name: Run Phase 23 model
        run: python research/phase23_model.py
      - name: Persist model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dynamic_n_corrected/phase23_entry_state
          git commit -m "Phase 23: persist action-model results" || true
          git pull --rebase origin phase-23-regime-option-crossmarket-directional-switch
          git push origin HEAD:phase-23-regime-option-crossmarket-directional-switch
