name: Phase 109 — family registry, exhaustive grid manifest and source access audit

on:
  workflow_dispatch:
  push:
    branches:
      - phase-109-exhaustive-parameter-grid
    paths:
      - "research/phase109/**"
      - ".github/workflows/phase109-family-grid-compiler.yml"

permissions:
  contents: write

concurrency:
  group: phase109-family-grid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 109 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore private source cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase109
          key: ${{ runner.os }}-phase109-dhan-hf-source-cache-v2-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-phase109-dhan-hf-source-cache-v2-${{ github.ref_name }}-
            ${{ runner.os }}-phase109-dhan-hf-source-cache-v1-

      - name: Compile all registered family and cost-row manifests
        run: |
          set -euo pipefail
          python -m py_compile research/phase109/family_grid.py
          python research/phase109/family_grid.py --mode build --out results/phase109
          python research/phase109/family_grid.py --mode test --out results/phase109

      - name: Probe Dhan and discover Hugging Face dataset candidates
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN || secrets.DHAN_TOKEN || secrets.DHAN_JWT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python research/phase109/family_grid.py --mode source-audit --out results/phase109
          # Do not print credentials, request headers, or authenticated response payloads.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("results/phase109/source_access_summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("Source audit written. Dhan token present:", bool(d.get("dhan_secret_present")))
          print("Hugging Face token present:", bool(d.get("hf_token_present")))
          print("Authenticated values are not printed.")
          PY

      - name: Update Phase 109 status, research log, error log and visible chat log
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path
          summary = json.loads(Path("results/phase109/phase109_grid_summary.json").read_text(encoding="utf-8"))
          source = json.loads(Path("results/phase109/source_access_summary.json").read_text(encoding="utf-8"))
          audits = list(csv.DictReader(Path("results/phase109/source_access_audit.csv").open(encoding="utf-8")))
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          source_lines = "\n".join(
              f"- {row.get('source')} {row.get('query', '')}: **{row.get('status')}**; "
              f"candidates={row.get('dataset_candidates', 'n/a')}; bars={row.get('bar_count', 'n/a')}."
              for row in audits
          )
          status = f"""# Phase 109 Status — Strategy-Family Discovery and Exhaustive Grid

          Last updated: {now}
          Branch: `phase-109-exhaustive-parameter-grid`
          State: **REGISTRY AND GRID MANIFEST COMPILED; EMPIRICAL EVALUATION NOT YET RUN**
          Promotion: **NONE**

          ## Completed in this step
          - [x] 109.0 Register the corrected requirement and data-source feasibility gates.
          - [x] 109.1 Register {summary['family_count']:,} rule-architecture combinations from 41 signal cores × 5 confirmation structures × 5 regime gates; exact duplicate fingerprints: {summary['exact_duplicate_fingerprints']}.
          - [x] 109.2 Compile every applicable Cartesian parameter space and deterministic cost-row shard manifest. Minimum configurations per family: {summary['configurations_per_family_min']:,}; total family-configuration pairs: {summary['total_family_configuration_pairs']:,}; 24 cost cases create {summary['total_cost_adjusted_rows']:,} cost-adjusted rows across {summary['shard_count']:,} shards.
          - [x] Registry self-test: PASS; contiguous shard coverage reconciled.
          - [x] Run initial Dhan/Hugging Face source-access and discovery checks.

          ## Still pending
          - [ ] 109.3 Validate licensed historical datasets, point-in-time fields, longer chronologically split development/validation/untouched test windows and contract identity.
          - [ ] 109.4 Run every eligible family/configuration/cost row in resumable shards. A registered row is not a tested row.
          - [ ] 109.5 Statistical, accounting, multiple-testing and coverage audits.
          - [ ] 109.6 Publish performance results/manuscript and stop at the bounded plan.

          ## Important interpretation
          `total_family_configuration_pairs` and `total_cost_adjusted_rows` are manifest counts, **not completed backtests**. No family has been promoted. Families remain blocked/pending wherever historical inputs, source rights, point-in-time availability or execution-quality data have not passed audit.

          - [Grid compiler report](results/phase109/PHASE109_GRID_COMPILER_REPORT.md)
          - [Family registry](results/phase109/strategy_families.csv)
          - [Per-family configuration manifest](results/phase109/family_configuration_space.csv)
          - [Cost-row shard manifest](results/phase109/cost_row_shard_manifest.csv)
          - [Source-access audit](results/phase109/source_access_audit.csv)
          - [Research plan](PHASE109_RESEARCH_PLAN.md) · [research log](PHASE109_RESEARCH_LOG.md) · [error log](PHASE109_ERROR_LOG.md) · [chat log](PHASE109_CHAT_LOG.md)
          """
          Path("PHASE109_STATUS.md").write_text(status, encoding="utf-8")

          log_path = Path("PHASE109_RESEARCH_LOG.md")
          old_log = log_path.read_text(encoding="utf-8") if log_path.exists() else "# Phase 109 Research Log\n"
          marker = "## 2026-10-12 — Family registry and grid compiler"
          entry = f"""{marker}
          - Deterministic registry build completed at {now}. Registered {summary['family_count']:,} architecture combinations; exact duplicate fingerprints={summary['exact_duplicate_fingerprints']}; fingerprints={summary['distinct_architecture_fingerprints']:,}.
          - Minimum/maximum configurations per family: {summary['configurations_per_family_min']:,}/{summary['configurations_per_family_max']:,}; complete applicable Cartesian universe={summary['total_family_configuration_pairs']:,} configuration tuples and {summary['total_cost_adjusted_rows']:,} cost rows across {summary['shard_count']:,} deterministic shards.
          - Registry and manifest hashes: registry `{summary['registry_hash_sha256']}`; configuration `{summary['configuration_manifest_hash_sha256']}`; cost grid `{summary['cost_grid_hash_sha256']}`; full manifest `{summary['full_manifest_hash_sha256']}`.
          - Self-test: PASS. This verifies count, distinct architecture fingerprints, valid per-family Cartesian counts, 24 cost scenarios and contiguous shard ranges only; it does not run the strategies.
          - Source-access findings:
          {source_lines}
          - No strategy is promoted. All empirical evaluation remains pending historical source/point-in-time/license and OOS gates.
          """
          if marker in old_log:
              old_log = old_log.split(marker)[0].rstrip() + "\n\n" + entry + "\n"
          else:
              old_log = old_log.rstrip() + "\n\n" + entry + "\n"
          log_path.write_text(old_log, encoding="utf-8")

          err_path = Path("PHASE109_ERROR_LOG.md")
          old_err = err_path.read_text(encoding="utf-8") if err_path.exists() else "# Phase 109 Error and Limitation Log\n"
          err_marker = "## 2026-10-12 — Grid compilation and source probe"
          errors = []
          hf_no_results = sum(1 for row in audits if row.get("source") == "Hugging Face dataset discovery" and row.get("status") == "NO_RESULTS")
          hf_card_reviews = [row for row in audits if row.get("source") == "Hugging Face dataset card inspection" and row.get("status") in {"METADATA_DISCOVERED_LICENSE_DECLARED_BUT_UNVERIFIED", "METADATA_DISCOVERED_LICENSE_MISSING"}]
          for row in audits:
              s = row.get("status", "")
              if row.get("source") == "Hugging Face dataset discovery" and s == "NO_RESULTS":
                  continue
              if row.get("source") == "Hugging Face dataset card inspection" and s in {"METADATA_DISCOVERED_LICENSE_DECLARED_BUT_UNVERIFIED", "METADATA_DISCOVERED_LICENSE_MISSING"}:
                  continue
              if s not in {"AUTH_AND_SCHEMA_PROBE_OK", "METADATA_DISCOVERED"}:
                  errors.append(f"- Source probe status for {row.get('source')} {row.get('query', '')}: **{s or 'UNKNOWN'}**. {row.get('note', '')}")
          if hf_no_results:
              errors.append(f"- Hugging Face Hub returned no matches for {hf_no_results} of {len(source.get('terms', {})) if isinstance(source.get('terms'), dict) else 'the'} discovery terms. This is a search-coverage limitation, not an API outage; broaden the search and inspect known candidates.")
          if hf_card_reviews:
              card_list = "; ".join(f"{row.get('dataset_id')} (license={row.get('license', 'NOT_DECLARED')})" for row in hf_card_reviews)
              errors.append(f"- Hugging Face candidates requiring rights/schema/data-provenance review before use: {card_list}. These are source limitations, not a technical workflow failure; the registry remains blocked until audit.")
          errors.extend([
              "- This step enumerated the hypothesis/configuration space but evaluated no strategy returns; count totals must never be reported as backtests.",
              "- Dhan endpoint data, if returned, were limited to a small access/schema probe. Full-window coverage, historical contract identity, source rights and fill realism remain unverified.",
              "- Hugging Face results are dataset discovery metadata only. No candidate may be downloaded into the experiment until license, date coverage, schema and point-in-time leakage are checked.",
              "- The exhaustive Cartesian grid is large and must be resumed by deterministic shards. Any failed/skipped shard or cost case must remain explicitly logged.",
              "- Resolved workflow error: actions/setup-python pip caching failed because this repository has no requirements.txt or pyproject.toml; removed the pip-cache assumption.",
              "- Resolved compiler error: the architecture gate assumed 1,000 families although 41 core rules × 5 confirmation structures × 5 regime gates creates 1,025; changed the gate to compare against registered Cartesian cardinality.",
          ])
          err_entry = err_marker + "\n" + "\n".join(errors) + "\n"
          if err_marker in old_err:
              old_err = old_err.split(err_marker)[0].rstrip() + "\n\n" + err_entry
          else:
              old_err = old_err.rstrip() + "\n\n" + err_entry
          err_path.write_text(old_err, encoding="utf-8")

          chat_path = Path("PHASE109_CHAT_LOG.md")
          old_chat = chat_path.read_text(encoding="utf-8") if chat_path.exists() else "# Phase 109 Visible Conversation Log\n"
          chat_marker = "## 2026-10-12 — Dhan and Hugging Face access requested"
          chat_entry = f"""{chat_marker}
          User: “I have added dhan access token and hf token. Utilise them alongwith other free sources if needed”
          Assistant action summary: added a deterministic family registry/grid compiler and an automatic/manual GitHub Actions workflow. Dhan credentials are read only from the secret environment; Hugging Face metadata discovery uses HF_TOKEN when available. This step compiled {summary['family_count']:,} architecture combinations and {summary['total_family_configuration_pairs']:,} registered configuration tuples with {summary['total_cost_adjusted_rows']:,} cost-adjusted rows across {summary['shard_count']:,} shards. These are manifest counts, not observed trading tests.
          """
          if chat_marker in old_chat:
              old_chat = old_chat.split(chat_marker)[0].rstrip() + "\n\n" + chat_entry + "\n"
          else:
              old_chat = old_chat.rstrip() + "\n\n" + chat_entry + "\n"
          chat_path.write_text(old_chat, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = "<!-- PHASE109_GRID_STATUS_START -->"
          end = "<!-- PHASE109_GRID_STATUS_END -->"
          section = f"""<!-- PHASE109_GRID_STATUS_START -->
          # Phase 109 — 1,000+ strategy-family discovery and exhaustive grid

          **Status: registry/manifest compiled; empirical backtests not run. No strategy promoted.** {summary['family_count']:,} architecture combinations are registered with {summary['exact_duplicate_fingerprints']} exact duplicate fingerprints. The Cartesian grid contains {summary['total_family_configuration_pairs']:,} registered family-configuration pairs and {summary['total_cost_adjusted_rows']:,} cost-adjusted rows (24 cost cases), partitioned into {summary['shard_count']:,} deterministic shards. These are planned coverage counts, not completed trading tests.

          - [Phase 109 branch](https://github.com/vishnuvcr/Final-Stand-v5-1-1-1/tree/phase-109-exhaustive-parameter-grid)
          - [Status](PHASE109_STATUS.md) · [research plan](PHASE109_RESEARCH_PLAN.md) · [research log](PHASE109_RESEARCH_LOG.md) · [error log](PHASE109_ERROR_LOG.md) · [visible chat log](PHASE109_CHAT_LOG.md)
          - [Registry](results/phase109/strategy_families.csv) · [configuration space](results/phase109/family_configuration_space.csv) · [shard manifest](results/phase109/cost_row_shard_manifest.csv) · [source audit](results/phase109/source_access_audit.csv) · [compiler report](results/phase109/PHASE109_GRID_COMPILER_REPORT.md)

          Source-access checks do not prove dataset completeness or tradeability. Chronological splits, exact option contracts, transaction costs, slippage, multiple-testing correction and untouched OOS validation remain mandatory.
          <!-- PHASE109_GRID_STATUS_END -->"""
          if start in readme and end in readme:
              pre, remainder = readme.split(start, 1)
              _, post = remainder.split(end, 1)
              readme = pre + section + post
          else:
              readme = section + "\n\n" + readme
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit generated registry and audit logs to Phase 109 branch
        if: github.ref == 'refs/heads/phase-109-exhaustive-parameter-grid'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE109_STATUS.md PHASE109_RESEARCH_LOG.md PHASE109_ERROR_LOG.md PHASE109_CHAT_LOG.md README.md
          git add results/phase109/strategy_families.csv results/phase109/family_configuration_space.csv results/phase109/cost_scenarios.csv results/phase109/cost_row_shard_manifest.csv results/phase109/phase109_grid_summary.json results/phase109/PHASE109_GRID_COMPILER_REPORT.md results/phase109/PHASE109_SELF_TEST.txt results/phase109/source_access_audit.csv results/phase109/huggingface_dataset_candidates.json results/phase109/source_access_summary.json
          if git diff --cached --quiet; then
            echo "No repository updates to commit."
          else
            git commit -m "Phase 109: publish strategy-family registry and exhaustive grid manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload non-sensitive registry and audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase109-family-registry-and-grid-${{ github.run_id }}
          path: |
            results/phase109/strategy_families.csv
            results/phase109/family_configuration_space.csv
            results/phase109/cost_scenarios.csv
            results/phase109/cost_row_shard_manifest.csv
            results/phase109/phase109_grid_summary.json
            results/phase109/PHASE109_GRID_COMPILER_REPORT.md
            results/phase109/PHASE109_SELF_TEST.txt
            results/phase109/source_access_audit.csv
            results/phase109/huggingface_dataset_candidates.json
            results/phase109/source_access_summary.json
          if-no-files-found: error
