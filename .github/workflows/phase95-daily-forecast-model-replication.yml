name: Phase 95 Daily Forecast Model Replication

on:
  push:
    branches: [phase-95-daily-forecast-model-replication]
    paths:
      - 'PHASE95_RESEARCH_PLAN.md'
      - 'research/phase95/**'
      - '.github/workflows/phase95-daily-forecast-model-replication.yml'
      - 'requirements-phase95.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase95-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-phase95.txt
      - name: Restore cached daily data
        uses: actions/cache@v4
        with:
          path: .cache/phase95
          key: phase95-nifty-daily-v1-${{ runner.os }}-${{ hashFiles('requirements-phase95.txt') }}
          restore-keys: |
            phase95-nifty-daily-v1-${{ runner.os }}-
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-phase95.txt
      - name: Run leak / feature / factory tests
        run: python -m pytest -q research/phase95/test_daily_forecast_replication.py
      - name: Run fixed chronological replication
        run: python research/phase95/daily_forecast_replication.py
      - name: Reconcile primary close endpoint, paper claims and README
        run: python research/phase95/reconcile_phase95_report.py
      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: phase95-aggregate-results
          path: |
            results/phase95/REPORT.md
            results/phase95/model_metrics.csv
            results/phase95/data_manifest.json
            results/phase95/modality_status.csv
            results/phase95/coverage.csv
            results/phase95/run_summary.json
            results/phase95/comparison.svg
          if-no-files-found: warn
          retention-days: 90
      - name: Commit report and status even when data is blocked
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE95_STATUS.md PHASE95_ERROR_LOG.md PHASE95_RESEARCH_LOG.md results/phase95
          if git diff --cached --quiet; then
            echo "No aggregate changes to commit."
          else
            git commit -m "Phase 95: publish replication run outputs and status"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
