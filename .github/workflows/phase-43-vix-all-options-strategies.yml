name: Phase 43 - VIX Conditioned All Strategy Sweep

on:
  push:
    branches:
      - phase-43-vix-all-options-strategies
    paths:
      - "trigger/phase43.start"
      - "research/phase43_vix_strategy_sweep.py"
      - "PHASE43_RESEARCH_PLAN.md"
      - "PHASE43_PRE_REGISTRATION.md"
  pull_request:
    paths:
      - "trigger/phase43.start"
      - "research/phase43_vix_strategy_sweep.py"
      - "PHASE43_RESEARCH_PLAN.md"
      - "PHASE43_PRE_REGISTRATION.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase43-vix-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase43-hf-\${{ runner.os }}-v1
          restore-keys: |
            phase43-hf-\${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas pyarrow scipy matplotlib huggingface_hub

      - name: Syntax audit
        run: |
          python -m py_compile research/phase43_vix_strategy_sweep.py

      - name: Preflight
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: |
          test -s data/phase40_vix/india_vix.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/phase40_vix/india_vix.csv")
          assert len(x) >= 1000, len(x)
          print("VIX cache rows:", len(x))
          PY

      - name: Run Phase 43
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python research/phase43_vix_strategy_sweep.py
          code=$?
          if [ "$code" -ne 0 ]; then
            printf "\\n## F43-RUN-%s — numerical execution failure\\n- Exit code: %s. Failed output is non-evidence.\\n" "\${GITHUB_RUN_ID}" "$code" >> ERROR_LOG.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ERROR_LOG.md
            git commit -m "phase43: log failed numerical run \${GITHUB_RUN_ID}" || true
            git push origin "HEAD:\${GITHUB_HEAD_REF:-\${GITHUB_REF_NAME}}" || true
            exit "$code"
          fi

      - name: Artifact audit
        run: |
          test -s results/phase43_vix/strategy_trade_matrix_all_splits.csv
          test -s results/phase43_vix/strategy_summary_by_split.csv
          test -s results/phase43_vix/strategy_vix_validation_grid.csv
          test -s results/phase43_vix/strategy_vix_inference.csv
          test -s results/phase43_vix/frozen_top10_strategy_vix_candidates.csv
          test -s results/phase43_vix/router_dev_validation.csv
          test -s results/phase43_vix/frozen_router_holdout.csv
          test -s results/phase43_vix/frozen_top10_holdout.csv
          test -s results/phase43_vix/frozen_router_maps.json
          test -s results/phase43_vix/summary.json
          test -s results/phase43_vix/strategy_vix_heatmap.png

      - name: Finalize status and logs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path("results/phase43_vix/summary.json").read_text())
          Path("PHASE43_STATUS.md").write_text(
              "# Phase 43 Status — VIX-Conditioned NIFTY All-Strategy Sweep\n\n"
              f"**{s['status']}**\n\n"
              f"Strategies declared: {s['strategies_declared']}\n"
              f"Defined-risk strategies: {s['defined_risk_strategies']}\n"
              f"Expiry opportunities: {s['opportunities']}\n"
              f"Strategy observations: {s['trade_rows']}\n"
              f"Development / validation / holdout observations: {s['development_rows']} / {s['validation_rows']} / {s['holdout_rows']}\n"
              f"Frozen strategy×VIX candidates: {s['frozen_top10_count']}\n"
              f"Frozen routers: {s['frozen_router_count']}\n"
              f"Stage 5 active-exit state: {s['stage5']}\n"
              f"Decision: **{s['decision']}**\n\n"
              "The canonical Phase-20/42 strategy remains unchanged unless a separately registered promotion gate is passed.\n"
          )
          with Path("RESEARCH_LOG.md").open("a") as f:
              f.write(
                  f"\n\n## 2026-10-06 — Phase 43 structural execution run {os.environ.get('GITHUB_RUN_ID','unknown')}\n"
                  f"- Structural VIX-conditioned sweep completed with status {s['status']}.\n"
                  f"- Declared strategies: {s['strategies_declared']}; observations: {s['trade_rows']}; development/validation/holdout: {s['development_rows']}/{s['validation_rows']}/{s['holdout_rows']}.\n"
                  f"- Frozen strategy×VIX candidates: {s['frozen_top10_count']}; frozen routers: {s['frozen_router_count']}.\n"
                  f"- Stage 5: {s['stage5']}; decision: {s['decision']}.\n"
              )
          PY

      - name: Persist accepted artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase43_vix PHASE43_STATUS.md RESEARCH_LOG.md
          git commit -m "phase43: persist VIX strategy sweep results" || true
          git push origin "HEAD:\${GITHUB_HEAD_REF:-\${GITHUB_REF_NAME}}"
