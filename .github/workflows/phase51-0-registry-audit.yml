name: Phase 51-0 - Registry and Data Audit
on:
  workflow_dispatch:
  push:
    branches: [phase-51-execution-oos-validation]
    paths:
      - trigger/phase51_0.start
      - PHASE51_RESEARCH_PLAN.md
      - research/phase51_cost_spec.py
      - research/phase51_data_manifest.py
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify frozen candidate registry
        run: |
          set -euo pipefail
          grep -q "TT-03" PHASE51_RESEARCH_PLAN.md
          grep -q "TT-03 OTM350" PHASE51_RESEARCH_PLAN.md
          grep -q "No new strike" PHASE51_RESEARCH_PLAN.md
      - name: Record registry checkpoint
        run: |
          printf '\nPhase 51-0 registry audit passed in GitHub Actions.\n' >> PHASE51_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE51_STATUS.md
          git commit -m "Phase 51-0: record registry audit"
          git fetch origin phase-51-execution-oos-validation
          git rebase origin/phase-51-execution-oos-validation
          git push origin HEAD:phase-51-execution-oos-validation
