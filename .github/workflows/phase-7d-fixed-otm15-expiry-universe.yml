name: Phase 7D Fixed OTM15 Expiry Universe Corrected

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_PHASE7D]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-fixed-otm15-v3-v1
          restore-keys: |
            hf-nifty-options-fixed-otm15-v3-
            hf-nifty-options-
      - name: Run corrected fixed OTM15 primary
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OUT_DIR: results/fixed_otm15_v3/phase7d
          START_DATE: 2021-05-27
          END_DATE: 2026-09-30
          ENTRY_HOUR: 10
          ENTRY_MINUTE: 0
          DTE_SESSIONS: 4
          SLIPPAGE_TICKS: 1
          BROKERAGE_PER_ORDER: 10
          TARGET_FRACTION: 0.90
          NIFTY_STRIKE_INTERVAL: 50
        run: python research/backtest_fixed_otm15.py
      - name: Persist corrected PnL primary result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/fixed_otm15_v3/phase7c
          git commit -m 'Phase 7D: persist expiry-universe corrected primary result' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
