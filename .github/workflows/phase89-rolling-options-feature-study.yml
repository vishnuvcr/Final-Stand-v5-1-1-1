name: Phase 89 — Dhan rolling-options feature study

on:
  push:
    branches:
      - phase-89-rolling-options-feature-study
    paths:
      - ".github/workflows/phase89-rolling-options-feature-study.yml"
      - "research/phase89/**"
      - "PHASE89_RESEARCH_PLAN.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase89-rolling-feature-study
  cancel-in-progress: false

jobs:
  feature-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the preregistered branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "pandas==2.2.3" "statsmodels==0.14.5"

      - name: Restore or create private runner cache for historical response payloads
        uses: actions/cache@v4
        with:
          path: .cache/phase89/raw
          key: phase89-dhan-rolling-2025-v1

      - name: Acquire and analyze registered 2025 sample
        id: study
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python research/phase89/rolling_feature_study.py

      - name: Commit aggregate results and phase logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE89_STATUS.md PHASE89_ERROR_LOG.md PHASE89_CHAT_LOG.md README.md
          git add -f results/phase89/coverage.csv results/phase89/daily_coverage.csv results/phase89/split_tests.csv results/phase89/primary_tests.csv results/phase89/summary.json results/phase89/PHASE89_RESULTS.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Phase 89: publish rolling-options feature study results"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No aggregate documentation/result changes to commit."
          fi

      - name: Preserve failed scientific/operational run status
        if: steps.study.outcome == 'failure'
        run: |
          echo "Phase 89 acquisition/analysis script returned nonzero. See committed Phase 89 status and error log."
          exit 1
