name: Phase 72 — DhanHQ target-date data-integrity audit

on:
  workflow_dispatch:
  push:
    branches:
      - phase-72-dhan-data-integrity-audit
    paths:
      - "scripts/phase72_dhan_integrity_audit.py"
      - ".github/workflows/phase72-dhan-data-integrity-audit.yml"

permissions:
  contents: write

jobs:
  bounded-integrity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run aggregate-only integrity audit
        run: python3 scripts/phase72_dhan_integrity_audit.py
      - name: Publish aggregate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase72_dhan_integrity_audit/summary.json results/phase72_dhan_integrity_audit/report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Record Phase 72 DhanHQ integrity audit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
