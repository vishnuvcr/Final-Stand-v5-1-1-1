name: Phase 52 — Point-in-Time Delta Audit
# PA-012: IV/delta selection uses exact prior-minute closes; entry open is checked separately. Old same-bar audit not accepted.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-52-delta-selection-audit.yml"
  schedule:
    - cron: "45 3 * * *"
permissions:
  contents: write
concurrency:
  group: phase52-factor-conditioned-strategy-discovery
  cancel-in-progress: false
jobs:
  delta-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-52-factor-conditioned-strategy-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyarrow huggingface_hub
      - name: Run PA-012 prior-bar delta regression and audit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p results/phase52/delta_selection_audit
          python research/phase52/delta_selection_audit.py --self-test
          python research/phase52/delta_selection_audit.py
      - name: Persist delta audit outputs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase52/delta_selection_audit || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase52 point-in-time delta audit run $GITHUB_RUN_ID"
          git fetch origin phase-52-factor-conditioned-strategy-discovery
          git rebase origin/phase-52-factor-conditioned-strategy-discovery
          git push origin HEAD:phase-52-factor-conditioned-strategy-discovery
