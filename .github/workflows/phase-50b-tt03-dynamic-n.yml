name: Phase 50B - TT03 Dynamic-n Replay

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - trigger/phase50b_tt03.start

concurrency:
  group: phase50b-tt03-replay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preflight dependencies
        run: python -m pip install --no-input numpy pandas pyarrow matplotlib scipy huggingface_hub
      - name: Verify TT02 evidence gate
        run: |
          set -euo pipefail
          test -s results/phase50b/tt02_calendar_replay/summary.json
          test -s results/phase50b/tt02_calendar_replay/tt02_trades.csv
          test -f results/phase50b/tt02_calendar_replay/data_errors.csv
          test -f results/phase50b/tt02_calendar_replay/coverage_gaps.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt02_calendar_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt02_calendar_replay/tt02_trades.csv")
          er=pd.read_csv("results/phase50b/tt02_calendar_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt02_calendar_replay/coverage_gaps.csv")
          assert d["engine_revision"]=="50B-TT02-COVERAGE-V3", d
          assert d["trades"]==len(tr) and d["trades"]>0, d
          assert d["candidate_trades"]==len(tr)+len(cg), d
          assert d["coverage_rate"]>=0.95, d
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          assert len(er)==0, er.head()
          print("TT02 dependency gate PASS", d)
          PY

  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh branch for source-of-truth
        run: |
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow matplotlib scipy huggingface_hub
      - name: Compile TT03 replay
        run: python -m py_compile research/phase50b_tt03_dynamic_n_replay.py
      - name: Static TT03 engine-contract audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("research/phase50b_tt03_dynamic_n_replay.py")
          tree=ast.parse(p.read_text())
          names={n.targets[0].id for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name)}
          assert "TT03_ENGINE_REV" in names
          assert "50B-TT03-WINDOW-V5" in p.read_text()
          print("TT03 engine contract PASS")
          PY
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt03-hf-${{ runner.os }}-${{ hashFiles('research/phase50b_tt03_dynamic_n_replay.py') }}
          restore-keys: |
            phase50b-tt03-hf-${{ runner.os }}-
      - name: Run TT03 replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase50b_tt03_dynamic_n_replay.py

      - name: Persist TT03 terminal classification
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s results/phase50b/tt03_dynamic_n_replay/summary.json
          test -f results/phase50b/tt03_dynamic_n_replay/tt03_trades.csv
          test -f results/phase50b/tt03_dynamic_n_replay/data_errors.csv
          test -f results/phase50b/tt03_dynamic_n_replay/coverage_gaps.csv
          test -f results/phase50b/tt03_dynamic_n_replay/session_exclusions.csv
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          src=Path("results/phase50b/tt03_dynamic_n_replay")
          d=json.loads((src/"summary.json").read_text())
          tr=pd.read_csv(src/"tt03_trades.csv")
          er=pd.read_csv(src/"data_errors.csv")
          cg=pd.read_csv(src/"coverage_gaps.csv")
          sx=pd.read_csv(src/"session_exclusions.csv")

          structural_ok=(
              d.get("engine_revision")=="50B-TT03-WINDOW-V5" and
              d.get("trades")==len(tr) and
              d.get("candidate_trades")==len(tr)+len(cg) and
              {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          )
          data_errors=len(er)
          coverage=float(d.get("coverage_rate",0.0))
          if not structural_ok or data_errors>0:
              state="INVALID_ENGINE"
          elif coverage>=0.95:
              state="PASS"
          else:
              state="FAIL_COVERAGE"

          promotion_eligible=(state=="PASS")
          decision={
              "strategy":"TT-03",
              "run_id":int("${{ github.run_id }}"),
              "engine_revision":d.get("engine_revision"),
              "status":state,
              "promotion_eligible":promotion_eligible,
              "coverage_rate":coverage,
              "coverage_threshold":0.95,
              "trades":int(d.get("trades",len(tr))),
              "candidate_trades":int(d.get("candidate_trades",len(tr)+len(cg))),
              "coverage_exclusions":int(d.get("coverage_exclusions",len(cg))),
              "session_exclusions":int(d.get("session_exclusions",len(sx))),
              "data_errors":data_errors,
              "uses_pnl_as_evidence":promotion_eligible,
              "next_strategy_may_proceed":True,
              "reason":{
                  "PASS":"source-faithful baseline passed execution feasibility",
                  "FAIL_COVERAGE":"coverage below preregistered 95% feasibility threshold",
                  "INVALID_ENGINE":"source-faithful replay produced structural/data errors; P&L is not evidence"
              }[state]
          }

          (src/"terminal_decision.json").write_text(json.dumps(decision,indent=2))

          dst=Path("results/phase50b/tt03_feasibility")
          dst.mkdir(parents=True,exist_ok=True)
          feasibility={
              "strategy":"TT-03",
              "run_id":decision["run_id"],
              "diagnostic_only":not promotion_eligible,
              "feasibility_state":state,
              "engine_revision":decision["engine_revision"],
              "trades":decision["trades"],
              "candidate_trades":decision["candidate_trades"],
              "coverage_exclusions":decision["coverage_exclusions"],
              "coverage_rate":coverage,
              "net":float(d.get("net",0.0)),
              "net50":float(d.get("net50",0.0)),
              "net20":float(d.get("net20",0.0)),
              "net20_50":float(d.get("net20_50",0.0)),
              "data_errors":data_errors,
              "session_exclusions":decision["session_exclusions"],
              "uses_pnl_as_evidence":promotion_eligible,
              "next_strategy_may_proceed":True,
              "terminal_decision":decision
          }
          (dst/"feasibility.json").write_text(json.dumps(feasibility,indent=2))

          print(json.dumps(decision,indent=2))
          print(json.dumps(feasibility,indent=2))
          PY

          rm -rf results/phase50b/tt03_feasibility/replay
          cp -R results/phase50b/tt03_dynamic_n_replay results/phase50b/tt03_feasibility/replay

          tmp=$(mktemp -d)
          cp -R results/phase50b/tt03_dynamic_n_replay "$tmp/"
          cp -R results/phase50b/tt03_feasibility "$tmp/"
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          rm -rf results/phase50b/tt03_dynamic_n_replay results/phase50b/tt03_feasibility
          mkdir -p results/phase50b
          cp -R "$tmp/tt03_dynamic_n_replay" results/phase50b/
          cp -R "$tmp/tt03_feasibility" results/phase50b/
          git add results/phase50b/tt03_dynamic_n_replay results/phase50b/tt03_feasibility
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: publish TT03 replay and terminal feasibility"
          git push origin HEAD:phase-50b-expanded-strategy-universe

      - name: Upload TT03 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-tt03-${{ github.run_id }}
          path: |
            results/phase50b/tt03_dynamic_n_replay
            results/phase50b/tt03_feasibility
          if-no-files-found: warn

      - name: Route downstream after TT03 terminal classification
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s results/phase50b/tt03_feasibility/feasibility.json
          python - <<'PY'
          import json
          d=json.load(open("results/phase50b/tt03_feasibility/feasibility.json"))
          assert int(d["run_id"]) == int("${{ github.run_id }}"), d
          assert d["engine_revision"]=="50B-TT03-WINDOW-V5", d
          assert d["feasibility_state"] in ("PASS","FAIL_COVERAGE","INVALID_ENGINE"), d
          assert d["next_strategy_may_proceed"] is True, d
          print("TT03 terminal classification permits independent TT04 continuation:",d["feasibility_state"])
          PY

          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          date -u +"%Y-%m-%dT%H:%M:%SZ" > trigger/phase50b_tt04.start
          git add trigger/phase50b_tt04.start
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: route TT04 after TT03 terminal classification"
          git push origin HEAD:phase-50b-expanded-strategy-universe
