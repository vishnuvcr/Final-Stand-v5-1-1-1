name: Phase 50B - TT04 Performance Fallback Replay

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - trigger/phase50b_tt04_fallback.start

concurrency:
  group: phase50b-tt04-replay-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow matplotlib scipy huggingface_hub
      - name: Compile TT04 fallback
        run: python -m py_compile research/phase50b_tt04_premium_match_replay_fast.py
      - name: Verify TT03 terminal feasibility gate
        run: |
          set -euo pipefail
          test -s results/phase50b/tt03_feasibility/feasibility.json
          python - <<'PY'
          import json
          d=json.load(open("results/phase50b/tt03_feasibility/feasibility.json"))
          assert d["engine_revision"]=="50B-TT03-WINDOW-V5", d
          assert d["feasibility_state"] in ("PASS","FAIL_COVERAGE","INVALID_ENGINE"), d
          assert d["next_strategy_may_proceed"] is True, d
          if d["feasibility_state"]=="PASS":
              assert d["coverage_rate"]>=0.95 and d["data_errors"]==0, d
              assert d.get("promotion_eligible", d.get("uses_pnl_as_evidence",False)), d
          else:
              assert d["diagnostic_only"] is True and d["uses_pnl_as_evidence"] is False, d
          print("TT03 terminal gate permits independent TT04 continuation.", d)
          PY

  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Compile TT04 fallback
        run: python -m py_compile research/phase50b_tt04_premium_match_replay_fast.py
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt04-hf-fallback-${{ runner.os }}-${{ hashFiles('research/phase50b_tt04_premium_match_replay_fast.py') }}
          restore-keys: |
            phase50b-tt04-hf-fallback-${{ runner.os }}-
            phase50b-tt04-hf-${{ runner.os }}-
      - name: Run TT04 performance fallback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase50b_tt04_premium_match_replay_fast.py
      - name: Audit TT04 fallback artifacts
        run: |
          set -euo pipefail
          test -s results/phase50b/tt04_premium_match_replay/summary.json
          test -s results/phase50b/tt04_premium_match_replay/tt04_trades.csv
          test -f results/phase50b/tt04_premium_match_replay/data_errors.csv
          test -f results/phase50b/tt04_premium_match_replay/coverage_gaps.csv
          test -f results/phase50b/tt04_premium_match_replay/session_exclusions.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt04_premium_match_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt04_premium_match_replay/tt04_trades.csv")
          er=pd.read_csv("results/phase50b/tt04_premium_match_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt04_premium_match_replay/coverage_gaps.csv")
          sx=pd.read_csv("results/phase50b/tt04_premium_match_replay/session_exclusions.csv")
          assert d["engine_revision"]=="50B-TT04-COVERAGE-V3-FAST-DORMANT", d
          assert d["trades"]==len(tr), d
          assert d.get("candidate_trades",len(tr))==len(tr)+len(cg), d
          assert d.get("coverage_rate",1.0)>=0.95, d
          assert d.get("session_exclusions",0)==len(sx), d
          assert len(er)==0, er.head()
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns) if len(tr) else True
          print("TT04 fallback artifact audit PASS", d)
          PY
      - name: Upload TT04 fallback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-tt04-fallback-${{ github.run_id }}
          path: results/phase50b/tt04_premium_match_replay
      - name: Publish TT04 fallback results safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R results/phase50b/tt04_premium_match_replay "$tmp/"
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          rm -rf results/phase50b/tt04_premium_match_replay
          mkdir -p results/phase50b
          cp -R "$tmp/tt04_premium_match_replay" results/phase50b/
          git add results/phase50b/tt04_premium_match_replay
          if git diff --cached --quiet; then
            echo "No TT04 fallback result changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: publish TT04 fallback replay"
            git push origin HEAD:phase-50b-expanded-strategy-universe
          fi
      - name: Trigger TT05 only after fallback evidence passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          date -u +"%Y-%m-%dT%H:%M:%SZ" > trigger/phase50b_tt05.start
          git add trigger/phase50b_tt05.start
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: trigger TT05 after TT04 fallback audit"
          git push origin HEAD:phase-50b-expanded-strategy-universe
