name: Phase 9F Fee-Audited Robustness

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_PHASE9F]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-fee-audited-v1
          restore-keys: |
            hf-nifty-options-fixed-otm15-corrected-v1
            hf-nifty-options-fixed-otm15-v3-v1
            hf-nifty-options-
      - name: Run fee-audited robustness suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START_DATE: 2021-05-27
          END_DATE: 2026-09-30
          NIFTY_STRIKE_INTERVAL: 50
        run: python research/robustness_fixed_otm15.py
      - name: Persist fee-audited robustness results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/fixed_otm15_v3/phase9
          git commit -m 'Phase 9F: persist fee-audited robustness results' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
