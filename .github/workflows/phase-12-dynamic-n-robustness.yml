name: Phase 12 Dynamic N Robustness

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_DYNAMIC_ROBUSTNESS]')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-dynamic-n-corrected-v1
          restore-keys: |
            hf-nifty-options-fixed-otm15-fee-audited-v1
            hf-nifty-options-fixed-otm15-corrected-v1
            hf-nifty-options-
      - name: Run dynamic-n robustness
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/robustness_dynamic_n.py
      - name: Persist robustness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/dynamic_n_corrected/phase12_robustness
          git commit -m 'Phase 12: persist dynamic-n robustness' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
