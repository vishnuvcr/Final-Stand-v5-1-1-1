name: Phase 79 — HF current-revision recheck
on:
  workflow_dispatch:
  push:
    branches: [phase-79-hf-current-revision-recheck]
    paths:
      - 'scripts/phase79_hf_current_revision_recheck.py'
      - '.github/workflows/phase79-hf-current-revision-recheck.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-79-hf-current-revision-recheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub
      - name: Audit current dataset revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/phase79_hf_current_revision_recheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase79-hf-current-revision-aggregate-only
          path: results/phase79_hf_current_revision/
          if-no-files-found: error
      - name: Persist aggregate report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase79_hf_current_revision/
          if ! git diff --cached --quiet; then
            git commit -m 'Record Phase 79 current-revision data coverage audit'
            git pull --rebase origin phase-79-hf-current-revision-recheck
            git push origin HEAD:phase-79-hf-current-revision-recheck
          fi
