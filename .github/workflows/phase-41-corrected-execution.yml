name: Phase 41 - Corrected Execution

on:
  push:
    branches:
      - phase-41-corrected-execution
    paths:
      - 'PHASE41_TRIGGER.md'
      - 'research/phase41_*.py'
      - 'PHASE41_*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase41-corrected-execution-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-41-corrected-execution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase41-corrected-hf-${{ runner.os }}-${{ hashFiles('research/phase41_*.py') }}
          restore-keys: |
            phase41-corrected-hf-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pandas pyarrow scikit-learn matplotlib huggingface_hub requests
      - name: Preflight
        run: |
          test -f results/phase39_counterfactual/fixed_opportunity_ledger.csv
          test -f results/phase39_features/point_in_time_features.csv
          test -f data/phase40_vix/india_vix.csv
          python - <<'PY'
          import pandas as pd
          z=pd.read_csv('results/phase39_counterfactual/fixed_opportunity_ledger.csv')
          assert len(z)==477
          print("preflight PASS")
          PY
      - name: Step 1 - fixed opportunity screen
        run: python research/phase41_regime_policy_screen.py
      - name: Step 2 - identity-safe sequential replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase41_sequential_replay.py
      - name: Step 3 - final inference and manuscript
        run: python research/phase41_finalize.py
      - name: Persist all artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE41_STATUS.md PHASE41_MANUSCRIPT.md RESEARCH_LOG.md ERROR_LOG.md results/phase41_regime_policy
          git commit -m 'Phase 41: persist corrected execution and final closeout' || true
          git push origin HEAD:phase-41-corrected-execution
