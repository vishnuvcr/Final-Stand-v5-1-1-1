name: Phase 67 — Contract Coverage Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [phase-67-contract-coverage-diagnostic]
    paths:
      - "research/phase67_contract_coverage.py"
      - "tests/test_phase67_contract_coverage.py"
      - ".github/workflows/phase67-contract-coverage-diagnostic.yml"
permissions:
  contents: write
concurrency:
  group: phase67-contract-coverage
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install pandas pyarrow huggingface_hub pytest
      - name: Tests
        run: python -m pytest -q tests/test_phase67_contract_coverage.py
      - name: Run bounded trigger-window audit
        run: python research/phase67_contract_coverage.py
      - name: Validate output files
        run: |
          test -s results/phase67_contract_coverage/summary.json
          test -s results/phase67_contract_coverage/event_diagnostics.csv
          test -s results/phase67_contract_coverage/schema_audit.json
          test -s results/phase67_contract_coverage/report.md
      - name: Commit derived audit and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase67_contract_coverage PHASE67_STATUS.md PHASE67_RESEARCH_LOG.md PHASE67_ERROR_LOG.md PHASE67_CHAT_LOG.md README.md
          git diff --cached --quiet || git commit -m "Phase 67: publish contract coverage diagnostics"
          git push
