name: Build final research manuscript and figures

# Final package build trigger

on:
  push:
    branches:
      - phase-24-targeted-reversal-trigger
    paths:
      - "research/build_final_manuscript.py"
      - "results/dynamic_n_corrected/phase23_entry_state/*.csv"
      - "results/dynamic_n_corrected/phase24_targeted_reversal/*.csv"
      - ".github/workflows/build-final-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-24-targeted-reversal-trigger
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib
      - name: Compile
        run: python -m py_compile research/build_final_manuscript.py
      - name: Build manuscript
        run: python research/build_final_manuscript.py
      - name: Persist manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/FINAL_RESEARCH_MANUSCRIPT.md manuscript/figures
          git commit -m "Build final research manuscript and figures" || true
          git pull --rebase origin phase-24-targeted-reversal-trigger
          git push origin HEAD:phase-24-targeted-reversal-trigger
