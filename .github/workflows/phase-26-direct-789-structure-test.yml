name: Phase 26 direct OTM7-8-9 structure test

on:
  push:
    branches:
      - phase-26-direct-789-structure-test
    paths:
      - "research/backtest_dynamic_n_corrected.py"
      - "PHASE26_PRE_REGISTRATION.md"
      - ".github/workflows/phase-26-direct-789-structure-test.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  phase26:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-26-direct-789-structure-test
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-${{ runner.os }}-v1
          restore-keys: |
            hf-nifty-options-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub
      - name: Compile
        run: python -m py_compile research/backtest_dynamic_n_corrected.py
      - name: Run fixed n=7
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          N_SELECTION_MODE: fixed7
          OUT_DIR: results/dynamic_n_corrected/phase26_fixed789
        run: python research/backtest_dynamic_n_corrected.py
      - name: Persist Phase 26 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin phase-26-direct-789-structure-test
          git rebase origin/phase-26-direct-789-structure-test
          git add results/dynamic_n_corrected/phase26_fixed789
          git commit -m "Phase 26: persist fixed OTM7-8-9 results" || exit 0
          git push origin HEAD:phase-26-direct-789-structure-test
