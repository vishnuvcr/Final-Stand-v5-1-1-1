name: Research runner bootstrap
on:
  push:
    branches: [phase-1-strategy-definition]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow huggingface_hub
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-phase2-v1
      - name: Run phase 2 backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START_DATE: '2024-01-01'
          END_DATE: '2026-09-30'
        run: python research/backtest_otm_ratio.py
      - name: Persist results to phase branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results || true
          git commit -m 'Phase 2: update backtest results' || echo 'No result changes'
          git push origin HEAD:${{ github.ref_name }}
