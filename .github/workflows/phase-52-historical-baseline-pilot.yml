name: Phase 52 — Bounded Historical BASELINE Pilot (revision-fingerprinted rerun)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-52-historical-baseline-pilot.yml"

permissions:
  contents: write

concurrency:
  group: phase52-factor-conditioned-strategy-discovery
  cancel-in-progress: false

jobs:
  historical-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PHASE_BRANCH: phase-52-factor-conditioned-strategy-discovery
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout frozen Phase52 research branch
        uses: actions/checkout@v4
        with:
          ref: phase-52-factor-conditioned-strategy-discovery
          fetch-depth: 0

      - name: Checkout main README for automated status persistence
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-docs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pinned market-data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase52-market-data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            phase52-market-data-cache-${{ runner.os }}-
            phase52-hf-cache-${{ runner.os }}-

      - name: Install bounded pilot dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pandas pyarrow huggingface_hub matplotlib

      - name: Test config enumeration and event sample without market downloads
        id: self_test
        run: python research/phase52/historical_pilot_runner.py --self-test-only

      - name: Freeze exact config IDs and deterministic event sample before P&L
        id: plan
        run: python research/phase52/historical_pilot_runner.py --plan-only

      - name: Run bounded historical BASELINE replay
        id: replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase52/historical_pilot_runner.py --run

      - name: Upload full pilot output and exclusion ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase52-historical-baseline-pilot-${{ github.run_id }}
          path: results/phase52/historical_pilot/
          if-no-files-found: warn
          retention-days: 60

      - name: Save market-data cache even if a later gate fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase52-market-data-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Persist run outcome, status, errors, branch and both READMEs
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SELF_TEST_OUTCOME: ${{ steps.self_test.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/phase52/persist_historical_pilot.py
