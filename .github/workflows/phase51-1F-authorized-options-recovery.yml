name: Phase 51-1F Authorized Options Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - "research/phase51_1F_upstox_fullchain_acquisition.py"
      - ".github/workflows/phase51-1F-authorized-options-recovery.yml"

jobs:
  upstox-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache authenticated options acquisition
        uses: actions/cache@v4
        with:
          path: data/phase51/upstox_1f
          key: phase51-1F-upstox-${{ runner.os }}-${{ hashFiles('research/phase51_1F_upstox_fullchain_acquisition.py') }}
          restore-keys: |
            phase51-1F-upstox-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -U requests pandas pyarrow
      - name: Run authorized Upstox acquisition gate
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python research/phase51_1F_upstox_fullchain_acquisition.py
      - name: Upload acquisition audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-1F-upstox-recovery
          path: results/phase51/upstox_1f/
