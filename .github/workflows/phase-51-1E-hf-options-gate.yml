# Phase 51-1E: frozen-gap options validation; fail closed before OOS P&L.
name: Phase 51-1E HF Options Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "research/phase51_1_options_augmentation.py"
      - ".github/workflows/phase-51-1E-hf-options-gate.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Hugging Face dataset objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase51-1E-hf-${{ runner.os }}-${{ hashFiles('research/phase51_1_options_augmentation.py') }}
          restore-keys: |
            phase51-1E-hf-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -U pandas pyarrow huggingface_hub
      - name: Download and validate frozen-gap options
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/phase51_1_options_augmentation.py
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-1E-hf-options-gate
          path: |
            results/phase51/options_augmentation_audit.json
            results/phase51/validated_option_source.json
