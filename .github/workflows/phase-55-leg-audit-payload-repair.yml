name: Phase 55 — Repair and Rerun Frozen Historical Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - phase-55-leg-audit-payload-repair
    paths:
      - ".github/workflows/phase-55-leg-audit-payload-repair.yml"
      - "research/phase52/historical_pilot_runner.py"
      - "research/phase52/strategy_template_resolver.py"
      - "research/phase52/tests/test_historical_pilot_leg_audit.py"

permissions:
  contents: write

concurrency:
  group: phase55-frozen-pilot-rerun
  cancel-in-progress: false

jobs:
  audit-and-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PHASE_BRANCH: phase-55-leg-audit-payload-repair
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout Phase 55 branch
        uses: actions/checkout@v4
        with:
          ref: phase-55-leg-audit-payload-repair
          fetch-depth: 0
      - name: Refresh latest branch tip before work
        run: |
          git fetch origin "$PHASE_BRANCH"
          git checkout "$PHASE_BRANCH"
          git reset --hard "origin/$PHASE_BRANCH"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned-pilot dependencies
        run: python -m pip install --disable-pip-version-check --no-input pandas numpy pyarrow huggingface_hub scipy matplotlib requests
      - name: Restore pinned Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase55-hf-0f4800e43e6f96cec0794369d78eb4d3c4211ef5
          restore-keys: |
            phase55-hf-0f4800e43e6f96cec0794369d78eb4d3c4211ef5
      - name: Syntax validation
        run: python -m py_compile research/phase52/historical_pilot_runner.py
      - name: Regression tests
        run: python -m unittest research.phase52.tests.test_historical_pilot_leg_audit -v
      - name: Runner deterministic self-test
        run: python research/phase52/historical_pilot_runner.py --self-test-only
      - name: Freeze updated audit-code manifest without changing research design
        run: |
          set -euo pipefail
          manifest=results/phase52/historical_pilot/pilot_manifest.json
          archived=results/phase52/historical_pilot/pilot_manifest.phase52-v0.2.1-original.json
          if [ -f "$manifest" ] && [ ! -f "$archived" ]; then cp "$manifest" "$archived"; fi
          python research/phase52/historical_pilot_runner.py --plan-only
      - name: Clear stale generated outputs
        run: rm -f results/phase52/historical_pilot/event_replay.csv results/phase52/historical_pilot/cost_scenarios.csv results/phase52/historical_pilot/report.json
      - name: Rerun frozen 480-row pilot at pinned source revision
        run: python research/phase52/historical_pilot_runner.py --run
      - name: Audit persisted row and leg coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path("results/phase52/historical_pilot")
          report = json.loads((p / "report.json").read_text())
          with (p / "event_replay.csv").open(newline="", encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == 480, f"expected 480 rows, got {len(rows)}"
          counts = {}
          expected = {"BUY_CALL":1,"BUY_PUT":1,"BULL_CALL_SPREAD":2,"BEAR_CALL_SPREAD":2,
                      "SHORT_IRON_CONDOR":4,"LONG_STRADDLE":2,"LONG_STRANGLE":2}
          leg_statuses = {"EXCLUDED_ENTRY_LEG","EXCLUDED_PRIOR_OI","EXCLUDED_OHLC_RANGE_PROXY",
                          "EXCLUDED_EXIT_LEG","EXCLUDED_NO_COMMON_EXIT","BLOCKED_LEG_ELIGIBILITY","REPLAY_PASS"}
          for row in rows:
              counts[row["status"]] = counts.get(row["status"], 0) + 1
              if row["status"] in leg_statuses:
                  legs = json.loads(row["resolved_legs_json"])
                  want = expected[row["family_id"]]
                  assert len(legs) == want, (row["configuration_id"], row["event_id"], row["status"], len(legs), want)
                  ids = [x["leg_id"] for x in legs]
                  assert len(set(ids)) == want and all(ids)
                  assert all("entry_status" in x and "prior_oi_status" in x and
                             "range_proxy_status" in x and "exit_status" in x for x in legs)
          costs = list(csv.DictReader((p / "cost_scenarios.csv").open(newline="", encoding="utf-8")))
          passed = counts.get("REPLAY_PASS", 0)
          assert len(costs) == passed * 6, f"cost rows {len(costs)} != 6 * passes {passed}"
          assert report.get("dataset_revision") == "0f4800e43e6f96cec0794369d78eb4d3c4211ef5"
          (p / "phase55_audit.json").write_text(json.dumps({
              "status":"PASS", "rows":len(rows), "status_counts":counts,
              "leg_payload_rows_checked":sum(1 for r in rows if r["status"] in leg_statuses),
              "cost_rows":len(costs), "pinned_revision":report.get("dataset_revision"),
              "note":"Engineering audit only; no holdout or promotion."
          }, indent=2)+"\n")
          print(json.dumps({"rows":len(rows),"status_counts":counts,"cost_rows":len(costs)},indent=2))
          PY
      - name: Upload pilot and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase55-frozen-pilot-${{ github.run_id }}
          path: results/phase52/historical_pilot/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist phase status, logs and results
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ["GITHUB_RUN_ID"]
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://github.com/{repo}/actions/runs/{run_id}"
          status=os.environ.get("JOB_STATUS","unknown")
          p=Path("results/phase52/historical_pilot")
          report=None
          try:
              report=json.loads((p/"report.json").read_text())
          except Exception:
              pass
          audit=None
          try:
              audit=json.loads((p/"phase55_audit.json").read_text())
          except Exception:
              pass
          if report and audit and audit.get("status")=="PASS" and status=="success":
              summary=(f"- Run: [{run_id}]({url}); workflow status={status}; audit PASS.\n"
                       f"- Rows={audit['rows']}; status counts={json.dumps(audit['status_counts'],sort_keys=True)}.\n"
                       f"- Leg payload rows audited={audit['leg_payload_rows_checked']}; cost rows={audit['cost_rows']}; source revision={audit['pinned_revision']}.\n"
                       "- No holdout use, raw data committed, or strategy promotion.\n")
          else:
              summary=(f"- Run: [{run_id}]({url}); workflow status={status}; audit PASS={bool(audit and audit.get('status')=='PASS')}.\n"
                       "- Output is not accepted as complete unless the row/leg invariant audit passes.\n")
          for name,heading in [
              ("PHASE55_STATUS.md",f"## Automated checkpoint {run_id}"),
              ("PHASE55_RESEARCH_LOG.md",f"## Run {run_id}"),
              ("PHASE55_CHAT_LOG.md",f"## Automated run {run_id}")]:
              f=Path(name);f.write_text(f.read_text(encoding="utf-8").rstrip()+"\n\n"+heading+"\n\n"+summary,encoding="utf-8")
          if status!="success" or not audit or audit.get("status")!="PASS":
              f=Path("PHASE55_ERROR_LOG.md")
              f.write_text(f.read_text(encoding="utf-8").rstrip()+
                f"\n\n## F55-RUN-{run_id} — pilot or audit failure\n\n- Run: {url}\n- Job status: {status}\n- Report present: {report is not None}\n- Leg invariant audit: {audit.get('status') if audit else 'NOT AVAILABLE'}\n- No output accepted as a valid rerun.\n- Status: OPEN.\n",encoding="utf-8")
          readme=Path("README.md")
          readme.write_text(readme.read_text(encoding="utf-8").rstrip()+
            f"\n\n## Phase 55 leg-audit repair — run {run_id}\n\n"+summary+
            "- [Plan](PHASE55_RESEARCH_PLAN.md) · [Status](PHASE55_STATUS.md) · [Audit](results/phase52/historical_pilot/phase55_audit.json)\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE55_STATUS.md PHASE55_RESEARCH_LOG.md PHASE55_ERROR_LOG.md PHASE55_CHAT_LOG.md README.md results/phase52/historical_pilot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase55 frozen pilot audit checkpoint $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git fetch origin "$PHASE_BRANCH"
            if git rebase origin/"$PHASE_BRANCH"; then
              if git push origin "$PHASE_BRANCH"; then exit 0; fi
            else
              echo "Rebase conflict; refusing to overwrite source or research logs." >&2
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
