name: Phase 92 — automated synthetic-forward/OI predictor study

on:
  push:
    branches:
      - phase-92-synthetic-forward-oi-study-2022
    paths:
      - "PHASE92_RESEARCH_PLAN.md"
      - "research/phase92/**"
      - ".github/workflows/phase92-synthetic-forward-oi-2022.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase92-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predictor-study:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the frozen Phase 92 study branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: phase-92-synthetic-forward-oi-study-2022
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "pandas==2.2.3"

      - name: Restore or initialize isolated Phase 92 private data cache
        uses: actions/cache@v4
        with:
          path: .cache/phase92/raw
          key: phase92-dhan-rolling-2022-v1

      - name: Acquire and analyze frozen 2022 factor study
        id: study
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: phase-92-synthetic-forward-oi-study-2022
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python research/phase92/synthetic_forward_oi_study.py

      - name: Publish aggregate outputs, README checkpoint and logs to Phase 92 branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          git add PHASE92_STATUS.md PHASE92_ERROR_LOG.md PHASE92_CHAT_LOG.md README.md
          git add -f results/phase92/coverage.csv results/phase92/model_metrics.csv results/phase92/vix_regime_metrics.csv results/phase92/summary.json results/phase92/PHASE92_RESULTS.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Phase 92: publish synthetic-forward/OI predictor results"
            git push origin "HEAD:phase-92-synthetic-forward-oi-study-2022"
          else
            echo "No aggregate result or log changes to commit."
          fi

      - name: Mark engine/operational failure after publication
        if: steps.study.outcome == 'failure'
        run: |
          echo "Phase 92 engine failed; inspect committed status and sanitized error log."
          exit 1
