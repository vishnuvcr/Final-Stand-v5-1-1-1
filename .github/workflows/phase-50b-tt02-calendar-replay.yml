name: Phase 50B - TT02 Delta Calendar Replay

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - research/phase50b_tt02_calendar_replay_v2.py
      - PHASE50B_STATUS.md
      - PHASE50B_PRE_REGISTRATION.md
      - PHASE50B_RESEARCH_PLAN.md

concurrency:
  group: phase50b-tt02-replay-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Compile
        run: python -m py_compile research/phase50b_tt02_calendar_replay_v2.py
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt02-hf-${{ runner.os }}-${{ hashFiles('research/phase50b_tt02_calendar_replay_v2.py') }}
          restore-keys: |
            phase50b-tt02-hf-${{ runner.os }}-

  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt02-hf-${{ runner.os }}-${{ hashFiles('research/phase50b_tt02_calendar_replay_v2.py') }}
          restore-keys: |
            phase50b-tt02-hf-${{ runner.os }}-
      - name: Run corrected TT02 replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase50b_tt02_calendar_replay_v2.py
      - name: Upload TT02 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-tt02-${{ github.run_id }}
          path: results/phase50b/tt02_calendar_replay
          if-no-files-found: warn
      - name: Self audit
        run: |
          set -euo pipefail
          for f in results/phase50b/tt02_calendar_replay/tt02_trades.csv                    results/phase50b/tt02_calendar_replay/data_errors.csv                    results/phase50b/tt02_calendar_replay/summary.json; do
            test -s "$f"
          done
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          d=json.load(open("results/phase50b/tt02_calendar_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt02_calendar_replay/tt02_trades.csv")
          er=pd.read_csv("results/phase50b/tt02_calendar_replay/data_errors.csv")
          assert d["trades"] == len(tr)
          assert len(er) == 0, er.head()
          assert set(["entry_ts","expiry","net","net50","vix_state"]).issubset(tr.columns)
          print("TT02 artifact audit PASS", d)
          PY
      - name: Publish results safely
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R results/phase50b/tt02_calendar_replay "$tmp/"
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          rm -rf results/phase50b/tt02_calendar_replay
          mkdir -p results/phase50b
          cp -R "$tmp/tt02_calendar_replay" results/phase50b/
          git add results/phase50b/tt02_calendar_replay
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: publish TT02 delta-calendar replay"
            git push origin HEAD:phase-50b-expanded-strategy-universe
          fi
