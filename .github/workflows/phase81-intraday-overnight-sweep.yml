name: Phase 81 — Paired intraday and overnight option-structure sweep
on:
  workflow_dispatch:
  push:
    branches: [phase-81-intraday-overnight-structure-sweep]
    paths:
      - 'research/phase81_intraday_overnight_sweep.py'
      - 'PHASE81_*.md'
      - '.github/workflows/phase81-intraday-overnight-sweep.yml'
permissions:
  contents: write
concurrency:
  group: phase81-intraday-overnight
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-81-intraday-overnight-structure-sweep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache authorized research source files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase81-hf-options-revision-0f4800e43e6f96cec0794369d78eb4d3c4211ef5-v1
          restore-keys: |
            phase81-hf-options-revision-0f4800e43e6f96cec0794369d78eb4d3c4211ef5-
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow huggingface_hub
      - name: Execute preregistered DEV/VAL sweep only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HOME: ~/.cache/huggingface
        run: |
          set -euo pipefail
          python research/phase81_intraday_overnight_sweep.py 2>&1 | tee phase81_run.log
      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s results/phase81_intraday_overnight/summary.json
          test -s results/phase81_intraday_overnight/summary_by_split_variant_window.csv
          test -s results/phase81_intraday_overnight/paired_window_differences.csv
          test -s results/phase81_intraday_overnight/exclusions.csv
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase81-paired-intraday-overnight
          path: |
            results/phase81_intraday_overnight/
            phase81_run.log
          if-no-files-found: error
      - name: Update status and research log
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('results/phase81_intraday_overnight/summary.json').read_text())
          Path('PHASE81_STATUS.md').write_text(
            '# Phase 81 Status\nDate: 2026-10-10\nStatus: EXPLORATORY SWEEP COMPLETE — NO STRATEGY PROMOTION.\n\n'
            f"- [x] Frozen sweep completed on pinned dataset revision {s['source']['revision']}.\n"
            f"- [x] Expiry files loaded: {s['universe']['expiry_files_loaded']}; paired trade rows: {s['universe']['eligible_trade_rows']}; paired date×variant differences: {s['universe']['complete_paired_session_variant_count']}.\n"
            f"- [x] Exclusion records: {s['exclusions']['records']}; file errors: {s['exclusions']['file_errors']}.\n"
            '- [x] Development/validation summaries and two-tick stress generated. 2026 holdout remains sealed.\n'
            '- [x] Candidate promotion deferred to inferential/holdout phase; OHLC is not executable quote evidence.\n'
          )
          with open('RESEARCH_LOG.md','a',encoding='utf-8') as f:
            f.write(
              '\n\n## 2026-10-10 — Phase 81 paired intraday/overnight sweep\n'
              f"- Expiry files loaded: {s['universe']['expiry_files_loaded']}; paired trade rows: {s['universe']['eligible_trade_rows']}; complete date×variant pairs: {s['universe']['complete_paired_session_variant_count']}.\n"
              f"- Exclusions: {s['exclusions']['records']}; file/schema errors: {s['exclusions']['file_errors']}.\n"
              '- Registered structures/time windows only; 2026 holdout not scored. See results/phase81_intraday_overnight/report.md.\n'
              '- No strategy promoted; static OHLC-open model remains an execution proxy.\n'
            )
          PY
      - name: Log workflow failure
        if: failure()
        shell: bash
        run: |
          {
            echo
            echo "## E81-005 — Workflow failure"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Head SHA: ${GITHUB_SHA}"
            echo "- Failure detected in the registered sweep workflow. Inspect Actions logs and artifact availability; no success claim is permitted."
            echo "- Status: OPEN pending root-cause diagnosis."
          } >> PHASE81_ERROR_LOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE81_ERROR_LOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'Log Phase 81 workflow failure'
            git pull --rebase origin phase-81-intraday-overnight-structure-sweep
            git push origin HEAD:phase-81-intraday-overnight-structure-sweep
          fi
      - name: Persist aggregate research outputs
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase81_intraday_overnight/ PHASE81_STATUS.md RESEARCH_LOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Phase 81 paired holding-window sweep'
          git pull --rebase origin phase-81-intraday-overnight-structure-sweep
          git push origin HEAD:phase-81-intraday-overnight-structure-sweep
