name: Phase 29 individual-leg delta research

concurrency:
  group: phase28-individual-leg-delta
  cancel-in-progress: true

on:
  push:
    branches:
      - phase-29-delta-change-exit-research
    paths:
      - "research/phase29_delta_change_research.py"
      - "PHASE28_PRE_REGISTRATION.md"
      - ".github/workflows/phase-29-delta-change-exit-research.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  phase28:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-29-delta-change-exit-research
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-${{ runner.os }}-v1
          restore-keys: hf-nifty-options-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub
      - name: Compile
        run: python -m py_compile research/phase29_delta_change_research.py
      - name: Run Phase 29
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OUT_DIR: results/dynamic_n_corrected/phase29_delta_change_exit
        run: python research/phase29_delta_change_research.py
      - name: Persist Phase 29 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dynamic_n_corrected/phase29_delta_change_exit
          git commit -m "Phase 29: persist individual-leg delta results" || true
          git fetch origin phase-29-delta-change-exit-research
          git rebase origin/phase-29-delta-change-exit-research
          git push origin HEAD:phase-29-delta-change-exit-research
