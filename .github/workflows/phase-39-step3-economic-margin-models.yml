name: Phase 39 - Step 3 Economic Margin Models

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'PHASE39_MODELING_SPEC.md'
      - 'research/phase39_economic_margin_models.py'
      - 'results/phase39_features/point_in_time_features.csv'
      - 'results/phase39_counterfactual/fixed_opportunity_ledger.csv'
      - '.github/workflows/phase-39-step3-economic-margin-models.yml'
  workflow_dispatch:

concurrency:
  group: phase39-step3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  economic_margin_models:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-39-advanced-direction-models
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check --no-input pandas pyarrow numpy scipy scikit-learn
      - name: Run chronological fixed-opportunity model screen
        run: python research/phase39_economic_margin_models.py
      - name: Verify model screen
        run: |
          test -f results/phase39_model_screen/validation_screen.csv
          test -f results/phase39_model_screen/holdout_fixed_opportunity_screen.csv
          test -f results/phase39_model_screen/summary.json
          python - <<'PY'
          import json, pandas as pd
          s=json.load(open('results/phase39_model_screen/summary.json'))
          v=pd.read_csv('results/phase39_model_screen/validation_screen.csv')
          h=pd.read_csv('results/phase39_model_screen/holdout_fixed_opportunity_screen.csv')
          assert s['validation_rows']==172
          assert s['holdout_rows']==34
          assert len(v)==12
          assert len(h)==34
          assert s['holdout_promotable'] is False
          assert s['fixed_opportunity_only'] is True
          print(json.dumps(s,indent=2))
          print(v.to_string(index=False))
          PY
      - name: Persist Step 3 model evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_model_screen
          git commit -m 'Phase 39: persist economic-margin model screen' || true
          git pull --rebase origin phase-39-advanced-direction-models
          git push origin HEAD:phase-39-advanced-direction-models
