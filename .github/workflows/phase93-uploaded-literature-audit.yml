name: Phase 93 — uploaded literature audit

on:
  push:
    branches:
      - phase-93-uploaded-literature-audit
    paths:
      - "PHASE93_RESEARCH_PLAN.md"
      - "results/phase93/UPLOADED_LITERATURE_AUDIT.md"
      - "results/phase92/MANUSCRIPT_DRAFT.md"
      - "results/phase92/SUPPLEMENTARY_MATERIALS.md"
      - "research/phase93/**"
      - ".github/workflows/phase93-uploaded-literature-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase93-uploaded-literature-audit
  cancel-in-progress: false

jobs:
  literature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 93
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate 14 source mappings, citations and research boundaries
        id: validate
        run: python research/phase93/validate_literature_audit.py

      - name: Publish validation report (race-safe)
        if: always()
        env:
          PHASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions-bot@users.noreply.github.com"
          # Multiple audited-document commits may trigger close together. Rebase
          # is avoided because competing timestamped JSON reports can conflict;
          # instead, refresh to the latest branch and regenerate the report.
          for attempt in 1 2 3; do
            git fetch origin "${PHASE_BRANCH}"
            git reset --hard "origin/${PHASE_BRANCH}"
            python research/phase93/validate_literature_audit.py || true
            git add results/phase93/validation_report.json
            if git diff --cached --quiet; then
              echo "Validation report already current."
              exit 0
            fi
            git commit -m "Phase 93: publish uploaded-literature audit validation"
            if git push origin "HEAD:${PHASE_BRANCH}"; then
              exit 0
            fi
            echo "Branch advanced during publication; retrying (attempt ${attempt}/3)."
          done
          echo "Unable to publish validation report after three attempts."
          exit 1

      - name: Mark audit failure after publishing diagnostics
        if: always() && steps.validate.outcome == 'failure'
        run: |
          echo "Phase 93 audit validation failed; inspect validation_report.json."
          exit 1
