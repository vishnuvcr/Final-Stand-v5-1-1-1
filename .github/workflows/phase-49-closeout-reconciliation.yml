name: Phase 49 - Automatic Closeout Reconciliation

on:
  workflow_run:
    workflows:
      - "Phase 49 - VIX Leader Parameter Tuning"
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: phase49-closeout
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.workflow_run.head_branch == 'phase-49-vix-leader-parameter-tuning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Locate source artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100
            });
            const target = data.artifacts.find(a => a.name === `phase49-raw-${runId}`);
            core.setOutput('artifact_id', target ? String(target.id) : '');
            core.setOutput('digest', target ? String(target.digest || '') : '');
            core.setOutput('found', target ? 'true' : 'false');

      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: phase-49-vix-leader-parameter-tuning
          fetch-depth: 0

      - name: Stop cleanly when no numerical artifact exists
        if: steps.artifact.outputs.found != 'true'
        run: echo "No Phase 49 raw artifact exists for this workflow run; numerical work did not reach artifact publication."

      - name: Download source artifact
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: phase49-raw-${{ github.event.workflow_run.id }}
          path: results/phase49_vix_tuning
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Install dependencies
        if: steps.artifact.outputs.found == 'true'
        run: python -m pip install --no-input numpy pandas matplotlib

      - name: Run independent reconciliation
        if: steps.artifact.outputs.found == 'true'
        env:
          PHASE49_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PHASE49_SOURCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PHASE49_SOURCE_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: python research/phase49_reconcile.py

      - name: Update status and research log
        if: steps.artifact.outputs.found == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          decision=json.load(open('results/phase49_vix_tuning/phase49_final_decision.json'))
          status=[
            '# Phase 49 Status — VIX Leader Parameter Tuning',
            '',
            f"**{decision['status']} — AUTOMATIC CLOSEOUT RECONCILIATION PASSED**",
            '',
            f"Source numerical run: {decision['source_run_id']}",
            f"Raw geometries: {decision['raw_geometries']}",
            f"Regime-expanded candidates: {decision['regime_expanded_candidates']}",
            f"Frozen candidates: {decision['frozen_candidates']}",
            f"Validation economic passes: {decision['validation_economic_passes']}",
            f"Holm survivors: {decision['holm_survivors']}",
            f"Holdout confirmations: {decision['holdout_confirmations']}",
            '',
            'No numerical values were changed during reconciliation. The reconciliation regenerated the structured manuscript and figures from the persisted evidence.',
            '',
            'Promotion: NO PROMOTION. The canonical strategy remains unchanged unless the final decision artifact explicitly states otherwise.',
          ]
          Path('PHASE49_STATUS.md').write_text('\n'.join(status)+'\n',encoding='utf-8')
          with open('RESEARCH_LOG.md','a',encoding='utf-8') as f:
            f.write(
              f"\n\n## Phase 49 automatic closeout — source run {decision['source_run_id']}\n"
              f"- Status={decision['status']}; frozen={decision['frozen_candidates']}; validation economic passes={decision['validation_economic_passes']}; Holm survivors={decision['holm_survivors']}; holdout confirmations={decision['holdout_confirmations']}.\n"
              '- Reconciliation was independent of numerical generation and did not modify trade P&L values.\n'
            )
          PY

      - name: Commit reconciled evidence
        if: steps.artifact.outputs.found == 'true'
        env:
          BRANCH: phase-49-vix-leader-parameter-tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git add results/phase49_vix_tuning PHASE49_STATUS.md RESEARCH_LOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'phase49: automatic closeout reconciliation'
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Upload reconciled package
        if: steps.artifact.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase49-reconciled-${{ github.event.workflow_run.id }}
          path: results/phase49_vix_tuning
          if-no-files-found: error
