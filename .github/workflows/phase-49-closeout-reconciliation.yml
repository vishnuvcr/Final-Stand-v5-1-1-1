name: Phase 49 - Automatic Closeout Reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - phase-49-vix-leader-parameter-tuning
    paths:
      - trigger/phase49.closeout

permissions:
  actions: read
  contents: write

concurrency:
  group: phase49-closeout
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Locate latest Phase 49 raw artifact
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'phase-49-vix-leader-parameter-tuning';
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, branch, per_page: 100
            });
            const candidates = runs
              .filter(r => r.name === 'Phase 49 - VIX Leader Parameter Tuning' && r.status === 'completed')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            let chosen = null;
            for (const run of candidates) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
              const artifact = data.artifacts.find(a => a.name === `phase49-raw-${run.id}` && !a.expired);
              if (artifact) { chosen = { run, artifact }; break; }
            }
            core.setOutput('found', chosen ? 'true' : 'false');
            core.setOutput('run_id', chosen ? String(chosen.run.id) : '');
            core.setOutput('artifact_id', chosen ? String(chosen.artifact.id) : '');
            core.setOutput('digest', chosen ? String(chosen.artifact.digest || '') : '');
            if (chosen) core.info(`Using source run ${chosen.run.id}, artifact ${chosen.artifact.id}`);

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-49-vix-leader-parameter-tuning
          fetch-depth: 0

      - name: Stop when no artifact exists
        if: steps.source.outputs.found != 'true'
        run: echo "No completed Phase 49 raw artifact was found."

      - name: Download source artifact
        if: steps.source.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: phase49-raw-${{ steps.source.outputs.run_id }}
          path: results/phase49_vix_tuning
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Install dependencies
        if: steps.source.outputs.found == 'true'
        run: python -m pip install --no-input numpy pandas matplotlib tabulate

      - name: Reconcile artifact and generate manuscript
        if: steps.source.outputs.found == 'true'
        env:
          PHASE49_SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          PHASE49_SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          PHASE49_SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.digest }}
        run: python research/phase49_reconcile.py

      - name: Update status, README and research log
        if: steps.source.outputs.found == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('results/phase49_vix_tuning/phase49_final_decision.json'))
          status=[
            '# Phase 49 Status — VIX Leader Parameter Tuning',
            '',
            f"**{d['status']} — CLOSEOUT RECONCILIATION PASSED**",
            '',
            f"Source numerical run: {d['source_run_id']}",
            f"Raw geometries: {d['raw_geometries']}",
            f"Regime-expanded candidates: {d['regime_expanded_candidates']}",
            f"Frozen candidates: {d['frozen_candidates']}",
            f"Validation economic passes: {d['validation_economic_passes']}",
            f"Holm survivors: {d['holm_survivors']}",
            f"Holdout confirmations: {d['holdout_confirmations']}",
            '',
            'Reconciliation modified no numerical P&L values. It repaired/validated packaging and generated the structured manuscript and figures from the persisted artifact.',
            '',
            'Promotion: NO PROMOTION. The canonical strategy remains unchanged.',
          ]
          Path('PHASE49_STATUS.md').write_text('\n'.join(status)+'\n',encoding='utf-8')
          rp=Path('RESEARCH_LOG.md')
          with rp.open('a',encoding='utf-8') as f:
            f.write(
              f"\n\n## Phase 49 automatic closeout — source run {d['source_run_id']}\n"
              f"- Status={d['status']}; frozen={d['frozen_candidates']}; validation economic passes={d['validation_economic_passes']}; Holm survivors={d['holm_survivors']}; holdout confirmations={d['holdout_confirmations']}.\n"
              '- Reconciliation was independent of numerical generation and did not modify trade P&L values.\n'
            )
          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          note=(f"\n\n## Phase 49 final closeout\n\n"
                f"Automatic artifact reconciliation completed from source run {d['source_run_id']}. "
                f"Final decision: **{d['status']}**; frozen candidates={d['frozen_candidates']}; "
                f"validation economic passes={d['validation_economic_passes']}; Holm survivors={d['holm_survivors']}; "
                f"holdout confirmations={d['holdout_confirmations']}. "
                "See `results/phase49_vix_tuning/PHASE49_MANUSCRIPT.md` and `results/phase49_vix_tuning/phase49_final_decision.json`.\n")
          if '## Phase 49 final closeout' not in text:
            readme.write_text(text.rstrip()+note,encoding='utf-8')
          PY

      - name: Commit reconciled evidence
        if: steps.source.outputs.found == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin phase-49-vix-leader-parameter-tuning
          git reset --hard origin/phase-49-vix-leader-parameter-tuning
          git add results/phase49_vix_tuning PHASE49_STATUS.md RESEARCH_LOG.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'phase49: closeout reconciliation and manuscript'
          git push origin HEAD:phase-49-vix-leader-parameter-tuning

      - name: Upload reconciled package
        if: steps.source.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase49-reconciled-${{ steps.source.outputs.run_id }}
          path: results/phase49_vix_tuning
          if-no-files-found: error
