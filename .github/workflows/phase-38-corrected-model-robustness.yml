name: Phase 38 - Corrected Model Robustness

on:
  push:
    branches: [phase-38-corrected-model-robustness]
    paths:
      - 'research/phase38_corrected_model_robustness.py'
      - 'research/phase32_continuous_delta_6x6_backtest.py'
      - 'results/phase37_model_direction_polarity_correction/**'
      - 'PHASE38_RESEARCH_PLAN.md'
      - 'PHASE38_PRE_REGISTRATION.md'
      - '.github/workflows/phase-38-corrected-model-robustness.yml'
  workflow_dispatch:
    inputs:
      sample_start:
        required: false
        default: '2024-01-01'
      sample_end:
        required: false
        default: '2026-06-30'

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: phase38-hf-${{ runner.os }}
          restore-keys: phase38-hf-
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow huggingface_hub
      - name: Recreate canonical control
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SAMPLE_START: ${{ inputs.sample_start || '2024-01-01' }}
          SAMPLE_END: ${{ inputs.sample_end || '2026-06-30' }}
        run: python research/phase32_continuous_delta_6x6_backtest.py
      - name: Run paired robustness
        env:
          SELECTOR: all
        run: python research/phase38_corrected_model_robustness.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dynamic_strategy_phase32 results/phase38_corrected_model_robustness
          git commit -m "Phase 38: persist control-relative robustness results" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
