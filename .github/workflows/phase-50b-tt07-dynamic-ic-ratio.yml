name: Phase 50B - TT07 Dynamic IC to Ratio Replay

on:
  workflow_dispatch:
  push:
    branches:
      - phase-50b-expanded-strategy-universe
    paths:
      - trigger/phase50b_tt07.start

concurrency:
  group: phase50b-tt07-replay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preflight dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Verify TT06 terminal dependency
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("results/phase50b/tt06_intraday_asym_replay")
          terminal=root/"terminal_classification.json"
          assert terminal.is_file(), "Missing TT06 terminal classification"
          t=json.loads(terminal.read_text())
          assert t["strategy"]=="TT-06", t
          assert t["engine_revision"]=="50B-TT06-COVERAGE-V2", t
          if t["status"]=="PASS":
              assert t["pnl_evidence_eligible"] is True, t
              assert t["coverage_rate"]>=0.95, t
              assert t["data_errors"]==0, t
              print("TT06 dependency gate PASS: accepted evidence")
          elif t["status"]=="FAIL_COVERAGE":
              assert t["pnl_evidence_eligible"] is False, t
              assert t["promotion_eligible"] is False, t
              assert t["downstream_use_of_pnl"] is False, t
              assert t["coverage_rate"]<0.95, t
              print("TT06 dependency gate PASS: terminal FAIL_COVERAGE; no TT06 P&L consumed")
          else:
              raise AssertionError(f"Unsupported TT06 terminal status: {t['status']}")
          PY

  numerical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh branch for source-of-truth
        run: |
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Compile TT07 replay
        run: python -m py_compile research/phase50b_tt07_dynamic_ic_ratio_replay.py
      - name: Static TT07 engine-contract audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path("research/phase50b_tt07_dynamic_ic_ratio_replay.py")
          s=p.read_text()
          ast.parse(s)
          tree=ast.parse(s)
          names={n.targets[0].id for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name)}
          assert "TT07_ENGINE_REV" in names
          assert "50B-TT07-COVERAGE-V2" in s
          assert "STATE_SPECS" in s and "TRANSITIONS" in s
          assert "transition_trigger(pos" in s
          print("TT07 engine contract PASS")
          PY
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase50b-tt07-hf-${{ runner.os }}-${{ hashFiles('research/phase50b_tt07_dynamic_ic_ratio_replay.py') }}
          restore-keys: |
            phase50b-tt07-hf-${{ runner.os }}-
      - name: Run TT07 replay
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase50b_tt07_dynamic_ic_ratio_replay.py
      - name: Audit TT07 artifacts
        run: |
          set -euo pipefail
          test -s results/phase50b/tt07_dynamic_ic_ratio_replay/summary.json
          test -f results/phase50b/tt07_dynamic_ic_ratio_replay/tt07_trades.csv
          test -f results/phase50b/tt07_dynamic_ic_ratio_replay/data_errors.csv
          test -f results/phase50b/tt07_dynamic_ic_ratio_replay/coverage_gaps.csv
          test -f results/phase50b/tt07_dynamic_ic_ratio_replay/transition_diagnostics.csv
          test -f results/phase50b/tt07_dynamic_ic_ratio_replay/entry_exclusions.csv
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open("results/phase50b/tt07_dynamic_ic_ratio_replay/summary.json"))
          tr=pd.read_csv("results/phase50b/tt07_dynamic_ic_ratio_replay/tt07_trades.csv")
          er=pd.read_csv("results/phase50b/tt07_dynamic_ic_ratio_replay/data_errors.csv")
          cg=pd.read_csv("results/phase50b/tt07_dynamic_ic_ratio_replay/coverage_gaps.csv")
          ex=pd.read_csv("results/phase50b/tt07_dynamic_ic_ratio_replay/entry_exclusions.csv")
          assert d["engine_revision"]=="50B-TT07-COVERAGE-V2", d
          assert d["trades"]==len(tr), d
          assert d["candidate_trades"]==len(tr)+len(cg), d
          assert d["coverage_rate"]>=0.95, d
          assert d.get("entry_exclusions",0)==len(ex), d
          assert {"net","net50","net20","net20_50","vix_state"}.issubset(tr.columns)
          assert len(er)==0, er.head()
          print("TT07 replay audit PASS", d)
          PY
      - name: Upload TT07 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase50b-tt07-${{ github.run_id }}
          path: results/phase50b/tt07_dynamic_ic_ratio_replay
      - name: Publish TT07 results safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R results/phase50b/tt07_dynamic_ic_ratio_replay "$tmp/"
          git fetch origin phase-50b-expanded-strategy-universe
          git reset --hard origin/phase-50b-expanded-strategy-universe
          rm -rf results/phase50b/tt07_dynamic_ic_ratio_replay
          mkdir -p results/phase50b
          cp -R "$tmp/tt07_dynamic_ic_ratio_replay" results/phase50b/
          git add results/phase50b/tt07_dynamic_ic_ratio_replay
          if git diff --cached --quiet; then
            echo "No TT07 result changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Phase 50B: publish TT07 common-cost replay"
            git push origin HEAD:phase-50b-expanded-strategy-universe
          fi
