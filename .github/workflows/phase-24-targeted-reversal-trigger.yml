name: Phase 24 targeted reversal trigger

# Trigger registration verified for phase-24-targeted-reversal-trigger

on:
  push:
    branches:
      - phase-24-targeted-reversal-trigger
    paths:
      - "PHASE24_PRE_REGISTRATION.md"
      - "research/phase24_targeted_reversal.py"
      - ".github/workflows/phase-24-targeted-reversal-trigger.yml"
      - "results/dynamic_n_corrected/phase23_entry_state/phase23_entry_features.csv"
      - "results/dynamic_n_corrected/phase23_entry_state/canonical_trade_ledger.csv"
      - "results/dynamic_n_corrected/phase23_entry_state/reverse_trade_ledger.csv"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-24-targeted-reversal-trigger
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-phase24-${{ runner.os }}-v1
          restore-keys: |
            pip-phase24-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn
      - name: Compile
        run: |
          python -m py_compile research/phase23_model.py
          python -m py_compile research/phase24_targeted_reversal.py
      - name: Run Phase 24
        run: python research/phase24_targeted_reversal.py
      - name: Persist artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dynamic_n_corrected/phase24_targeted_reversal
          git commit -m "Phase 24: persist targeted reversal results" || true
          git pull --rebase origin phase-24-targeted-reversal-trigger
          git push origin HEAD:phase-24-targeted-reversal-trigger
