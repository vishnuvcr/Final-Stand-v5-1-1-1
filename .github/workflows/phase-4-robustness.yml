name: Phase 4 Restarted Robustness

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-restarted-v2-v1
          restore-keys: |
            hf-nifty-options-restarted-v2-
      - name: Run robustness scenarios
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python research/run_phase4_robustness.py
      - name: Persist Phase 4 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/restarted_v2/phase4
          git commit -m 'Phase 4: persist robustness results' || echo 'No result changes'
          git push origin HEAD:${GITHUB_REF_NAME} || true
