name: Phase 74 — DhanHQ fixed-strike stitch feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - phase-74-fixed-strike-stitch-feasibility
    paths:
      - "scripts/phase74_fixed_strike_stitch.py"
      - ".github/workflows/phase74-fixed-strike-stitch-feasibility.yml"

permissions:
  contents: write

jobs:
  bounded-stitch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run fixed-strike stitch feasibility audit
        run: python3 scripts/phase74_fixed_strike_stitch.py
      - name: Publish aggregate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase74_fixed_strike_stitch/summary.json results/phase74_fixed_strike_stitch/report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Record Phase 74 fixed-strike stitching audit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
