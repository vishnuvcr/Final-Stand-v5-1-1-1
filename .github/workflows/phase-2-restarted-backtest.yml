name: Phase 2 Restarted Backtest - Two Stage OTM Ratio

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date YYYY-MM-DD
        required: false
        default: '2021-05-27'
      end_date:
        description: End date YYYY-MM-DD
        required: false
        default: '2026-09-30'
      high_n_threshold:
        description: X(n) threshold relative to selected-side maximum X
        required: false
        default: '0.95'
      slippage_ticks:
        description: Adverse slippage per leg in ticks
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow huggingface_hub
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-restarted-v2-v1
          restore-keys: |
            hf-nifty-options-restarted-v2-
      - name: Run restarted backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START_DATE: ${{ github.event.inputs.start_date || '2021-05-27' }}
          END_DATE: ${{ github.event.inputs.end_date || '2026-09-30' }}
          HIGH_N_THRESHOLD: ${{ github.event.inputs.high_n_threshold || '0.95' }}
          SLIPPAGE_TICKS: ${{ github.event.inputs.slippage_ticks || '1' }}
          OUT_DIR: results/restarted_v2
        run: python research/backtest_restarted_v2.py
      - name: Persist results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/restarted_v2 || true
          git commit -m 'Phase 2 restarted: persist two-stage backtest results' || echo 'No result changes'
          git push origin HEAD:${GITHUB_REF_NAME} || true
