name: Phase 8B Corrected Fixed OTM15 Statistics

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  statistics:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_PHASE8B]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run Phase 8 statistics
        run: python research/analyze_fixed_otm15.py
      - name: Persist Phase 8 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/fixed_otm15_v3/phase8b
          git commit -m 'Phase 8B: persist corrected fixed OTM15 statistics' || echo 'No result changes'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
