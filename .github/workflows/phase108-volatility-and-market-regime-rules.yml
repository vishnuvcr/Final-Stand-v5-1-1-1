name: Phase 108 — Volatility-regime EOD strategy candidates

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date inclusive"
        required: true
        default: "2026-09-02"
        type: string
      to_date:
        description: "End date exclusive"
        required: true
        default: "2026-10-02"
        type: string
  push:
    branches:
      - phase-108-volatility-and-market-regime-rules
    paths:
      - "PHASE108_RESEARCH_PLAN.md"
      - "research/phase108_eod_ohlc_strategy_pilot.py"
      - "tests/phase108/**"
      - ".github/workflows/phase108-volatility-and-market-regime-rules.yml"

concurrency:
  group: phase108-volatility-and-market-regime-rules
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHASE108_FROM_DATE: ${{ inputs.from_date || '2026-09-02' }}
      PHASE108_TO_DATE: ${{ inputs.to_date || '2026-10-02' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-108-volatility-and-market-regime-rules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression tests
        id: tests
        run: python -m unittest discover -s tests/phase108 -p "test_*.py" -v
      - name: Run ten-candidate screen
        if: steps.tests.outcome == 'success'
        run: python research/phase108_eod_ohlc_strategy_pilot.py --from-date "$PHASE108_FROM_DATE" --to-date "$PHASE108_TO_DATE"
      - name: Upload aggregate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase108-volatility-and-market-regime-rules
          path: results/phase108/**
          if-no-files-found: warn
          retention-days: 90
      - name: Publish results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase108 PHASE108_STATUS.md PHASE108_RESEARCH_LOG.md PHASE108_ERROR_LOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Phase 108: publish volatility-regime screening"
            git fetch origin phase-108-volatility-and-market-regime-rules
            git rebase origin/phase-108-volatility-and-market-regime-rules
            git push origin HEAD:phase-108-volatility-and-market-regime-rules
          fi
