name: Phase 101 — Full PDF Strategy Replication
on:
  push:
    branches: [phase-101-full-pdf-strategy-replication]
    paths:
      - 'research/phase101/**'
      - 'tests/test_phase101_replay.py'
      - 'requirements-phase101.txt'
      - 'PHASE101_RESEARCH_PLAN.md'
      - '.github/workflows/phase101-full-pdf-strategy-replication.yml'
  workflow_dispatch:
    inputs:
      force_rerun:
        description: "Run the frozen Phase 101 suite again"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: phase101-full-pdf-strategy-replication
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Phase 101 branch
        uses: actions/checkout@v4
      - name: Checkout validated Phase 66 data helpers
        uses: actions/checkout@v4
        with:
          repository: vishnuvcr/Final-Stand-v5-1-1-1
          ref: phase-66-ohcl-paper-replication
          path: evidence/phase66
          persist-credentials: false
      - name: Sync serialized phase run to latest branch tip
        run: |
          git fetch origin phase-101-full-pdf-strategy-replication
          git reset --hard origin/phase-101-full-pdf-strategy-replication
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-phase101.txt
      - name: Restore pinned Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase101-hf-${{ runner.os }}-3eacf762d401efd9a08e804592fa7882b354c4a2
          restore-keys: |
            phase101-hf-${{ runner.os }}-
            hf-phase66-${{ runner.os }}-3eacf762d401efd9a08e804592fa7882b354c4a2
      - name: Restore Phase 101 daily-market cache
        uses: actions/cache@v4
        with:
          path: .cache/phase101
          key: phase101-yahoo-${{ runner.os }}-nifty-daily-2015-2025-v1
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-phase101.txt
      - name: Verify Parquet engine before data acquisition
        run: |
          python - <<'PY'
          import numpy, pandas, pyarrow
          import pyarrow.parquet
          print({"numpy": numpy.__version__, "pandas": pandas.__version__, "pyarrow": pyarrow.__version__})
          PY
      - name: Static syntax and deterministic unit tests
        run: |
          python -m py_compile research/phase101/paper_strategy_replay.py
          python -m pytest -q tests/test_phase101_replay.py
      - name: Run U02 and U05 historical proxy tests
        run: python research/phase101/paper_strategy_replay.py
      - name: Validate aggregate result contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out = Path("results/phase101_pdf_strategy_tests")
          required = [
            "PHASE101_REPORT.md", "u05_trade_ledger.csv", "u05_opportunity_audit.csv",
            "u05_summary.csv", "u02_model_metrics.csv", "u02_model_status.csv",
            "u02_predictions.csv", "u02_coverage_audit.csv", "u02_trade_ledger.csv",
            "u02_strategy_summary.csv", "paper_test_matrix.csv",
            "phase101_source_manifest.json", "validation_report.json",
            "u02_feature_manifest.json", "net_pnl_comparison.svg"
          ]
          missing = [f for f in required if not (out / f).is_file() or (out / f).stat().st_size == 0]
          if missing:
            raise SystemExit("Missing/empty Phase 101 outputs: " + ", ".join(missing))
          manifest = json.loads((out / "phase101_source_manifest.json").read_text())
          validation = json.loads((out / "validation_report.json").read_text())
          matrix = pd.read_csv(out / "paper_test_matrix.csv")
          u05_audit = pd.read_csv(out / "u05_opportunity_audit.csv")
          if len(matrix) != 14 or matrix.paper_id.nunique() != 14:
            raise SystemExit("The final paper matrix must contain 14 unique PDFs")
          if manifest.get("holdout_2026_option_files_downloaded") != 0:
            raise SystemExit("2026 options holdout safeguard failed")
          if str(manifest.get("maximum_option_expiry_selected", "")) > "2025-12-31":
            raise SystemExit("An option expiry later than 2025-12-31 was selected")
          if len(u05_audit) != validation.get("u05_opportunity_rows"):
            raise SystemExit("U05 audit row count disagrees with validation report")
          if validation.get("strategy_promoted") is not False:
            raise SystemExit("A strategy must not be promoted by this phase")
          report = (out / "PHASE101_REPORT.md").read_text()
          for heading in ["Research question", "U05", "U02", "Conclusion", "Limitations", "Future work"]:
            if heading.lower() not in report.lower():
              raise SystemExit(f"Required report section missing: {heading}")
          print(json.dumps({"validation":"PASS","paper_rows":len(matrix),
            "u05_trades":validation.get("u05_trade_rows"),"u02_trades":validation.get("u02_trade_rows"),
            "holdout_2026_option_files_downloaded":0,"strategy_promoted":False}, indent=2))
          PY
      - name: Reconcile status and research log
        if: success()
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path("results/phase101_pdf_strategy_tests")
          v = json.loads((out / "validation_report.json").read_text())
          u05 = next(csv.DictReader((out / "u05_summary.csv").open()))
          statuses = list(csv.DictReader((out / "u02_model_status.csv").open()))
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          run = os.environ.get("GITHUB_RUN_ID", "unknown")
          block = f"""\n\n## Runtime checkpoint — {stamp}\n\n- Automated workflow run: https://github.com/vishnuvcr/Final-Stand-v5-1-1-1/actions/runs/{run}\n- Validation report: {v.get('overall_status')}; 14-paper matrix present; 2026 option holdout not downloaded; no strategy promoted.\n- U05 completed trades: {u05.get('completed_trades')}; sample status: {u05.get('status')}; audit status counts: {u05.get('audit_status_counts')}.\n- U02 predictions: {v.get('u02_predictions')}; completed trades: {v.get('u02_trade_rows')}; model statuses: {statuses}.\n- Result files are aggregate/derived only. A model/data blocker is not a negative efficacy finding.\n"""
          p = Path("PHASE101_STATUS.md")
          p.write_text(p.read_text() + block)
          Path("PHASE101_RESEARCH_LOG.md").write_text(Path("PHASE101_RESEARCH_LOG.md").read_text() + block)
          Path("PHASE101_CHAT_LOG.md").write_text(Path("PHASE101_CHAT_LOG.md").read_text() + f"\n\n- **Automated result:** run {run}; status reconciled at {stamp}; no strategy promotion.\n")
          Path("PHASE101_ERROR_LOG.md").write_text(Path("PHASE101_ERROR_LOG.md").read_text() + f"\n\n## Run reconciliation — {stamp}\n- Workflow {run} completed aggregate validation. No runner exception was raised; inspect report and model status CSV for explicit data/model blockers.\n")
          PY
      - name: Publish aggregate research outputs and phase state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase101_pdf_strategy_tests PHASE101_STATUS.md PHASE101_RESEARCH_LOG.md PHASE101_CHAT_LOG.md PHASE101_ERROR_LOG.md
          git diff --cached --quiet || git commit -m "phase 101: publish corrected PDF strategy test outputs"
          git fetch origin phase-101-full-pdf-strategy-replication
          if ! git rebase origin/phase-101-full-pdf-strategy-replication; then
            # Upstream contains newer manual research corrections. Preserve those log files;
            # keep the aggregate output files from this run, then continue the result commit.
            for f in PHASE101_STATUS.md PHASE101_RESEARCH_LOG.md PHASE101_CHAT_LOG.md PHASE101_ERROR_LOG.md; do
              git checkout --ours -- "$f"
            done
            git add PHASE101_STATUS.md PHASE101_RESEARCH_LOG.md PHASE101_CHAT_LOG.md PHASE101_ERROR_LOG.md
            GIT_EDITOR=true git rebase --continue
          fi
          # Reconcile status only after report/output contract passed and rebase succeeded.
          python - <<'PY'
          import csv, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          out = Path("results/phase101_pdf_strategy_tests")
          v = json.loads((out / "validation_report.json").read_text())
          u05 = next(csv.DictReader((out / "u05_summary.csv").open()))
          statuses = list(csv.DictReader((out / "u02_model_status.csv").open()))
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          run = os.environ.get("GITHUB_RUN_ID", "unknown")
          status = Path("PHASE101_STATUS.md")
          text = status.read_text()
          text = text.replace("**State:** OPEN — first proxy outputs generated, but invalidated by a detected U05 calendar look-ahead and U02 capital-reuse flaw; corrected rerun pending", "**State:** CORRECTED PROXY RUN VALIDATED — final paper-by-paper audit recorded below")
          text = text.replace("| RETESTING |", "| VALIDATED_PROXY_TEST |", 2)
          status.write_text(text + f"\n\n## Corrected runtime checkpoint — {stamp}\n\n- Run: https://github.com/vishnuvcr/Final-Stand-v5-1-1-1/actions/runs/{run}\n- Validation: {v.get('overall_status')}; 14-paper matrix; no 2026 option data; no strategy promoted.\n- U05: {u05.get('completed_trades')} completed / {v.get('u05_opportunity_rows')} opportunities; status {u05.get('status')}; audit counts {u05.get('audit_status_counts')}.\n- U02: {v.get('u02_predictions')} predictions; {v.get('u02_trade_rows')} costed trades; model statuses {statuses}.\n- Account sizing: sequential per-model ₹1 lakh starting equity, 95% premium deployment limit, 5% fee reserve.\n- Bootstrap: circular moving-block 95% mean net-trade CI only when n>=20.\n")
          checkpoint = f"\n\n## Corrected run {run} — {stamp}\n- Validation: {v.get('overall_status')}; U05 completed trades {u05.get('completed_trades')}; U02 costed trades {v.get('u02_trade_rows')}; no 2026 option data; no strategy promoted.\n- U05 timing corrected to enforce entry strictly after the Wednesday forecast. U02 now carries sequential account equity per model.\n"
          for name in ["PHASE101_RESEARCH_LOG.md", "PHASE101_CHAT_LOG.md"]:
            p = Path(name); p.write_text(p.read_text() + checkpoint)
          p = Path("PHASE101_ERROR_LOG.md")
          p.write_text(p.read_text() + f"\n\n## Corrected replay result — {stamp}\n- Workflow run: https://github.com/vishnuvcr/Final-Stand-v5-1-1-1/actions/runs/{run}\n- Previous U05 look-ahead and U02 repeated-capital figures are superseded. The corrected workflow completed output validation; review the report and per-opportunity/coverage ledgers before interpreting performance.\n")
          PY
          git add PHASE101_STATUS.md PHASE101_RESEARCH_LOG.md PHASE101_CHAT_LOG.md PHASE101_ERROR_LOG.md
          git diff --cached --quiet || git commit -m "phase 101: reconcile corrected PDF replay status"
          git fetch origin phase-101-full-pdf-strategy-replication
          git rebase origin/phase-101-full-pdf-strategy-replication
          git push origin HEAD:phase-101-full-pdf-strategy-replication
      - name: Record runtime failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase101-failure
          cp results/phase101_pdf_strategy_tests/phase101_runtime_error.json /tmp/phase101-failure/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin phase-101-full-pdf-strategy-replication
          git reset --hard origin/phase-101-full-pdf-strategy-replication
          mkdir -p results/phase101_pdf_strategy_tests
          if [ -f /tmp/phase101-failure/phase101_runtime_error.json ]; then cp /tmp/phase101-failure/phase101_runtime_error.json results/phase101_pdf_strategy_tests/; fi
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          run=os.environ.get("GITHUB_RUN_ID","unknown")
          sha=os.environ.get("GITHUB_SHA","unknown")
          stamp=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          text=f"\n\n## Automated failure — {stamp}\n- Workflow run: https://github.com/vishnuvcr/Final-Stand-v5-1-1-1/actions/runs/{run}\n- Commit: {sha}\n- Numerical outputs from the failed run are not accepted. See `results/phase101_pdf_strategy_tests/phase101_runtime_error.json` when produced and inspect the Actions log.\n- Correct the root cause without weakening frozen strategy rules or opening 2026 data.\n"
          p=Path("PHASE101_ERROR_LOG.md"); p.write_text(p.read_text()+text)
          p=Path("PHASE101_CHAT_LOG.md"); p.write_text(p.read_text()+f"\n- Automated run {run} failed at runtime; failure logged.\n")
          PY
          git add PHASE101_ERROR_LOG.md PHASE101_CHAT_LOG.md results/phase101_pdf_strategy_tests/phase101_runtime_error.json
          git commit -m "phase 101: record corrected replay failure"
          git push origin HEAD:phase-101-full-pdf-strategy-replication
      - name: Upload aggregate-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase101-pdf-strategy-results-${{ github.run_id }}
          path: results/phase101_pdf_strategy_tests/
          if-no-files-found: warn
          retention-days: 30
