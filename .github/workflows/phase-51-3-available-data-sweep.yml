name: Phase 51-3 - Available Data Strategy Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - phase-51-3-available-data-strategy-sweep
    paths:
      - trigger/phase51_3.start
      - research/phase51_3_available_data_sweep.py
      - PHASE51_3_RESEARCH_PLAN.md

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --no-input numpy pandas pyarrow scipy matplotlib huggingface_hub
      - name: Compile frozen engines and wrapper
        run: |
          python -m py_compile research/phase51_3_available_data_sweep.py
          python -m py_compile research/phase50b_tt02_calendar_replay_v3.py
          python -m py_compile research/phase50b_tt04_premium_match_replay.py
          python -m py_compile research/phase50b_tt05_short_straddle_replay.py
      - name: HF cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: phase51-3-hf-${{ runner.os }}-${{ hashFiles('research/phase51_3_available_data_sweep.py','research/phase50b_tt02_calendar_replay_v3.py','research/phase50b_tt04_premium_match_replay.py','research/phase50b_tt05_short_straddle_replay.py') }}
          restore-keys: |
            phase51-3-hf-${{ runner.os }}-
      - name: Run available-data sweep
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/phase51_3_available_data_sweep.py
      - name: Audit outputs
        run: |
          set -euo pipefail
          test -s results/phase51/available_oos/sweep_summary.json
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("results/phase51/available_oos/sweep_summary.json")
          d=json.loads(p.read_text())
          assert d["window"] == ["2026-04-21","2026-07-21"]
          assert not d["errors"], d["errors"]
          for name in ("TT02","TT04","TT05"):
              s=d["results"][name]
              assert s.get("phase51_3_window")==["2026-04-21","2026-07-21"]
              out=pathlib.Path("results/phase51/available_oos")/name.lower()
              assert (out/"summary.json").exists()
              assert (out/"data_errors.csv").exists()
          print("Phase 51-3 artifact audit PASS")
          print(json.dumps(d, indent=2))
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase51-3-available-oos-${{ github.run_id }}
          path: results/phase51/available_oos
      - name: Publish results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase51/available_oos
          git diff --cached --quiet || git commit -m "Phase 51-3: publish available-data OOS sweep"
          git push origin HEAD:phase-51-3-available-data-strategy-sweep
