name: Phase 22 entry filter loss avoidance research

on:
  push:
    branches:
      - phase-22-entry-filter-loss-avoidance
    paths:
      - "research/entry_filter_loss_avoidance.py"
      - "PHASE22_PRE_REGISTRATION.md"
      - "DYNAMIC_N_RESEARCH_PLAN.md"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-\${{ runner.os }}-v1
          restore-keys: |
            hf-nifty-options-\${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub
      - name: Run Phase 22
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: python research/entry_filter_loss_avoidance.py
      - name: Persist Phase 22 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin phase-22-entry-filter-loss-avoidance
          git rebase origin/phase-22-entry-filter-loss-avoidance
          git add results/dynamic_n_corrected/phase22_entry_filter_loss_avoidance
          git commit -m "Phase 22: persist entry-filter research results" || exit 0
          git push origin HEAD:phase-22-entry-filter-loss-avoidance
