name: Phase 39 - Advanced Direction Model Preflight

on:
  push:
    branches: [phase-39-advanced-direction-models]
    paths:
      - 'PHASE39_RESEARCH_PLAN.md'
      - 'PHASE39_PRE_REGISTRATION.md'
      - 'PHASE39_LITERATURE_REVIEW.md'
      - 'results/phase39_candidate_method_registry.csv'
      - 'results/phase38_corrected_model_robustness/frozen_control_*'
      - 'research/phase39_preflight.py'
      - '.github/workflows/phase-39-advanced-direction-models.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow
      - name: Validate preregistration and frozen benchmark
        run: python research/phase39_preflight.py
      - name: Persist preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39_preflight.json
          git commit -m 'Phase 39: persist research preflight' || true
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin 'HEAD:'${GITHUB_REF_NAME}
