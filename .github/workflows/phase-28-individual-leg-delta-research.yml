name: Phase 28 individual-leg delta research

concurrency:
  group: phase28-individual-leg-delta
  cancel-in-progress: true

on:
  push:
    branches:
      - phase-28-individual-leg-delta-research
    paths:
      - "research/phase28_leg_delta_research.py"
      - "PHASE28_PRE_REGISTRATION.md"
      - ".github/workflows/phase-28-individual-leg-delta-research.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  phase28:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-28-individual-leg-delta-research
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nifty-options-${{ runner.os }}-v1
          restore-keys: hf-nifty-options-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub
      - name: Compile
        run: python -m py_compile research/phase28_leg_delta_research.py
      - name: Run Phase 28
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OUT_DIR: results/dynamic_n_corrected/phase28_leg_delta_exit
        run: python research/phase28_leg_delta_research.py
      - name: Persist Phase 28 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/dynamic_n_corrected/phase28_leg_delta_exit
          git commit -m "Phase 28: persist individual-leg delta results" || true
          git fetch origin phase-28-individual-leg-delta-research
          git rebase origin/phase-28-individual-leg-delta-research
          git push origin HEAD:phase-28-individual-leg-delta-research
