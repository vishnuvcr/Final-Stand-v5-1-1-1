name: Phase 54 — OHLC Reference Sensitivity (Non-Executable)

on:
  workflow_dispatch:
  push:
    branches:
      - phase-54-ohcl-reference-sensitivity
    paths:
      - ".github/workflows/phase-54-ohcl-reference-sensitivity.yml"
      - "research/phase54/**"
      - "results/phase52/historical_pilot/event_replay.csv"

permissions:
  contents: write

concurrency:
  group: phase54-ohcl-sensitivity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current phase branch
        uses: actions/checkout@v4
        with:
          ref: phase-54-ohcl-reference-sensitivity
          fetch-depth: 0
      - name: Refresh latest branch tip before running
        shell: bash
        run: |
          git fetch origin phase-54-ohcl-reference-sensitivity
          git checkout phase-54-ohcl-reference-sensitivity
          git reset --hard origin/phase-54-ohcl-reference-sensitivity
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove stale report output
        run: rm -rf results/phase54/ohlc_reference_sensitivity
      - name: Regression tests
        run: |
          python -m unittest discover -s research/phase54/tests -v
          python research/phase54/ohlc_reference_sensitivity.py --self-test-only
      - name: Run frozen-candidate sensitivity (no P&L)
        run: python research/phase54/ohlc_reference_sensitivity.py
      - name: Validate frozen input reconciliation and computed thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("results/phase54/ohlc_reference_sensitivity/report.json").read_text())
          assert report["input"]["row_count"] == 480
          assert report["baseline_status_counts"] == {
              "BLOCKED_LEG_ELIGIBILITY": 100,
              "EXCLUDED_OHLC_RANGE_PROXY": 379,
              "REPLAY_PASS": 1,
          }, report["baseline_status_counts"]
          assert report["input"]["input_sha256"], "missing input fingerprint"
          assert len(report["threshold_sensitivity"]) == 11
          if report["frozen_rules"]["threshold_sensitivity_computed"]:
              for row in report["threshold_sensitivity"]:
                  assert row["computable"] is True
                  assert row["reconciliation_total"] == 480
                  assert row["eligible_rows"] + row["oi_or_legs_rejected_rows"] + row["entry_data_rejected_rows"] + row["range_rejected_rows"] == 480
              assert report["oi_rejections_invariant_across_thresholds"] is True
              assert report["entry_data_rejections_invariant_across_thresholds"] is True
              assert report["eligible_rows_monotonic_non_decreasing"] is True
          else:
              assert all(row["computable"] is False for row in report["threshold_sensitivity"])
          print(json.dumps({
              "status": report["status"],
              "input_sha256": report["input"]["input_sha256"],
              "threshold_sensitivity_computed": report["frozen_rules"]["threshold_sensitivity_computed"],
              "thresholds": report["threshold_sensitivity"],
          }, indent=2))
          PY
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase54-ohcl-sensitivity-${{ github.run_id }}
          path: results/phase54/ohlc_reference_sensitivity/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist status, research, error and chat logs
        if: always()
        shell: bash
        env:
          PHASE_BRANCH: phase-54-ohcl-reference-sensitivity
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          status = os.environ.get("JOB_STATUS", "unknown")
          path = Path("results/phase54/ohlc_reference_sensitivity/report.json")
          report = json.loads(path.read_text()) if path.exists() else None
          if report:
              statuses = report["baseline_status_counts"]
              threshold_lines = report.get("threshold_sensitivity", [])
              if report.get("frozen_rules", {}).get("threshold_sensitivity_computed"):
                  threshold_summary = "; ".join(
                      f"{x['threshold_pct']}%: {x['eligible_rows']}/{report['input']['row_count']} eligible "
                      f"(OI/leg reject={x['oi_or_legs_rejected_rows']}, entry-data reject={x['entry_data_rejected_rows']}, "
                      f"range reject={x['range_rejected_rows']})"
                      for x in threshold_lines
                  )
              else:
                  threshold_summary = "NOT COMPUTED; incomplete/non-conclusive per-leg evidence gate remains closed."
              summary = (
                  f"- Run: [{run_id}]({run_url}); workflow job status={status}.\n"
                  f"- Input rows={report['input']['row_count']}; input SHA-256={report['input']['input_sha256']}; "
                  f"baseline statuses={json.dumps(statuses, sort_keys=True)}.\n"
                  f"- Complete leg payload rows={report['complete_leg_payload_rows']}; incomplete={report['incomplete_leg_payload_rows']}; "
                  f"explicit hard prior-OI blockers={report.get('known_hard_oi_block_rows', 0)}; "
                  f"range-excluded rows with complete legs={report['range_excluded_rows_with_complete_leg_payload']}.\n"
                  f"- Sensitivity decision={report['status']}; threshold results: {threshold_summary}\n"
                  "- Candle range is not a bid/ask spread. No P&L, fills, exits or commercial/live strategy promotion inferred; holdout untouched.\n"
              )
          else:
              summary = f"- Run: [{run_id}]({run_url}); workflow job status={status}. Report missing; no conclusion accepted.\n"
          for filename, heading in [
              ("PHASE54_STATUS.md", f"## Run checkpoint {run_id}"),
              ("PHASE54_RESEARCH_LOG.md", f"## Run checkpoint {run_id}"),
              ("PHASE54_CHAT_LOG.md", f"## Automated run {run_id}"),
          ]:
              p = Path(filename)
              p.write_text(p.read_text(encoding="utf-8").rstrip() + "\n\n" + heading + "\n\n" + summary, encoding="utf-8")
          if status != "success" or report is None:
              p = Path("PHASE54_ERROR_LOG.md")
              p.write_text(p.read_text(encoding="utf-8").rstrip() +
                  f"\n\n## F54-RUN-{run_id} — workflow/report failure\n\n- Run: {run_url}\n- Job status: {status}\n- Report present: {report is not None}\n- No result or strategy conclusion accepted.\n- Status: OPEN.\n", encoding="utf-8")
          readme = Path("README.md")
          readme.write_text(readme.read_text(encoding="utf-8").rstrip() +
              f"\n\n## Phase 54 OHLC-reference sensitivity — run {run_id}\n\n" + summary +
              "- [Plan](PHASE54_RESEARCH_PLAN.md) · [Status](PHASE54_STATUS.md) · [Results](results/phase54/ohlc_reference_sensitivity/report.md)\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE54_STATUS.md PHASE54_RESEARCH_LOG.md PHASE54_CHAT_LOG.md PHASE54_ERROR_LOG.md README.md
          if [[ -d results/phase54/ohlc_reference_sensitivity ]]; then git add results/phase54/ohlc_reference_sensitivity; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase54 sensitivity checkpoint $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git fetch origin "$PHASE_BRANCH"
            if git rebase origin/"$PHASE_BRANCH"; then
              if git push origin "$PHASE_BRANCH"; then exit 0; fi
            else
              echo "Rebase conflict; refusing to overwrite research logs." >&2
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
